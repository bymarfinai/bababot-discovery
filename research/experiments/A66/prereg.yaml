  "scientific_question": "Holding early adverse-excursion severity approximately constant, does the sequence by which price reclaims and sustains ground after the snapshot worst excursion distinguish genuine L0/M0 reference-invalidation losses from eventual winners at the same 60m or 120m age?",
  "hypothesis": "At comparable running_mae_R severity, eventual winners exhibit stronger sequence-level reclaim behavior after the first occurrence of the snapshot worst low: they recover a larger fraction of the adverse excursion, reach a half-reclaim sooner, sustain that half-reclaim for longer, spend more of the remaining path holding above it, and accumulate less of their final adverse excursion late in the observation window. L0/M0 cases show weaker or later reclaim and more continued adverse extension.",
