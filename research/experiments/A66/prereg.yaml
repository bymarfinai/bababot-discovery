  "finite_feature_set": [
    {
      "name": "max_reclaim_fraction_of_mae",
      "formula": "max(0, max(post-worst completed close) - snapshot_worst_low) / max(H - snapshot_worst_low, epsilon)",
      "preregistered_l0_direction": "lower"
