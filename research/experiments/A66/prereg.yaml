    },
    {
      "name": "post_half_reclaim_hold_fraction",
      "formula": "after the first completed close >= half_reclaim_level, fraction of remaining completed closes that stay >= half_reclaim_level; zero when no half reclaim occurs",
      "preregistered_l0_direction": "lower"
    },
    {
      "name": "late_mae_extension_fraction",
      "formula": "max(0, snapshot_running_mae_R - midpoint_running_mae_R) / max(snapshot_running_mae_R, epsilon)",
      "preregistered_l0_direction": "higher"
    }
