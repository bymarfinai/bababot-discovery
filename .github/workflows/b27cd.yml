name: B27CD R4-risk clock-adaptive SHORT economics

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_clock_adaptive_r4_risk_econ_b27cd.py'
      - 'BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Preregistration.md'
      - '.github/workflows/b27cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27CD with persisted diagnostics
        id: run_b27cd
        shell: bash
        run: |
          set +e
          echo "B27CD diagnostic run start" > BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log
          echo "commit=$GITHUB_SHA" >> BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log
          python -m py_compile research/btc_24h_clock_adaptive_r4_risk_econ_b27cd.py >> BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log 2>&1
          c=$?
          echo "compile_exit_code=$c" >> BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_clock_adaptive_r4_risk_econ_b27cd.py >> BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27cd-results
          path: |
            BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Result.md
            BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Trades.csv
            BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Stops.csv
            BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Status.txt
            BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_Run.log
      - name: Persist B27CD outputs or diagnostics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_CLOCK_ADAPTIVE_R4_RISK_ECON_B27CD_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CD R4-risk SHORT economic outputs'
            git push
          fi
      - name: Fail if B27CD script failed
        if: steps.run_b27cd.outputs.rc != '0'
        run: exit 1
