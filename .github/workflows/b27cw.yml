name: B27CW clock-specific full-loser threshold

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_full_loser_clock_threshold_b27cw.py'
      - 'BTC_24H_FULL_LOSER_CLOCK_THRESHOLD_B27CW_Preregistration.md'
      - '.github/workflows/b27cw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - name: Run B27CW
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_24H_FULL_LOSER_CLOCK_THRESHOLD_B27CW_Run.log
          echo 'B27CW run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_24h_full_loser_clock_threshold_b27cw.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_full_loser_clock_threshold_b27cw.py >> "$LOG" 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27cw-results
          path: |
            BTC_24H_FULL_LOSER_CLOCK_THRESHOLD_B27CW_*
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_FULL_LOSER_CLOCK_THRESHOLD_B27CW_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CW clock-specific threshold outputs'
            git push
          fi
      - name: Fail if script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
