name: B26C
on:
  push:
    paths:
      - '.github/workflows/b26c.yml'
      - 'research/btc_previous_session_direct_sweep_b26c.py'
      - 'BTC_PREVIOUS_SESSION_DIRECT_SWEEP_B26C_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_PREVIOUS_SESSION_DIRECT_SWEEP_B26C_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_PREVIOUS_SESSION_DIRECT_SWEEP_B26C_Status.txt
          git commit -m 'ci: mark B26C runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_previous_session_direct_sweep_b26c.py
      - run: cd research && python btc_previous_session_direct_sweep_b26c.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_PREVIOUS_SESSION_DIRECT_SWEEP_B26C_Result.md BTC_PREVIOUS_SESSION_DIRECT_SWEEP_B26C_Summary.csv BTC_PREVIOUS_SESSION_DIRECT_SWEEP_B26C_Trades.csv
          git commit -m 'research: persist B26C direct previous-session sweep result' || true
          git push
