name: B27A Research
on:
  push:
    paths:
      - '.github/workflows/b27a.yml'
      - 'research/btc_previous_bar_breakout_b27a.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: cd research && python btc_previous_bar_breakout_b27a.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_PREVIOUS_BAR_BREAKOUT_B27A_Result.md BTC_PREVIOUS_BAR_BREAKOUT_B27A_Summary.csv BTC_PREVIOUS_BAR_BREAKOUT_B27A_Trades.csv
          git commit -m 'research: persist B27A result' || true
          git push
