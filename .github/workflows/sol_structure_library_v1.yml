name: SOL Structural Detector Library V1

on:
  push:
    branches:
      - sol-structure-library-v1
    paths:
      - 'research/sol_structure_library_v1.py'
      - 'research/SOL_STRUCTURE_LIBRARY_V1_PREREG.md'
      - '.github/workflows/sol_structure_library_v1.yml'
  workflow_dispatch:

jobs:
  structure-library:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Compile frozen structural library
        run: python -m py_compile research/sol_structure_library_v1.py
      - name: Run frozen structural library
        run: python research/sol_structure_library_v1.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-structure-library-v1
          if-no-files-found: error
          path: |
            SOL_STRUCTURE_LIBRARY_V1_Events.csv
            SOL_STRUCTURE_LIBRARY_V1_Summary.csv
            SOL_STRUCTURE_LIBRARY_V1_YearSummary.csv
            SOL_STRUCTURE_LIBRARY_V1_Overlap.csv
            SOL_STRUCTURE_LIBRARY_V1_Result.md
            SOL_STRUCTURE_LIBRARY_V1_Status.txt
            research/SOL_STRUCTURE_LIBRARY_V1_PREREG.md
