name: B27X
on:
  push:
    paths:
      - '.github/workflows/b27x.yml'
      - 'research/btc_london_ny_f85_winner_mae_b27x.py'
      - 'BTC_LONDON_NY_F85_WINNER_MAE_B27X_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_LONDON_NY_F85_WINNER_MAE_B27X_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_F85_WINNER_MAE_B27X_Status.txt
          git commit -m 'ci: mark B27X runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_f85_winner_mae_b27x.py
      - run: cd research && python btc_london_ny_f85_winner_mae_b27x.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_LONDON_NY_F85_WINNER_MAE_B27X_Result.md BTC_LONDON_NY_F85_WINNER_MAE_B27X_Paths.csv BTC_LONDON_NY_F85_WINNER_MAE_B27X_WinnerSummary.csv BTC_LONDON_NY_F85_WINNER_MAE_B27X_StopSurvival.csv BTC_LONDON_NY_F85_WINNER_MAE_B27X_FailureSummary.csv BTC_LONDON_NY_F85_WINNER_MAE_B27X_StatusCounts.csv
          git commit -m 'research: persist B27X F85 winner MAE audit' || true
          git push
