name: BTC ORB B4 Top2 Week
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_orb_b4_top2_week.py'
      - 'BTC_ORB_B4_Top2Week_Preregistration.md'
      - '.github/workflows/btc-orb-b4-top2-week.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas requests
      - name: Run B4
        run: PYTHONPATH=research python research/btc_orb_b4_top2_week.py > BTC_ORB_B4_Top2Week_Run.log 2>&1
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_ORB_B4_Top2Week_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC ORB B4 top2 weekly result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
