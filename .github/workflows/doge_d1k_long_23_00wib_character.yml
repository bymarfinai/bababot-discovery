name: DOGE D1K 23-00 WIB LONG character

on:
  push:
    branches:
      - doge-d1k-long-23-00wib-character
    paths:
      - '.doge-d1k-trigger'
  workflow_dispatch:

jobs:
  doge-d1k:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered DOGE D1K
        run: |
          set -euo pipefail
          LOG=DOGE_D1K_LONG_23_00WIB_CHARACTER_Run.log
          echo 'DOGE D1K 23:00-00:00 WIB LONG pair-native character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/doge_d1k_long_23_00wib_character.py 2>&1 | tee -a "$LOG"
          python research/doge_d1k_long_23_00wib_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: doge-d1k-long-23-00wib-character
          path: DOGE_D1K_LONG_23_00WIB_CHARACTER_*
          if-no-files-found: warn
