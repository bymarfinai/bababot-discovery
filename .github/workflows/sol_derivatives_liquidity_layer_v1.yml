name: SOL Derivatives Liquidity Layer V1

on:
  push:
    branches: [sol-derivatives-liquidity-layer-v1]
    paths:
      - 'research/sol_derivatives_liquidity_layer_v1.py'
      - 'research/SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_PREREG.md'
      - '.github/workflows/sol_derivatives_liquidity_layer_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-derivatives-liquidity-layer-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Compile
        run: python -m py_compile research/sol_derivatives_liquidity_layer_v1.py
      - name: Run derivatives audit
        run: python research/sol_derivatives_liquidity_layer_v1.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-derivatives-liquidity-layer-v1
          if-no-files-found: error
          path: |
            SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_*.csv
            SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_*.md
            SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_*.txt
            research/SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_PREREG.md
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_*.csv SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_*.md SOL_DERIVATIVES_LIQUIDITY_LAYER_V1_*.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "persist SOL derivatives liquidity layer v1 result"
            git pull --rebase origin sol-derivatives-liquidity-layer-v1
            git push origin HEAD:sol-derivatives-liquidity-layer-v1
          fi
