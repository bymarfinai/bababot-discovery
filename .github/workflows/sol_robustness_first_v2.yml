name: SOL Robustness-First Discovery V2

on:
  push:
    branches:
      - sol-robustness-first-v2-discovery
    paths:
      - '.sol-robustness-first-v2-trigger'

jobs:
  sol-robustness-first-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered SOL Robustness-First V2
        run: |
          set -euo pipefail
          LOG=SOL_ROBUSTNESS_FIRST_V2_Run.log
          echo 'SOL Robustness-First Discovery V2' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/sol_robustness_first_v2.py 2>&1 | tee -a "$LOG"
          python research/sol_robustness_first_v2.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: sol-robustness-first-v2
          path: SOL_ROBUSTNESS_FIRST_V2_*
          if-no-files-found: error
