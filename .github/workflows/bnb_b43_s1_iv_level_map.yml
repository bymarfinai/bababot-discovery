name: BNB B43-S1 IV level map

on:
  push:
    branches:
      - bnb-b43-options-iv-hodlod
    paths:
      - '.bnb-b43-s1-trigger'

permissions:
  contents: write

jobs:
  b43-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen live IV map
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b43_s1_iv_level_map.py
          python research/bnb_b43_s1_iv_level_map.py | tee BNB_B43_S1_IV_LEVEL_MAP_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b43-s1-iv-level-map
          path: |
            BNB_B43_S1_IV_LEVEL_MAP*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b43_s1
          for f in BNB_B43_S1_IV_LEVEL_MAP*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b43_s1/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b43_s1
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B43-S1 IV level map'
            git pull --rebase origin bnb-b43-options-iv-hodlod
            git push origin HEAD:bnb-b43-options-iv-hodlod
          fi
