name: SOL ORB Reference Fidelity Detector v1
on:
  workflow_dispatch:
  push:
    branches: [sol-orb-reference-fidelity-v1]
    paths:
      - 'research/sol_orb_reference_fidelity_v1.py'
      - 'research/run_sol_orb_reference_fidelity_v1.py'
      - 'SOL_ORB_REFERENCE_FIDELITY_V1_PREREG.md'
      - '.sol-orb-reference-fidelity-v1-trigger'
      - '.github/workflows/sol_orb_reference_fidelity_v1.yml'
jobs:
  detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run SOL ORB reference fidelity detector v1
        run: |
          set -euo pipefail
          python -m py_compile research/sol_orb_reference_fidelity_v1.py research/run_sol_orb_reference_fidelity_v1.py
          python research/run_sol_orb_reference_fidelity_v1.py | tee SOL_ORB_REFERENCE_FIDELITY_V1_Run.log
      - uses: actions/upload-artifact@v4
        with:
          name: sol-orb-reference-fidelity-v1
          path: SOL_ORB_REFERENCE_FIDELITY_V1_*
          if-no-files-found: error
