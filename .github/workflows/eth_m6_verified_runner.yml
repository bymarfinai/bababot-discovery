name: ETH M6 verified invalidation atlas

on:
  push:
    branches:
      - eth-transfer-m6-verified-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run verified ETH M6
        shell: bash
        run: |
          test -f research/eth_f85_f15_transfer_m6_invalidation_atlas.py
          python -m py_compile research/eth_f85_f15_transfer_m6_invalidation_atlas.py
          python research/eth_f85_f15_transfer_m6_invalidation_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-m6-verified-invalidation-atlas
          path: |
            ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_M6_*
