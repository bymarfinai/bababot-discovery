name: SOL Long Three-Zone Metrics A25

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_three_zone_metrics_a25.py'
      - '.github/workflows/sol-long-three-zone-metrics-a25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas

      - name: Run A25 metrics audit
        run: python research/sol_long_three_zone_metrics_a25.py

      - name: Persist A25 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_THREE_ZONE_METRICS_A25_Result.md \
                  SOL_LONG_THREE_ZONE_METRICS_A25_PORTFOLIO.csv \
                  SOL_LONG_THREE_ZONE_METRICS_A25_ZONES.csv \
                  SOL_LONG_THREE_ZONE_METRICS_A25_Status.txt
          if git diff --cached --quiet; then
            echo "No A25 output changes"
            exit 0
          fi
          git commit -m "Persist SOL A25 complete metrics audit"
          for i in 1 2 3; do
            git pull --rebase origin research/sol-long-structure-a1-run && git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep 3
          done
          exit 1
