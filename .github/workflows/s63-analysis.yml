name: S6.3 Saturday FIB5 Transfer
on:
  push:
    paths:
      - 'research/s63_saturday_friday_fib5_transfer.py'
      - '.github/workflows/s63-analysis.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: |
          cd research
          python s63_saturday_friday_fib5_transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: s63-output
          path: research/s63_out/
