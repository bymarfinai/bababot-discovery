name: B27DX causal LONG correction rescore

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py'
      - 'BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_Preregistration.md'
      - '.github/workflows/b27dx.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[B27DX] Run causal LONG correction')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Patch B27DX markdown renderer only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py')
          s = p.read_text()
          old = '''    for r in summary.itertuples(index=False):
              lines.append(f'- {r.gate}: **{"PASS" if bool(r._asdict()["pass"]) else "FAIL"}** — {r.actual}')'''
          new = '''    for _, r in summary.iterrows():
              lines.append(f'- {r["gate"]}: **{"PASS" if bool(r["pass"]) else "FAIL"}** — {r["actual"]}')'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'for _, r in summary.iterrows()' not in s:
              raise SystemExit('expected B27DX renderer fragment not found')
          PY
      - name: Run B27DX causal LONG correction rescore
        id: audit
        shell: bash
        run: |
          set +e
          LOG=BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_Run.log
          echo 'B27DX causal LONG correction; renderer-only engineering patch; no exchange writes' > "$LOG"
          echo "event=$GITHUB_EVENT_NAME" >> "$LOG"
          echo "commit=$(git rev-parse HEAD)" >> "$LOG"
          python -m py_compile research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py >> "$LOG" 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27dx-causal-long-correction
          path: BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_*
      - name: Persist B27DX renderer fix and outputs
        if: always() && (github.event_name == 'push' || github.event_name == 'issues')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py
          git add -A BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DX renderer fix and outputs'
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
      - name: Fail on audit error
        if: steps.audit.outputs.rc != '0'
        run: exit 1
