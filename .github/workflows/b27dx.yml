name: B27DX causal LONG correction rescore

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py'
      - 'BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_Preregistration.md'
      - '.github/workflows/b27dx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27DX causal LONG correction rescore
        id: audit
        shell: bash
        run: |
          set +e
          LOG=BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_Run.log
          echo 'B27DX causal LONG correction; no exchange writes' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/btc_f85_long_causal_ambiguous_terminal_fix_b27dx.py >> "$LOG" 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27dx-causal-long-correction
          path: BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_*
      - name: Persist B27DX outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A BTC_F85_LONG_CAUSAL_AMBIGUOUS_TERMINAL_FIX_B27DX_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DX causal LONG correction outputs'
            git push || true
          fi
      - name: Fail on audit error
        if: steps.audit.outputs.rc != '0'
        run: exit 1
