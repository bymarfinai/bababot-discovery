name: B27BJ magnitude-aware SIDEWAYS redesign audit

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_magnitude_aware_sideways_redesign_b27bj.py'
      - 'BTC_24H_MAGNITUDE_AWARE_SIDEWAYS_REDESIGN_B27BJ_Preregistration.md'
      - '.github/workflows/b27bj.yml'
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - run: python -m py_compile research/btc_24h_magnitude_aware_sideways_redesign_b27bj.py
      - name: Run B27BJ
        run: python research/btc_24h_magnitude_aware_sideways_redesign_b27bj.py
      - name: Persist results on main push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_MAGNITUDE_AWARE_SIDEWAYS_REDESIGN_B27BJ_Result.md \
                  BTC_24H_MAGNITUDE_AWARE_SIDEWAYS_REDESIGN_B27BJ_Predictions.csv \
                  BTC_24H_MAGNITUDE_AWARE_SIDEWAYS_REDESIGN_B27BJ_Models.csv \
                  BTC_24H_MAGNITUDE_AWARE_SIDEWAYS_REDESIGN_B27BJ_StateSummary.csv \
                  BTC_24H_MAGNITUDE_AWARE_SIDEWAYS_REDESIGN_B27BJ_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BJ magnitude-aware SIDEWAYS redesign results'
            git push
          fi
