name: SOL RCD v2 Historical Confirmation

on:
  push:
    branches:
      - sol-robust-character-discovery-v2
    paths:
      - '.sol-rcd-v2-histconf-trigger'

permissions:
  contents: write

jobs:
  sol-rcd-v2-histconf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen SOL RCD v2 historical confirmation
        run: |
          set -euo pipefail
          LOG=SOL_RCD_V2_HISTCONF_Run.log
          echo 'SOL RCD v2 historical confirmation' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/sol_rcd_v2_historical_confirmation.py 2>&1 | tee -a "$LOG"
          python research/sol_rcd_v2_historical_confirmation.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: sol-rcd-v2-historical-confirmation
          path: SOL_RCD_V2_HISTCONF_*
          if-no-files-found: error
      - name: Persist historical confirmation outputs to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_RCD_V2_HISTCONF_*
          if git diff --cached --quiet; then
            echo 'No historical confirmation output changes to persist.'
          else
            git commit -m 'persist SOL RCD v2 historical confirmation outputs'
            git push origin HEAD:sol-robust-character-discovery-v2
          fi
