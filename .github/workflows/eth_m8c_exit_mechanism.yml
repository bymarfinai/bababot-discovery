name: ETH M8C exit mechanism discovery

on:
  push:
    branches:
      - eth-transfer-m8c-exit-mechanism
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH M8C
        shell: bash
        run: |
          test -f research/ETH_M8C_EXIT_MECHANISM_PREREGISTRATION.md
          test -f research/eth_m8c_exit_mechanism.py
          python -m py_compile research/eth_m8c_exit_mechanism.py
          python research/eth_m8c_exit_mechanism.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-m8c-exit-mechanism
          path: |
            ETH_M8C_EXIT_MECHANISM_*
