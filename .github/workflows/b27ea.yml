name: B27EA Tuesday A5.11 portfolio revalidation

on:
  push:
    branches: [main]
    paths:
      - 'BTC_TUESDAY_A511_PORTFOLIO_REVALIDATION_B27EA_Preregistration.md'
      - 'research/btc_tuesday_a511_portfolio_revalidation_b27ea.py'
      - '.github/workflows/b27ea.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27EA revalidation
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_TUESDAY_A511_PORTFOLIO_REVALIDATION_B27EA_Run.log
          echo "commit=$GITHUB_SHA" > "$LOG"
          python -m py_compile research/btc_tuesday_a511_portfolio_revalidation_b27ea.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/btc_tuesday_a511_portfolio_revalidation_b27ea.py >> "$LOG" 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27ea-tuesday-a511-revalidation
          path: BTC_TUESDAY_A511_PORTFOLIO_REVALIDATION_B27EA_*
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A BTC_TUESDAY_A511_PORTFOLIO_REVALIDATION_B27EA_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27EA Tuesday revalidation results'
            git push || true
          fi
      - name: Fail on error
        if: steps.run.outputs.rc != '0'
        run: exit 1
