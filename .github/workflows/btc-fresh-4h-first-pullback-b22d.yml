name: BTC Fresh 4H First Pullback B22D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-fresh-4h-first-pullback-b22d.yml'
      - 'research/btc_fresh_4h_first_pullback_b22d.py'
      - 'BTC_FRESH_4H_FIRST_PULLBACK_B22D_Preregistration.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_FRESH_4H_FIRST_PULLBACK_B22D_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_FRESH_4H_FIRST_PULLBACK_B22D_Status.txt
          git commit -m "ci: mark B22D runner started" || true
          git push || true
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Compile
        run: python -m py_compile research/btc_fresh_4h_first_pullback_b22d.py
      - name: Run B22D
        id: runb22d
        shell: bash
        run: |
          set +e
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_fresh_4h_first_pullback_b22d.py 2>&1 | tee BTC_FRESH_4H_FIRST_PULLBACK_B22D_Run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit ${code}
      - name: Persist
        if: always()
        run: |
          git pull --rebase || true
          git add BTC_FRESH_4H_FIRST_PULLBACK_B22D_* || true
          if [ -f BTC_FRESH_4H_FIRST_PULLBACK_B22D_Result.md ]; then
            echo "COMPLETED run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} ended_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_FRESH_4H_FIRST_PULLBACK_B22D_Status.txt
          else
            echo "FAILED run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} ended_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) exit_code=${{ steps.runb22d.outputs.exit_code }}" > BTC_FRESH_4H_FIRST_PULLBACK_B22D_Status.txt
          fi
          git add BTC_FRESH_4H_FIRST_PULLBACK_B22D_Status.txt BTC_FRESH_4H_FIRST_PULLBACK_B22D_Run.log || true
          git commit -m "research: persist B22D fresh 4h first pullback result" || true
          git push || true
