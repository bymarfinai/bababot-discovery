name: B27AV short failure-stage decomposition
on:
  push:
    paths:
      - 'research/btc_london_ny_short_f15_failure_stage_b27av.py'
      - 'BTC_LONDON_NY_SHORT_F15_FAILURE_STAGE_B27AV_Preregistration.md'
      - '.github/workflows/b27av.yml'
  pull_request:
    paths:
      - 'research/btc_london_ny_short_f15_failure_stage_b27av.py'
      - 'BTC_LONDON_NY_SHORT_F15_FAILURE_STAGE_B27AV_Preregistration.md'
      - '.github/workflows/b27av.yml'
      - 'research/B27AV_OBSERVABLE_RUN.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python -m py_compile research/btc_london_ny_short_f15_failure_stage_b27av.py
      - name: Run B27AV
        run: python research/btc_london_ny_short_f15_failure_stage_b27av.py
      - if: github.event_name == 'push' && always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_LONDON_NY_SHORT_F15_FAILURE_STAGE_B27AV_Result.md BTC_LONDON_NY_SHORT_F15_FAILURE_STAGE_B27AV_Summary.csv BTC_LONDON_NY_SHORT_F15_FAILURE_STAGE_B27AV_Trades.csv BTC_LONDON_NY_SHORT_F15_FAILURE_STAGE_B27AV_Status.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'research: persist B27AV short failure-stage result'
            git push
          fi
