name: B27O
on:
  push:
    paths:
      - '.github/workflows/b27o.yml'
      - 'research/btc_15m_first_retest_midpoint_entry_b27o.py'
      - 'BTC_15M_FIRST_RETEST_MIDPOINT_ENTRY_B27O_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_15M_FIRST_RETEST_MIDPOINT_ENTRY_B27O_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_15M_FIRST_RETEST_MIDPOINT_ENTRY_B27O_Status.txt
          git commit -m 'ci: mark B27O runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_15m_first_retest_midpoint_entry_b27o.py
      - run: cd research && python btc_15m_first_retest_midpoint_entry_b27o.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_15M_FIRST_RETEST_MIDPOINT_ENTRY_B27O_Result.md BTC_15M_FIRST_RETEST_MIDPOINT_ENTRY_B27O_Summary.csv BTC_15M_FIRST_RETEST_MIDPOINT_ENTRY_B27O_Trades.csv
          git commit -m 'research: persist B27O first-retest midpoint result' || true
          git push
