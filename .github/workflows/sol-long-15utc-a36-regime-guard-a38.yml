name: SOL Long 15UTC A36 Regime Guard A38
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [research/sol-long-structure-a1-run]
    paths:
      - 'research/sol_long_15utc_a36_regime_guard_a38.py'
      - 'SOL_LONG_15UTC_A36_REGIME_GUARD_A38_Preregistration.md'
      - '.github/workflows/sol-long-15utc-a36-regime-guard-a38.yml'
jobs:
  a38:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests
      - name: Run A38 regime guard
        run: python research/sol_long_15utc_a36_regime_guard_a38.py
      - name: Persist A38 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_A36_REGIME_GUARD_A38_*.md SOL_LONG_15UTC_A36_REGIME_GUARD_A38_*.csv SOL_LONG_15UTC_A36_REGIME_GUARD_A38_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A38 A36 regime guard'
          git push origin HEAD:research/sol-long-structure-a1-run
