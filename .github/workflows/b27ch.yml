name: B27CH F05 reclaim controlled-loss economics

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_f05_reclaim_controlled_loss_econ_b27ch.py'
      - 'BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Preregistration.md'
      - '.github/workflows/b27ch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27CH with persisted diagnostics
        id: run_b27ch
        shell: bash
        run: |
          set +e
          LOG=BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Run.log
          echo "B27CH diagnostic run start" > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_24h_f05_reclaim_controlled_loss_econ_b27ch.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_f05_reclaim_controlled_loss_econ_b27ch.py >> "$LOG" 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27ch-results
          path: |
            BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Result.md
            BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Trades.csv
            BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Summary.csv
            BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Selection.csv
            BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Status.txt
            BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_Run.log
      - name: Persist B27CH outputs or diagnostics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_F05_RECLAIM_CONTROLLED_LOSS_ECON_B27CH_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CH F05 reclaim controlled-loss outputs'
            git push
          fi
      - name: Fail if B27CH script failed
        if: steps.run_b27ch.outputs.rc != '0'
        run: exit 1
