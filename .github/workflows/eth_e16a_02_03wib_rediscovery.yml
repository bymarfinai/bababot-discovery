name: ETH E16A 02-03 WIB rediscovery

on:
  push:
    branches: [eth-e16a-long-02-03wib-rediscovery]
    paths:
      - 'research/eth_e16a_long_02_03wib_rediscovery.py'
      - 'research/eth_e16a_long_02_03wib_rediscovery_v2.py'
      - 'research/ETH_E16A_02_03WIB_PREREGISTRATION.md'
      - '.github/workflows/eth_e16a_02_03wib_rediscovery.yml'
      - '.e16a-trigger'

permissions:
  contents: write

jobs:
  rediscover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run E16A 02-03 WIB rediscovery
        run: python research/eth_e16a_long_02_03wib_rediscovery_v2.py
      - name: Persist E16A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_E16A_02_03WIB_*
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH E16A 02-03 WIB results"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-e16a-02-03wib-rediscovery
          path: ETH_E16A_02_03WIB_*
          if-no-files-found: error
