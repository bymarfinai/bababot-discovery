name: ETH B27DX S12 Global Collision Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S12_GLOBAL_COLLISION_AUDIT_Preregistration.md'
      - 'research/eth_b27dx_s12_global_collision_audit.py'
      - '.github/workflows/eth-b27dx-s12-global-collision-audit.yml'

permissions:
  contents: write

jobs:
  s12:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_b27dx_s12_global_collision_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S12_GLOBAL_COLLISION_AUDIT_*.md ETH_B27DX_S12_GLOBAL_COLLISION_AUDIT_*.csv ETH_B27DX_S12_GLOBAL_COLLISION_AUDIT_*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist ETH B27DX S12 global collision audit results"
          ok=0
          for i in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin main; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
