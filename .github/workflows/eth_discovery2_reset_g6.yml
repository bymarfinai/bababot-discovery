name: ETH Discovery 2 Reset G6 payoff atlas

on:
  push:
    branches: [eth-discovery2-reset-g6-payoff-atlas]
    paths:
      - 'ETH_DISCOVERY2_RESET_G6_PAYOFF_ATLAS_Preregistration.md'
      - 'research/eth_discovery2_reset_g6_payoff_atlas.py'
      - 'research/eth_discovery2_reset_g6_payoff_atlas_runner.py'
      - '.github/workflows/eth_discovery2_reset_g6.yml'
      - '.eth-discovery2-reset-g6-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Reset G6
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_RESET_G6_PAYOFF_ATLAS_Run.log
          echo 'ETH Discovery 2 Reset G6 payoff atlas' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_reset_g6_payoff_atlas.py research/eth_discovery2_reset_g6_payoff_atlas_runner.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_reset_g6_payoff_atlas_runner.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-reset-g6-payoff-atlas
          path: |
            ETH_DISCOVERY2_RESET_G6_PAYOFF_ATLAS_*
