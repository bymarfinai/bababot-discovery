name: SOL Indicator Relationship Stage 7

on:
  push:
    branches:
      - research/sol-indicator-relationship-s7
    paths:
      - "research/sol_indicator_relationship_s7.py"
      - "SOL_INDICATOR_RELATIONSHIP_S7_Preregistration.md"
      - ".github/workflows/sol-indicator-relationship-s7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-stage7:
    if: \${{ !contains(github.event.head_commit.message, '[stage7-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-indicator-relationship-s7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run Stage 7
        run: python research/sol_indicator_relationship_s7.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_INDICATOR_RELATIONSHIP_S7_Result.md \
                  SOL_INDICATOR_RELATIONSHIP_S7_Result.json \
                  SOL_INDICATOR_RELATIONSHIP_S7_AUDIT.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7A_FAMILY_DEV.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7B_TPSL_DEV.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7C_VALIDATION.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7D_TRADES.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7E_SIDE_DIAGNOSTICS.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7_Status.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Persist SOL Stage 7 results [stage7-result]"
            git push origin HEAD:research/sol-indicator-relationship-s7
          fi
