name: ETH Discovery 2 Reset G3 downstream structure

on:
  push:
    branches: [eth-discovery2-reset-g3-downstream-structure]
    paths:
      - 'ETH_DISCOVERY2_RESET_G3_DOWNSTREAM_STRUCTURE_Preregistration.md'
      - 'research/eth_discovery2_reset_g3_downstream_structure.py'
      - '.github/workflows/eth_discovery2_reset_g3.yml'
      - '.eth-discovery2-reset-g3-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Reset G3
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_RESET_G3_DOWNSTREAM_STRUCTURE_Run.log
          echo 'ETH Discovery 2 Reset G3 downstream structure' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_reset_g3_downstream_structure.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_reset_g3_downstream_structure.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-reset-g3-downstream-structure
          path: |
            ETH_DISCOVERY2_RESET_G3_DOWNSTREAM_STRUCTURE_*
