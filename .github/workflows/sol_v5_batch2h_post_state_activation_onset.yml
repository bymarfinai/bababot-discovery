name: SOL V5 Batch2H Post-State Activation Onset

on:
  push:
    branches:
      - sol-v5-batch2h-post-state-activation-onset
    paths:
      - 'research/sol_v5_batch2h_post_state_activation_onset.py'
      - 'research/SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_PREREG.md'
      - '.github/workflows/sol_v5_batch2h_post_state_activation_onset.yml'
  workflow_dispatch:

jobs:
  activation-onset:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Run frozen Batch 2H activation onset
        run: python research/sol_v5_batch2h_post_state_activation_onset.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-v5-batch2h-post-state-activation-onset
          if-no-files-found: error
          path: |
            SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_CheckpointScores.csv
            SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_SelectedTrades.csv
            SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_YearSummary.csv
            SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_GateAudit.csv
            SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_Result.md
            SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_Status.txt
            research/SOL_V5_BATCH2H_POST_STATE_ACTIVATION_ONSET_PREREG.md
