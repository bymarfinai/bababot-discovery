name: B27BW failed-reclaim widened-risk economics

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_failed_reclaim_wide_risk_b27bw.py'
      - 'BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Preregistration.md'
      - '.github/workflows/b27bw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_failed_reclaim_wide_risk_b27bw.py
      - name: Run B27BW
        run: python research/btc_24h_failed_reclaim_wide_risk_b27bw.py
      - uses: actions/upload-artifact@v4
        with:
          name: b27bw-results
          path: |
            BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Result.md
            BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Trades.csv
            BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Summary.csv
            BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Selection.csv
            BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Status.txt
      - name: Persist B27BW outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Result.md \
                  BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Trades.csv \
                  BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Summary.csv \
                  BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Selection.csv \
                  BTC_24H_FAILED_RECLAIM_WIDE_RISK_B27BW_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BW widened-risk economics'
            git push
          fi
