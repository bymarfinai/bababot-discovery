name: B27FK BNB hour22-23 final structural sweep

on:
  push:
    branches:
      - bnb-hour22-23-sweep-b27fk
    paths:
      - 'BNB_HOURLY_SWEEP_B27FK_Preregistration.md'
      - 'research/bnb_hourly_sweep_b27fk.py'
      - '.github/workflows/b27fk-bnb-hour22-23-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FK final structural sweep
        run: python research/bnb_hourly_sweep_b27fk.py | tee BNB_HOURLY_SWEEP_B27FK_Run.log
      - name: Persist B27FK outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_HOURLY_SWEEP_B27FK_Detail.csv \
                  BNB_HOURLY_SWEEP_B27FK_Summary.csv \
                  BNB_HOURLY_SWEEP_B27FK_Result.md \
                  BNB_HOURLY_SWEEP_B27FK_Status.txt \
                  BNB_HOURLY_SWEEP_B27FK_Run.log
          git diff --cached --quiet || git commit -m "persist B27FK BNB hour22-23 final structural sweep result"
          git push origin HEAD:bnb-hour22-23-sweep-b27fk
