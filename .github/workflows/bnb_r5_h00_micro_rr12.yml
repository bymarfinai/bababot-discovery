name: BNB R5 H00 micro RR1:2 discovery

on:
  push:
    branches:
      - bnb-r5-h00-micro-rr12-discovery
    paths:
      - '.bnb-r5-h00-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r5h00:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run BNB R5 H00 micro RR1:2 discovery
        run: python research/bnb_r5_h00_micro_rr12_discovery.py
      - name: Persist BNB R5 H00 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_R5_H00_MICRO_RR12_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist BNB R5 H00 micro RR1:2 results"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-r5-h00-micro-rr12
          path: 'BNB_R5_H00_MICRO_RR12_*'
          if-no-files-found: error
