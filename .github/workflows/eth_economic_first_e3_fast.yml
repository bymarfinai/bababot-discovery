name: ETH Economic-First E3 drive strength fast

on:
  push:
    branches: [eth-economic-first-e3-drive-strength]
    paths:
      - '.eth-economic-first-e3-fast-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e3_fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run vectorized equivalent E3
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E3_DRIVE_STRENGTH_FAST_Run.log
          echo 'ETH Economic-First E3 drive strength vectorized equivalent' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e3_drive_strength_fast.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e3_drive_strength_fast.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-economic-first-e3-drive-strength-fast
          path: |
            ETH_ECONOMIC_FIRST_E3_DRIVE_STRENGTH_FAST_*
