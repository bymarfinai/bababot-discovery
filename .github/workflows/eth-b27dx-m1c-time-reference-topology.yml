name: ETH B27DX M1C Time Reference Topology
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/eth_b27dx_m1c_time_reference_topology.py'
      - 'ETH_B27DX_M1C_TIME_REFERENCE_TOPOLOGY_Preregistration.md'
      - '.github/workflows/eth-b27dx-m1c-time-reference-topology.yml'
permissions:
  contents: write
jobs:
  m1c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests
      - name: Run M1C time-reference topology
        run: python research/eth_b27dx_m1c_time_reference_topology.py > ETH_B27DX_M1C_TIME_REFERENCE_TOPOLOGY_Run.log 2>&1
      - name: Persist results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_M1C_TIME_REFERENCE_TOPOLOGY_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist ETH B27DX M1C time-reference topology"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
