name: SOL Long 15UTC Native Recovery A23

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_15UTC_NATIVE_RECOVERY_A23_Preregistration.md'
      - 'research/sol_long_15utc_native_recovery_a23.py'
      - '.github/workflows/sol-long-15utc-native-recovery-a23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas requests

      - name: Run A23 15UTC native recovery
        run: python research/sol_long_15utc_native_recovery_a23.py

      - name: Persist A23 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_15UTC_NATIVE_RECOVERY_A23_Result.md \
                  SOL_LONG_15UTC_NATIVE_RECOVERY_A23_DEVELOPMENT.csv \
                  SOL_LONG_15UTC_NATIVE_RECOVERY_A23_OOS.csv \
                  SOL_LONG_15UTC_NATIVE_RECOVERY_A23_TRADES.csv \
                  SOL_LONG_15UTC_NATIVE_RECOVERY_A23_Status.txt
          if git diff --cached --quiet; then
            echo "No A23 output changes"
            exit 0
          fi
          git commit -m "Persist SOL A23 15UTC native recovery results"
          for i in 1 2 3; do
            git pull --rebase origin research/sol-long-structure-a1-run && git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep 3
          done
          exit 1
