name: SOL RCD v2 Candidate1 2026 Anatomy A1

on:
  push:
    branches:
      - sol-rcd-v2-candidate1-2026-anatomy-a1
    paths:
      - '.sol-rcd-v2-candidate1-2026-anatomy-a1-trigger'

permissions:
  contents: write

jobs:
  sol-rcd-v2-candidate1-anatomy-a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered candidate1 2026 anatomy A1
        run: |
          set -euo pipefail
          LOG=SOL_RCD_V2_CANDIDATE1_2026_ANATOMY_A1_Run.log
          echo 'SOL RCD v2 Candidate1 2026 Anatomy A1' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/sol_rcd_v2_candidate1_2026_anatomy_a1.py 2>&1 | tee -a "$LOG"
          python research/sol_rcd_v2_candidate1_2026_anatomy_a1.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: sol-rcd-v2-candidate1-2026-anatomy-a1
          path: SOL_RCD_V2_CANDIDATE1_2026_ANATOMY_A1_*
          if-no-files-found: error
      - name: Persist A1 outputs to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_RCD_V2_CANDIDATE1_2026_ANATOMY_A1_*
          if git diff --cached --quiet; then
            echo 'No A1 output changes to persist.'
          else
            git commit -m 'persist SOL RCD v2 candidate1 2026 anatomy A1 outputs'
            git push origin HEAD:sol-rcd-v2-candidate1-2026-anatomy-a1
          fi
