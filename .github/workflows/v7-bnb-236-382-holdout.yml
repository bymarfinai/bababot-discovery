name: V7 O BNB 23.6-38.2 Holdout

on:
  push:
    paths:
      - 'research/v7_o_bnb_supply_236_382_independent_holdout.py'
      - '.github/workflows/v7-bnb-236-382-holdout.yml'
  workflow_dispatch:

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26.0' 'fastapi>=0.110'
      - name: Run frozen independent holdout
        run: PYTHONPATH=. python research/v7_o_bnb_supply_236_382_independent_holdout.py
