name: ETH Economic-First E7 harvest ridge

on:
  push:
    branches: [eth-economic-first-e7-harvest-ridge]
    paths:
      - 'ETH_ECONOMIC_FIRST_E7_HARVEST_RIDGE_Preregistration.md'
      - 'research/eth_economic_first_e7_harvest_ridge.py'
      - '.github/workflows/eth_economic_first_e7.yml'
      - '.eth-economic-first-e7-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Economic-First E7
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E7_HARVEST_RIDGE_Run.log
          echo 'ETH Economic-First E7 high-WR harvest ridge' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e7_harvest_ridge.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e7_harvest_ridge.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-economic-first-e7-harvest-ridge
          path: |
            ETH_ECONOMIC_FIRST_E7_HARVEST_RIDGE_*
