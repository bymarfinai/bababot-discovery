name: V7 Legacy Trigger Forensic

on:
  push:
    paths:
      - 'research/v7_c_legacy_regime_trigger_forensic.py'
      - '.github/workflows/v7-legacy-trigger-forensic.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26.0'
      - name: Run 971d legacy trigger forensic
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/v7_c_legacy_regime_trigger_forensic.py
