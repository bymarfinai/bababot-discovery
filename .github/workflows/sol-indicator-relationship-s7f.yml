name: SOL Indicator Relationship Stage 7F

on:
  push:
    branches:
      - research/sol-indicator-relationship-s7f
    paths:
      - "research/sol_indicator_relationship_s7f.py"
      - "SOL_INDICATOR_RELATIONSHIP_S7F_Preregistration.md"
      - ".github/workflows/sol-indicator-relationship-s7f.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-stage7f:
    if: \${{ !contains(github.event.head_commit.message, '[stage7f-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-indicator-relationship-s7f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests scikit-learn
      - name: Run Stage 7F
        run: python research/sol_indicator_relationship_s7f.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_INDICATOR_RELATIONSHIP_S7F_Result.md \
                  SOL_INDICATOR_RELATIONSHIP_S7F_Result.json \
                  SOL_INDICATOR_RELATIONSHIP_S7F_AUDIT.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_A_MODEL_IMPORTANCE.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_B_THRESHOLDS.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_C_DEV_SELECT.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_D_VALIDATION.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_E_SIDE.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_F_SCORE_DISTRIBUTIONS.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_G_ACCEPTED_COMPOSITION.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_H_TRADES.csv \
                  SOL_INDICATOR_RELATIONSHIP_S7F_Status.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Persist SOL Stage 7F results [stage7f-result]"
            git push origin HEAD:research/sol-indicator-relationship-s7f
          fi
