name: BTC Weekly W1 VAH False Break B17
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_w1_vah_false_break_b17.py'
      - 'BTC_WEEKLY_W1_VAH_FALSE_BREAK_B17_Preregistration.md'
      - '.github/workflows/btc-weekly-w1-vah-false-break-b17.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${{ github.run_id }} sha=${{ github.sha }} started_utc=$(date -u +%FT%TZ)" > BTC_WEEKLY_W1_VAH_FALSE_BREAK_B17_Status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_W1_VAH_FALSE_BREAK_B17_Status.txt
          git commit -m "ci: mark B17 runner started" || true
          git pull --rebase origin main && git push origin HEAD:main || true
      - run: pip install numpy pandas requests scikit-learn
      - name: Compile B17
        run: python -m py_compile research/btc_weekly_w1_vah_false_break_b17.py
      - name: Run B17
        shell: bash
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_weekly_w1_vah_false_break_b17.py 2>&1 | tee BTC_WEEKLY_W1_VAH_FALSE_BREAK_B17_Run.log
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_W1_VAH_FALSE_BREAK_B17_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist W1 VAH false-break filter B17 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
