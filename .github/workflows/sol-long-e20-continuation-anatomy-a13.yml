name: SOL LONG E20 Continuation Anatomy A13

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_E20_CONTINUATION_ANATOMY_A13_Preregistration.md'
      - 'research/sol_long_e20_continuation_anatomy_a13.py'
      - '.github/workflows/sol-long-e20-continuation-anatomy-a13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A13 E20 continuation anatomy
        run: python research/sol_long_e20_continuation_anatomy_a13.py
      - name: Persist A13 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_E20_CONTINUATION_ANATOMY_A13_Result.md \
                  SOL_LONG_E20_CONTINUATION_ANATOMY_A13_COHORT.csv \
                  SOL_LONG_E20_CONTINUATION_ANATOMY_A13_SNAPSHOTS.csv \
                  SOL_LONG_E20_CONTINUATION_ANATOMY_A13_SEPARATION.csv \
                  SOL_LONG_E20_CONTINUATION_ANATOMY_A13_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL E20 continuation anatomy A13 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
