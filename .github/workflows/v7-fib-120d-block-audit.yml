name: V7 FIB 120D Block Audit

on:
  push:
    paths:
      - '.github/workflows/v7-fib-120d-block-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose and audit fixed FIB response
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          for SYM in BTCUSDT ETHUSDT SOLUSDT BNBUSDT; do
            curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
              "$BASE/v4/context-fib-forensic?symbols=${SYM}&days=971&rr=1.0&confirm_bars=3&sample_limit=500" \
              > "/tmp/${SYM}.json"
          done
          python - <<'PY'
          import json
          for p in ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT']:
              d=json.load(open(f'/tmp/{p}.json'))
              s=d.get('sample') or []
              print('SCHEMA',p,'phase=',d.get('phase'),'keys=',sorted(d.keys()),'overall=',d.get('overall'),'fib_bands=',d.get('fib_bands'),'errors=',d.get('errors'),'sample_n=',len(s),'sample0=',s[0] if s else None)
          PY
