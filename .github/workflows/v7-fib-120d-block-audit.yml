name: V7 FIB 120D Block Audit

on:
  push:
    paths:
      - 'research/v7_f_fib_120d_archive_audit.py'
      - '.github/workflows/v7-fib-120d-block-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26.0' 'fastapi>=0.110'
      - name: Reconstruct official archives and audit fixed FIB by 120d
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/v7_f_fib_120d_archive_audit.py
