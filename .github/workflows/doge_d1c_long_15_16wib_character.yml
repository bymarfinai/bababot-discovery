name: DOGE D1C 15-16 WIB LONG character

on:
  push:
    branches:
      - doge-d1c-long-15-16wib-character
    paths:
      - '.doge-d1c-trigger'
  workflow_dispatch:

jobs:
  doge-d1c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered DOGE D1C
        run: |
          set -euo pipefail
          LOG=DOGE_D1C_LONG_15_16WIB_CHARACTER_Run.log
          echo 'DOGE D1C 15:00-16:00 WIB LONG pair-native character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/doge_d1c_long_15_16wib_character.py 2>&1 | tee -a "$LOG"
          python research/doge_d1c_long_15_16wib_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: doge-d1c-long-15-16wib-character
          path: DOGE_D1C_LONG_15_16WIB_CHARACTER_*
          if-no-files-found: warn
