name: ETH London NY M15 M14 Target Family

on:
  push:
    paths:
      - 'ETH_LONDON_NY_M15_M14_TARGET_FAMILY_Preregistration.md'
      - 'research/eth_london_ny_m15_m14_target_family.py'
      - '.github/workflows/eth-london-ny-m15-m14-target-family.yml'
  workflow_dispatch:

jobs:
  m15:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH London-NY M15
        run: python research/eth_london_ny_m15_m14_target_family.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add ETH_LONDON_NY_M15_M14_TARGET_FAMILY_Result.md ETH_LONDON_NY_M15_M14_TARGET_FAMILY_Trades.csv ETH_LONDON_NY_M15_M14_TARGET_FAMILY_Summary.csv ETH_LONDON_NY_M15_M14_TARGET_FAMILY_Audit.csv ETH_LONDON_NY_M15_M14_TARGET_FAMILY_Status.txt
          git commit -m "research: persist ETH London-NY M15 target-family results" || true
          git push
