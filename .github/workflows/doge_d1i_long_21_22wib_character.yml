name: DOGE D1I 21-22 WIB LONG character

on:
  push:
    branches:
      - doge-d1i-long-21-22wib-character
    paths:
      - '.doge-d1i-trigger'
  workflow_dispatch:

jobs:
  doge-d1i:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered DOGE D1I
        run: |
          set -euo pipefail
          LOG=DOGE_D1I_LONG_21_22WIB_CHARACTER_Run.log
          echo 'DOGE D1I 21:00-22:00 WIB LONG pair-native character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/doge_d1i_long_21_22wib_character.py 2>&1 | tee -a "$LOG"
          python research/doge_d1i_long_21_22wib_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: doge-d1i-long-21-22wib-character
          path: DOGE_D1I_LONG_21_22WIB_CHARACTER_*
          if-no-files-found: warn
