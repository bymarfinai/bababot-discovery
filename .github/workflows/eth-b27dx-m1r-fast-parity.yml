name: ETH B27DX M1R Fast Parity
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/eth_b27dx_m1r_full_48_clock_rotation_fast.py'
      - '.github/workflows/eth-b27dx-m1r-fast-parity.yml'
permissions:
  contents: write
jobs:
  m1r_fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests
      - name: Run parity-safe fast M1R
        run: python research/eth_b27dx_m1r_full_48_clock_rotation_fast.py > ETH_B27DX_M1R_FAST_PARITY_Run.log 2>&1
      - name: Persist results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_M1R_FAST_PARITY_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist parity-safe fast ETH M1R 48-clock rotation"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
