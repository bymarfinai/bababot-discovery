name: SOL Long Multi-Clock Expansion A17

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_MULTI_CLOCK_EXPANSION_A17_Preregistration.md'
      - 'research/sol_long_multi_clock_expansion_a17.py'
      - '.github/workflows/sol-long-multi-clock-expansion-a17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a17:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas requests

      - name: Run A17 multi-clock expansion
        run: python research/sol_long_multi_clock_expansion_a17.py

      - name: Persist A17 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_MULTI_CLOCK_EXPANSION_A17_Result.md \
                  SOL_LONG_MULTI_CLOCK_EXPANSION_A17_DEVELOPMENT.csv \
                  SOL_LONG_MULTI_CLOCK_EXPANSION_A17_OOS.csv \
                  SOL_LONG_MULTI_CLOCK_EXPANSION_A17_TRADES.csv \
                  SOL_LONG_MULTI_CLOCK_EXPANSION_A17_CELLS.csv \
                  SOL_LONG_MULTI_CLOCK_EXPANSION_A17_Status.txt
          if git diff --cached --quiet; then
            echo "No A17 output changes"
            exit 0
          fi
          git commit -m "Persist SOL A17 multi-clock expansion results"
          for i in 1 2 3; do
            git pull --rebase origin research/sol-long-structure-a1-run && git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep 3
          done
          exit 1
