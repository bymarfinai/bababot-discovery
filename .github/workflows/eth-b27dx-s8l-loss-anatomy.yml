name: ETH B27DX S8L Loss Anatomy

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S8L_LOSS_ANATOMY_Preregistration.md'
      - 'research/eth_b27dx_s8l_loss_anatomy.py'
      - '.github/workflows/eth-b27dx-s8l-loss-anatomy.yml'

permissions:
  contents: write

jobs:
  s8l:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S8L loss anatomy
        run: python research/eth_b27dx_s8l_loss_anatomy.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S8L_LOSS_ANATOMY_*.md ETH_B27DX_S8L_LOSS_ANATOMY_*.csv ETH_B27DX_S8L_LOSS_ANATOMY_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "research: persist ETH B27DX S8L loss anatomy"
          ok=0
          for i in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
