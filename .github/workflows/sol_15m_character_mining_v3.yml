name: SOL 15M Character Mining V3
on:
  push:
    branches: [research/sol-15m-character-mining-v3]
    paths:
      - 'research/sol_15m_character_mining_v3.py'
      - 'research/SOL_15M_CHARACTER_MINING_V3_PREREG.md'
      - '.github/workflows/sol_15m_character_mining_v3.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn
      - run: python -m py_compile research/sol_15m_character_mining_v3.py
      - run: python research/sol_15m_character_mining_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-15m-character-mining-v3
          if-no-files-found: error
          path: |
            SOL_15M_CHARACTER_MINING_V3_ValidationThresholds.csv
            SOL_15M_CHARACTER_MINING_V3_FeatureImportance.csv
            SOL_15M_CHARACTER_MINING_V3_SelectedProfile.csv
            SOL_15M_CHARACTER_MINING_V3_Transfer.csv
            SOL_15M_CHARACTER_MINING_V3_Result.md
            SOL_15M_CHARACTER_MINING_V3_Status.txt
            research/SOL_15M_CHARACTER_MINING_V3_PREREG.md
