name: SOL Regime Phase Stage 6F

on:
  push:
    branches:
      - research/sol-regime-phase-stage6f
    paths:
      - 'SOL_REGIME_PHASE_STAGE6F_Preregistration.md'
      - 'research/sol_regime_phase_stage6f.py'
      - '.github/workflows/sol-regime-phase-stage6f.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage6f:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-regime-phase-stage6f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run frozen Stage 6F predictive feature forensics
        run: python research/sol_regime_phase_stage6f.py
      - name: Persist Stage 6F outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_REGIME_PHASE_STAGE6F_Result.md \
            SOL_REGIME_PHASE_STAGE6F_FeatureScan.csv \
            SOL_REGIME_PHASE_STAGE6F_Survivors.csv \
            SOL_REGIME_PHASE_STAGE6F_BlockDetail.csv \
            SOL_REGIME_PHASE_STAGE6F_Audit.csv \
            SOL_REGIME_PHASE_STAGE6F_Status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist SOL phase Stage 6F feature forensics"
          git pull --rebase origin research/sol-regime-phase-stage6f
          git push origin HEAD:research/sol-regime-phase-stage6f
