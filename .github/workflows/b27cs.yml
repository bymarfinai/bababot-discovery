name: B27CS clock-TP reward-scaled SL economics

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_clock_tp_sl_b27cs.py'
      - 'BTC_24H_CLOCK_TP_SL_B27CS_Preregistration.md'
      - '.github/workflows/b27cs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27CS
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_24H_CLOCK_TP_SL_B27CS_Run.log
          echo 'B27CS run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_24h_clock_tp_sl_b27cs.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_clock_tp_sl_b27cs.py >> "$LOG" 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27cs-results
          path: |
            BTC_24H_CLOCK_TP_SL_B27CS_*
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_CLOCK_TP_SL_B27CS_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CS clock-TP SL outputs'
            git push
          fi
      - name: Fail if script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
