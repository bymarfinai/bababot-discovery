name: B27BT causal failed-reclaim anatomy

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_failed_reclaim_causal_b27bt.py'
      - 'BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Preregistration.md'
      - '.github/workflows/b27bt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_failed_reclaim_causal_b27bt.py
      - name: Run B27BT
        run: python research/btc_24h_failed_reclaim_causal_b27bt.py
      - uses: actions/upload-artifact@v4
        with:
          name: b27bt-results
          path: |
            BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Result.md
            BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Episodes.csv
            BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Summary.csv
            BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Status.txt
      - name: Persist B27BT outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Result.md \
                  BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Episodes.csv \
                  BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Summary.csv \
                  BTC_24H_FAILED_RECLAIM_CAUSAL_B27BT_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BT causal failed-reclaim results'
            git push
          fi
