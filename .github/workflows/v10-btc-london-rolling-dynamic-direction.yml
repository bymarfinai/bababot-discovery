name: V10 F BTC London Rolling Dynamic Direction
on:
  push:
    branches: [v7-regime-failed-breakout]
    paths:
      - 'research/v10_f_btc_london_rolling_dynamic_direction.py'
      - '.github/workflows/v10-btc-london-rolling-dynamic-direction.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: PYTHONPATH=. python research/v10_f_btc_london_rolling_dynamic_direction.py
