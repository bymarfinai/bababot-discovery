name: BTC Weekly Value Area Breakout B15
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_value_area_breakout_b15.py'
      - 'BTC_WEEKLY_VALUE_AREA_BREAKOUT_B15_Preregistration.md'
      - '.github/workflows/btc-weekly-value-area-breakout-b15.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${{ github.run_id }} sha=${{ github.sha }} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_WEEKLY_VALUE_AREA_BREAKOUT_B15_Status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_VALUE_AREA_BREAKOUT_B15_Status.txt
          git commit -m "ci: heartbeat BTC value-area breakout B15" || true
          git pull --rebase origin main && git push origin HEAD:main || true
      - run: pip install numpy pandas requests scikit-learn
      - name: Compile B15
        run: python -m py_compile research/btc_weekly_value_area_breakout_b15.py
      - name: Run B15
        shell: bash
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_weekly_value_area_breakout_b15.py 2>&1 | tee BTC_WEEKLY_VALUE_AREA_BREAKOUT_B15_Run.log
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_VALUE_AREA_BREAKOUT_B15_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC value-area breakout B15 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
