name: ETH B27DX S7A Event Quality Filter

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s7a-event-quality-filter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s7a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S7A event-quality filter discovery
        run: python research/eth_b27dx_s7a_event_quality_filter.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S7A_EVENT_QUALITY_FILTER_*.md ETH_B27DX_S7A_EVENT_QUALITY_FILTER_*.csv ETH_B27DX_S7A_EVENT_QUALITY_FILTER_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH B27DX S7A event-quality filter results"
            git pull --rebase origin main
            git push origin main
          fi
