name: SOL Long New-Zone H2 Recovery A18

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_NEW_ZONE_H2_RECOVERY_A18_Preregistration.md'
      - 'research/sol_long_new_zone_h2_recovery_a18.py'
      - '.github/workflows/sol-long-new-zone-h2-recovery-a18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas requests

      - name: Run A18 new-zone H2 recovery
        run: python research/sol_long_new_zone_h2_recovery_a18.py

      - name: Persist A18 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_NEW_ZONE_H2_RECOVERY_A18_Result.md \
                  SOL_LONG_NEW_ZONE_H2_RECOVERY_A18_DEVELOPMENT.csv \
                  SOL_LONG_NEW_ZONE_H2_RECOVERY_A18_OOS.csv \
                  SOL_LONG_NEW_ZONE_H2_RECOVERY_A18_TRADES.csv \
                  SOL_LONG_NEW_ZONE_H2_RECOVERY_A18_Status.txt
          if git diff --cached --quiet; then
            echo "No A18 output changes"
            exit 0
          fi
          git commit -m "Persist SOL A18 new-zone H2 recovery results"
          for i in 1 2 3; do
            git pull --rebase origin research/sol-long-structure-a1-run && git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep 3
          done
          exit 1
