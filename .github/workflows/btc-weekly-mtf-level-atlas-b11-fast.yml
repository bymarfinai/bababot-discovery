name: BTC Weekly MTF Level Atlas B11 FAST1
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_mtf_level_atlas_b11.py'
      - 'research/btc_weekly_mtf_level_atlas_b11_fast_runner.py'
      - 'BTC_WEEKLY_MTF_LEVEL_ATLAS_B11_Preregistration.md'
      - '.github/workflows/btc-weekly-mtf-level-atlas-b11-fast.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas requests scikit-learn
      - name: Compile B11 FAST1
        run: python -m py_compile research/btc_weekly_mtf_level_atlas_b11.py research/btc_weekly_mtf_level_atlas_b11_fast_runner.py
      - name: Run B11 FAST1
        run: PYTHONPATH=research python research/btc_weekly_mtf_level_atlas_b11_fast_runner.py > BTC_WEEKLY_MTF_LEVEL_ATLAS_B11_FAST_Run.log 2>&1
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_MTF_LEVEL_ATLAS_B11_FAST_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC weekly MTF level atlas B11 FAST1 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
