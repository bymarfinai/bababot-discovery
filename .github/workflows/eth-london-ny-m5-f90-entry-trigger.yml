name: ETH London NY M5 F90 Entry Trigger

on:
  push:
    paths:
      - 'ETH_LONDON_NY_M5_F90_ENTRY_TRIGGER_Preregistration.md'
      - 'research/eth_london_ny_m5_f90_entry_trigger.py'
      - '.github/workflows/eth-london-ny-m5-f90-entry-trigger.yml'
  workflow_dispatch:

jobs:
  m5:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH London-NY M5
        run: python research/eth_london_ny_m5_f90_entry_trigger.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add ETH_LONDON_NY_M5_F90_ENTRY_TRIGGER_Result.md ETH_LONDON_NY_M5_F90_ENTRY_TRIGGER_Summary.csv ETH_LONDON_NY_M5_F90_ENTRY_TRIGGER_Audit.csv ETH_LONDON_NY_M5_F90_ENTRY_TRIGGER_Status.txt
          git commit -m "research: persist ETH London-NY M5 F90 entry trigger" || true
          git push
