name: V7 H FIB 24h Consensus Robustness

on:
  push:
    branches: [v7-regime-failed-breakout]
    paths:
      - 'research/v7_h_fib_24h_consensus_robustness.py'
      - '.github/workflows/v7-fib-24h-consensus-robustness.yml'
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26.0' 'fastapi>=0.110'
      - name: Reconstruct official archives and run frozen robustness test
        run: PYTHONPATH=. python research/v7_h_fib_24h_consensus_robustness.py
