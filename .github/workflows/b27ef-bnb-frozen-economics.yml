name: B27EF BNB frozen BTC-rule economics transfer

on:
  push:
    branches: [main]
    paths:
      - 'BNB_F85_F15_TRANSFER_M3_FROZEN_ECONOMICS_B27EF_Preregistration.md'
      - 'research/bnb_f85_f15_transfer_m3_frozen_economics_b27ef.py'
      - '.github/workflows/b27ef-bnb-frozen-economics.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m3:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[B27EF]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27EF frozen economics only
        id: run
        shell: bash
        run: |
          set +e
          LOG=BNB_F85_F15_TRANSFER_M3_FROZEN_ECONOMICS_B27EF_Run.log
          echo 'B27EF BNB frozen BTC-rule economics transfer' > "$LOG"
          echo "commit=$(git rev-parse HEAD)" >> "$LOG"
          python -m py_compile research/bnb_f85_f15_transfer_m3_frozen_economics_b27ef.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/bnb_f85_f15_transfer_m3_frozen_economics_b27ef.py >> "$LOG" 2>&1
            rc=$?
          fi
          cat "$LOG"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27ef-bnb-frozen-economics
          path: BNB_F85_F15_TRANSFER_M3_FROZEN_ECONOMICS_B27EF_*
      - name: Persist B27EF outputs
        if: always() && steps.run.outputs.rc == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A BNB_F85_F15_TRANSFER_M3_FROZEN_ECONOMICS_B27EF_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27EF BNB frozen economics results'
            git push
          fi
      - name: Fail on B27EF execution error
        if: steps.run.outputs.rc != '0'
        run: exit 1
