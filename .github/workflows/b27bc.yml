name: B27BC post-H2 equal-distance hard-stop economics

on:
  push:
    branches: [main]
    paths:
      - 'BTC_LONDON_NY_SHORT_POST_H2_EQUAL_DISTANCE_STOP_B27BC_Preregistration.md'
      - 'research/btc_london_ny_short_post_h2_equal_distance_stop_b27bc.py'
      - '.github/workflows/b27bc.yml'
      - '.b27bc-trigger'
  pull_request:
    branches: [main]
    paths:
      - 'research/btc_london_ny_short_post_h2_equal_distance_stop_b27bc.py'
      - '.github/workflows/b27bc.yml'
      - '.b27bc-trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_london_ny_short_post_h2_equal_distance_stop_b27bc.py
      - name: Run B27BC
        run: python research/btc_london_ny_short_post_h2_equal_distance_stop_b27bc.py
      - name: Persist results on main push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
        run: |
          if [ -f BTC_LONDON_NY_SHORT_POST_H2_EQUAL_DISTANCE_STOP_B27BC_Result.md ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add BTC_LONDON_NY_SHORT_POST_H2_EQUAL_DISTANCE_STOP_B27BC_Result.md \
                    BTC_LONDON_NY_SHORT_POST_H2_EQUAL_DISTANCE_STOP_B27BC_Trades.csv \
                    BTC_LONDON_NY_SHORT_POST_H2_EQUAL_DISTANCE_STOP_B27BC_Summary.csv \
                    BTC_LONDON_NY_SHORT_POST_H2_EQUAL_DISTANCE_STOP_B27BC_Status.txt
            git diff --cached --quiet || git commit -m 'Persist B27BC equal-distance stop results'
            git push
          fi
