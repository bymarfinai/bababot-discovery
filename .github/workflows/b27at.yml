name: B27AT short full hybrid activation grid
on:
  push:
    paths:
      - 'research/btc_london_ny_short_f15_full_hybrid_activation_grid_b27at.py'
      - 'BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_Preregistration.md'
      - '.github/workflows/b27at.yml'
  pull_request:
    paths:
      - 'research/B27AT_OBSERVABLE_RUN.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_london_ny_short_f15_full_hybrid_activation_grid_b27at.py
      - name: Run B27AT
        shell: bash
        run: |
          set +e
          cd research
          python btc_london_ny_short_f15_full_hybrid_activation_grid_b27at.py 2>&1 | tee ../BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_CI_LOG.txt
          code=${PIPESTATUS[0]}
          cd ..
          echo "EXIT_CODE=$code" >> BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_CI_LOG.txt
          exit $code
      - if: github.event_name == 'push' && always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_Result.md BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_Trades.csv BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_Summary.csv BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_Status.txt BTC_LONDON_NY_SHORT_F15_FULL_HYBRID_ACTIVATION_GRID_B27AT_CI_LOG.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'research: persist B27AT full hybrid activation grid result'
            git push
          fi
