name: B27CF post-reclaim SHORT entry ladder

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_post_reclaim_entry_ladder_b27cf.py'
      - 'BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Preregistration.md'
      - '.github/workflows/b27cf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27CF
        id: run
        shell: bash
        run: |
          set +e
          echo "B27CF diagnostic run start" > BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Run.log
          echo "commit=$GITHUB_SHA" >> BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Run.log
          python -m py_compile research/btc_24h_post_reclaim_entry_ladder_b27cf.py >> BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Run.log 2>&1
          c=$?
          echo "compile_exit_code=$c" >> BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Run.log
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_post_reclaim_entry_ladder_b27cf.py >> BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Run.log 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_Run.log
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27cf-results
          path: |
            BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_*
      - name: Persist B27CF
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_POST_RECLAIM_ENTRY_LADDER_B27CF_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CF post-reclaim entry ladder outputs'
            git push
          fi
      - name: Fail if script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
