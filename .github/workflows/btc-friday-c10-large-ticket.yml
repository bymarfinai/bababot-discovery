name: BTC Friday C10A Large Ticket

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_friday_c10a_large_ticket_impulse.py'
      - 'BTC_Friday_C10A_Large_Ticket_Impulse_Preregistration.md'
      - '.github/workflows/btc-friday-c10-large-ticket.yml'

permissions:
  contents: write

concurrency:
  group: btc-friday-c10a-large-ticket
  cancel-in-progress: true

jobs:
  c10a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run frozen C10A
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_friday_c10a_large_ticket_impulse.py > BTC_Friday_C10A_Large_Ticket_Impulse_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Friday_C10A_Large_Ticket_Impulse_EXIT_CODE.txt
          cat BTC_Friday_C10A_Large_Ticket_Impulse_Run.log
          exit $code
      - name: Persist artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Friday_C10A_Large_Ticket_Impulse_EXIT_CODE.txt BTC_Friday_C10A_Large_Ticket_Impulse_Run.log
          for f in BTC_Friday_C10A_Large_Ticket_Impulse_Result.md BTC_Friday_C10A_Large_Ticket_Impulse_Result.json BTC_Friday_C10A_Large_Ticket_Impulse_Rows.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m c10a-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_Friday_C10A_Large_Ticket_Impulse_EXIT_CODE.txt BTC_Friday_C10A_Large_Ticket_Impulse_Run.log
            for f in BTC_Friday_C10A_Large_Ticket_Impulse_Result.md BTC_Friday_C10A_Large_Ticket_Impulse_Result.json BTC_Friday_C10A_Large_Ticket_Impulse_Rows.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist BTC Friday large-ticket impulse C10A result"
            git push
          fi
      - name: Fail if run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
