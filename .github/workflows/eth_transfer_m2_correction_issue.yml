name: ETH M2 causal correction issue runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  correct_m2:
    if: github.event.issue.title == 'RUN_ETH_M2_CAUSAL_CORRECTION'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run corrected ETH M2
        shell: bash
        run: |
          python -m py_compile research/eth_f85_f15_transfer_m2_causal_correction.py
          python research/eth_f85_f15_transfer_m2_causal_correction.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-transfer-m2-causal-correction-issue
          path: |
            ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_*
      - name: Persist corrected M2 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist corrected ETH transfer M2 results'
            git push
          fi
