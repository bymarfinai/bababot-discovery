name: ETH R4b Stage F 2026 temporal regime diagnostic

on:
  push:
    branches:
      - eth-r4-cohort-plateau-screen
    paths:
      - '.r4b-stageF-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageF:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen H04 2026 temporal-regime diagnostic
        run: python research/eth_r4b_stageF_2026_temporal_regime_diagnostic.py
      - name: Persist Stage F outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R4B_STAGE_F_2026_TEMPORAL_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH R4b stageF 2026 temporal diagnostic"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r4b-stageF-2026-temporal-diagnostic
          path: 'ETH_R4B_STAGE_F_2026_TEMPORAL_*'
          if-no-files-found: error
