name: Sunday SF13 Preentry Morphology
on:
  push:
    paths:
      - 'research/sunday_fridaymethod_sf13_preentry_expansion_morphology.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run Sunday SF13 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUNFM13_OUT=sunfm13_out python sunday_fridaymethod_sf13_preentry_expansion_morphology.py > ../SUNFM13_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUNFM13_RUN.log
          printf '%s\n' "$rc" > SUNFM13_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sunfm13_out/SUNDAY_FRIDAY_METHOD_SF13_PREENTRY_MORPH.md BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph.md
            cp research/sunfm13_out/sunfm13_summary.json BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_Summary.json
            cp research/sunfm13_out/sunfm13_rows.csv BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_Rows.csv
            rm -f BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph.md BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_Summary.json BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_Rows.csv SUNFM13_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SF13 preentry morphology"
          else
            cp SUNFM13_RUN.log BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF13_Preentry_Morph_ERROR.log SUNFM13_EXIT_CODE.txt
            msg="ci: persist Sunday SF13 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunfm13-output
          path: |
            SUNFM13_RUN.log
            SUNFM13_EXIT_CODE.txt
            research/sunfm13_out/SUNDAY_FRIDAY_METHOD_SF13_PREENTRY_MORPH.md
            research/sunfm13_out/sunfm13_summary.json
            research/sunfm13_out/sunfm13_rows.csv
