name: F6.33 Friday Fake Bounce vs Slow Recovery Forensic
on:
  push:
    paths:
      - 'research/f633_friday_fake_bounce_vs_slow_recovery_forensic.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.33 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F633_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F633_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.33 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.33 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          F633_OUT=f633_out python f633_friday_fake_bounce_vs_slow_recovery_forensic.py > ../F633_RUN.log 2>&1
          rc=$?
          cd ..
          cat F633_RUN.log
          printf '%s\n' "$rc" > F633_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/f633_out/F6.33_CHECKPOINT.md BTC_Temporal_Friday_F633_Fake_Bounce_vs_Slow_Recovery_Forensic_Checkpoint.md
            cp research/f633_out/f633_summary.json BTC_Temporal_Friday_F633_Fake_Bounce_vs_Slow_Recovery_Forensic_Summary.json
            rm -f BTC_Temporal_Friday_F633_ERROR.log
            git add BTC_Temporal_Friday_F633_Fake_Bounce_vs_Slow_Recovery_Forensic_Checkpoint.md BTC_Temporal_Friday_F633_Fake_Bounce_vs_Slow_Recovery_Forensic_Summary.json F633_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F633_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Friday F6.33 fake-bounce vs slow-recovery forensic"
          else
            cp F633_RUN.log BTC_Temporal_Friday_F633_ERROR.log
            git add BTC_Temporal_Friday_F633_ERROR.log F633_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Friday F6.33 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f633-output
          path: |
            F633_RUN.log
            F633_EXIT_CODE.txt
            research/f633_out/F6.33_CHECKPOINT.md
            research/f633_out/f633_summary.json
            research/f633_out/f633_rows.csv
