name: Sunday Friday-Method SF0-SF4
on:
  push:
    paths:
      - 'research/sunday_fridaymethod_sf0_sf4.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run Sunday Friday-method and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUNFM_OUT=sunfm_out python sunday_fridaymethod_sf0_sf4.py > ../SUNFM_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUNFM_RUN.log
          printf '%s\n' "$rc" > SUNFM_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sunfm_out/SUNDAY_FRIDAY_METHOD_SF0_SF4_CHECKPOINT.md BTC_Temporal_Sunday_FridayMethod_SF0_SF4_Checkpoint.md
            cp research/sunfm_out/sunfm_summary.json BTC_Temporal_Sunday_FridayMethod_SF0_SF4_Summary.json
            cp research/sunfm_out/sunfm_rows.csv BTC_Temporal_Sunday_FridayMethod_SF0_SF4_Rows.csv
            rm -f BTC_Temporal_Sunday_FridayMethod_SF0_SF4_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF0_SF4_Checkpoint.md BTC_Temporal_Sunday_FridayMethod_SF0_SF4_Summary.json BTC_Temporal_Sunday_FridayMethod_SF0_SF4_Rows.csv SUNFM_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_FridayMethod_SF0_SF4_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday Friday-method SF0-SF4"
          else
            cp SUNFM_RUN.log BTC_Temporal_Sunday_FridayMethod_SF0_SF4_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF0_SF4_ERROR.log SUNFM_EXIT_CODE.txt
            msg="ci: persist Sunday Friday-method SF0-SF4 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunfm-output
          path: |
            SUNFM_RUN.log
            SUNFM_EXIT_CODE.txt
            research/sunfm_out/SUNDAY_FRIDAY_METHOD_SF0_SF4_CHECKPOINT.md
            research/sunfm_out/sunfm_summary.json
            research/sunfm_out/sunfm_rows.csv
