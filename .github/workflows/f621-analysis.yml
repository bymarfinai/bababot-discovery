name: SUN1.5 Tuesday Geometry Transfer to Sunday
on:
  push:
    paths:
      - 'research/sun15_tuesday_geometry_transfer.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN1.5 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN15_OUT=sun15_out python sun15_tuesday_geometry_transfer.py > ../SUN15_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN15_RUN.log
          printf '%s\n' "$rc" > SUN15_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun15_out/SUN1.5_CHECKPOINT.md BTC_Temporal_Sunday_SUN15_Tuesday_Geometry_Transfer_Checkpoint.md
            cp research/sun15_out/sun15_summary.json BTC_Temporal_Sunday_SUN15_Tuesday_Geometry_Transfer_Summary.json
            rm -f BTC_Temporal_Sunday_SUN15_ERROR.log
            git add BTC_Temporal_Sunday_SUN15_Tuesday_Geometry_Transfer_Checkpoint.md BTC_Temporal_Sunday_SUN15_Tuesday_Geometry_Transfer_Summary.json SUN15_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_SUN15_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN1.5 Tuesday geometry transfer"
          else
            cp SUN15_RUN.log BTC_Temporal_Sunday_SUN15_ERROR.log
            git add BTC_Temporal_Sunday_SUN15_ERROR.log SUN15_EXIT_CODE.txt
            msg="ci: persist Sunday SUN1.5 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun15-output
          path: |
            SUN15_RUN.log
            SUN15_EXIT_CODE.txt
            research/sun15_out/SUN1.5_CHECKPOINT.md
            research/sun15_out/sun15_summary.json
