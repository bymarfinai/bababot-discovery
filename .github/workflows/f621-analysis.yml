name: F6.41 Friday F6.38 True-OOS August
on:
  push:
    paths:
      - 'research/f641_friday_f638_true_oos_august.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.41 and persist once
        shell: bash
        run: |
          set +e
          cd research
          F641_OUT=f641_out python f641_friday_f638_true_oos_august.py > ../F641_RUN.log 2>&1
          rc=$?
          cd ..
          cat F641_RUN.log
          printf '%s\n' "$rc" > F641_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/f641_out/F6.41_CHECKPOINT.md BTC_Temporal_Friday_F641_F638_True_OOS_August_Checkpoint.md
            cp research/f641_out/f641_summary.json BTC_Temporal_Friday_F641_F638_True_OOS_August_Summary.json
            cp research/f641_out/f641_oos_rows.csv BTC_Temporal_Friday_F641_F638_True_OOS_August_Rows.csv
            rm -f BTC_Temporal_Friday_F641_F638_True_OOS_August_ERROR.log
            git add BTC_Temporal_Friday_F641_F638_True_OOS_August_Checkpoint.md BTC_Temporal_Friday_F641_F638_True_OOS_August_Summary.json BTC_Temporal_Friday_F641_F638_True_OOS_August_Rows.csv F641_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F641_F638_True_OOS_August_ERROR.log 2>/dev/null || true
            msg="research: persist Friday F6.41 F6.38 true-OOS August replay"
          else
            cp F641_RUN.log BTC_Temporal_Friday_F641_F638_True_OOS_August_ERROR.log
            git add BTC_Temporal_Friday_F641_F638_True_OOS_August_ERROR.log F641_EXIT_CODE.txt
            msg="ci: persist Friday F6.41 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f641-output
          path: |
            F641_RUN.log
            F641_EXIT_CODE.txt
            research/f641_out/F6.41_CHECKPOINT.md
            research/f641_out/f641_summary.json
            research/f641_out/f641_oos_rows.csv
