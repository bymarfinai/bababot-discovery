name: SUN1.7b Sunday16 Loss Previous-Day Forensics
on:
  push:
    paths:
      - 'research/sun17b_sunday16_loss_prevday_forensics_exactfunding.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN1.7b and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN17_OUT=sun17_out python sun17b_sunday16_loss_prevday_forensics_exactfunding.py > ../SUN17_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN17_RUN.log
          printf '%s\n' "$rc" > SUN17_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun17_out/SUN1.7_CHECKPOINT.md BTC_Temporal_Sunday16_SUN17_Loss_PreviousDay_Forensics_Checkpoint.md
            cp research/sun17_out/sun17_summary.json BTC_Temporal_Sunday16_SUN17_Loss_PreviousDay_Forensics_Summary.json
            rm -f BTC_Temporal_Sunday16_SUN17_ERROR.log
            git add BTC_Temporal_Sunday16_SUN17_Loss_PreviousDay_Forensics_Checkpoint.md BTC_Temporal_Sunday16_SUN17_Loss_PreviousDay_Forensics_Summary.json SUN17_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday16_SUN17_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN1.7b loss previous-day forensics"
          else
            cp SUN17_RUN.log BTC_Temporal_Sunday16_SUN17_ERROR.log
            git add BTC_Temporal_Sunday16_SUN17_ERROR.log SUN17_EXIT_CODE.txt
            msg="ci: persist Sunday SUN1.7b traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun17b-output
          path: |
            SUN17_RUN.log
            SUN17_EXIT_CODE.txt
            research/sun17_out/SUN1.7_CHECKPOINT.md
            research/sun17_out/sun17_summary.json
            research/sun17_out/sun17_trades.csv
