name: SUN2.1 Sunday16 Bad-State Forensics
on:
  push:
    paths:
      - 'research/sun21_sunday16_badstate_forensics.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN2.1 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN21_OUT=sun21_out python sun21_sunday16_badstate_forensics.py > ../SUN21_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN21_RUN.log
          printf '%s\n' "$rc" > SUN21_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun21_out/SUN2.1_CHECKPOINT.md BTC_Temporal_Sunday16_SUN21_BadState_Forensics_Checkpoint.md
            cp research/sun21_out/sun21_summary.json BTC_Temporal_Sunday16_SUN21_BadState_Forensics_Summary.json
            cp research/sun21_out/sun21_badstate_trades.csv BTC_Temporal_Sunday16_SUN21_BadState_Forensics_Trades.csv
            rm -f BTC_Temporal_Sunday16_SUN21_ERROR.log
            git add BTC_Temporal_Sunday16_SUN21_BadState_Forensics_Checkpoint.md BTC_Temporal_Sunday16_SUN21_BadState_Forensics_Summary.json BTC_Temporal_Sunday16_SUN21_BadState_Forensics_Trades.csv SUN21_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday16_SUN21_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN2.1 bad-state forensics"
          else
            cp SUN21_RUN.log BTC_Temporal_Sunday16_SUN21_ERROR.log
            git add BTC_Temporal_Sunday16_SUN21_ERROR.log SUN21_EXIT_CODE.txt
            msg="ci: persist Sunday SUN2.1 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun21-output
          path: |
            SUN21_RUN.log
            SUN21_EXIT_CODE.txt
            research/sun21_out/SUN2.1_CHECKPOINT.md
            research/sun21_out/sun21_summary.json
            research/sun21_out/sun21_badstate_trades.csv
