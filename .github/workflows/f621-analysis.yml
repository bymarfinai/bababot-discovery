name: Sunday SF11-SF12 Preentry Regime
on:
  push:
    paths:
      - 'research/sunday_fridaymethod_sf11_sf12_preentry_regime.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run Sunday SF11-SF12 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUNFM1112_OUT=sunfm1112_out python sunday_fridaymethod_sf11_sf12_preentry_regime.py > ../SUNFM1112_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUNFM1112_RUN.log
          printf '%s\n' "$rc" > SUNFM1112_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sunfm1112_out/SUNDAY_FRIDAY_METHOD_SF11_SF12_PREENTRY_REGIME.md BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime.md
            cp research/sunfm1112_out/sunfm1112_summary.json BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_Summary.json
            cp research/sunfm1112_out/sunfm1112_rows.csv BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_Rows.csv
            rm -f BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime.md BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_Summary.json BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_Rows.csv SUNFM1112_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SF11-SF12 preentry regime"
          else
            cp SUNFM1112_RUN.log BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF11_SF12_Preentry_Regime_ERROR.log SUNFM1112_EXIT_CODE.txt
            msg="ci: persist Sunday SF11-SF12 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunfm1112-output
          path: |
            SUNFM1112_RUN.log
            SUNFM1112_EXIT_CODE.txt
            research/sunfm1112_out/SUNDAY_FRIDAY_METHOD_SF11_SF12_PREENTRY_REGIME.md
            research/sunfm1112_out/sunfm1112_summary.json
            research/sunfm1112_out/sunfm1112_rows.csv
