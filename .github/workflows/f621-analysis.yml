name: F6.39 Friday Exact Balance-Gate Robustness Audit
on:
  push:
    paths:
      - 'research/f639_friday_exact_balance_gate_robustness_audit.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.39 and persist once
        shell: bash
        run: |
          set +e
          cd research
          F639_OUT=f639_out python f639_friday_exact_balance_gate_robustness_audit.py > ../F639_RUN.log 2>&1
          rc=$?
          cd ..
          cat F639_RUN.log
          printf '%s\n' "$rc" > F639_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/f639_out/F6.39_CHECKPOINT.md BTC_Temporal_Friday_F639_Exact_Balance_Gate_Robustness_Audit_Checkpoint.md
            cp research/f639_out/f639_summary.json BTC_Temporal_Friday_F639_Exact_Balance_Gate_Robustness_Audit_Summary.json
            rm -f BTC_Temporal_Friday_F639_ERROR.log
            git add BTC_Temporal_Friday_F639_Exact_Balance_Gate_Robustness_Audit_Checkpoint.md BTC_Temporal_Friday_F639_Exact_Balance_Gate_Robustness_Audit_Summary.json F639_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F639_ERROR.log 2>/dev/null || true
            msg="research: persist Friday F6.39 exact balance gate robustness audit"
          else
            cp F639_RUN.log BTC_Temporal_Friday_F639_ERROR.log
            git add BTC_Temporal_Friday_F639_ERROR.log F639_EXIT_CODE.txt
            msg="ci: persist Friday F6.39 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f639-output
          path: |
            F639_RUN.log
            F639_EXIT_CODE.txt
            research/f639_out/F6.39_CHECKPOINT.md
            research/f639_out/f639_summary.json
            research/f639_out/f639_rows.csv
