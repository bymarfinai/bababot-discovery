name: F6.29 Friday Adaptive Recovery-Fail Management
on:
  push:
    paths:
      - 'research/f629_friday_context_recovery_fail20_management.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.29 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F629_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F629_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.29 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.29 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          F629_OUT=f629_out python f629_friday_context_recovery_fail20_management.py > ../F629_RUN.log 2>&1
          rc=$?
          cd ..
          cat F629_RUN.log
          printf '%s\n' "$rc" > F629_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/f629_out/F6.29_CHECKPOINT.md BTC_Temporal_Friday_F629_Context_Recovery_Fail20_Management_Checkpoint.md
            cp research/f629_out/f629_summary.json BTC_Temporal_Friday_F629_Context_Recovery_Fail20_Management_Summary.json
            rm -f BTC_Temporal_Friday_F629_ERROR.log
            git add BTC_Temporal_Friday_F629_Context_Recovery_Fail20_Management_Checkpoint.md BTC_Temporal_Friday_F629_Context_Recovery_Fail20_Management_Summary.json F629_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F629_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Friday F6.29 adaptive recovery-fail result"
          else
            cp F629_RUN.log BTC_Temporal_Friday_F629_ERROR.log
            git add BTC_Temporal_Friday_F629_ERROR.log F629_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Friday F6.29 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f629-output
          path: |
            F629_RUN.log
            F629_EXIT_CODE.txt
            research/f629_out/F6.29_CHECKPOINT.md
            research/f629_out/f629_summary.json
            research/f629_out/f629_rows.csv
