name: F6.21 Friday Trajectory Persistence Forensic
on:
  push:
    paths:
      - 'research/f621_friday_low_giveback_trajectory_forensic.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.21 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F621_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F621_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.21 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: |
          cd research
          F621_OUT=f621_out python f621_friday_low_giveback_trajectory_forensic.py
      - uses: actions/upload-artifact@v4
        with:
          name: f621-output
          path: |
            research/f621_out/F6.21_CHECKPOINT.md
            research/f621_out/f621_summary.json
            research/f621_out/f621_rows.csv
            research/f621_out/f621_trajectory_atlas.csv
      - name: Persist forensic checkpoint
        run: |
          cp research/f621_out/F6.21_CHECKPOINT.md BTC_Temporal_Friday_F621_Trajectory_Persistence_Forensic_Checkpoint.md
          cp research/f621_out/f621_summary.json BTC_Temporal_Friday_F621_Trajectory_Persistence_Forensic_Summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F621_Trajectory_Persistence_Forensic_Checkpoint.md BTC_Temporal_Friday_F621_Trajectory_Persistence_Forensic_Summary.json
          git diff --cached --quiet || git commit -m "research: persist Friday F6.21 trajectory forensic"
          git push
