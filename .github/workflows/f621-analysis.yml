name: F6.28 Friday Recovery Sequence 10-30 Forensic
on:
  push:
    paths:
      - 'research/f628_friday_recovery_sequence_10_30_forensic.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.28 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F628_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F628_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.28 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.28 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          F628_OUT=f628_out python f628_friday_recovery_sequence_10_30_forensic.py > ../F628_RUN.log 2>&1
          rc=$?
          cd ..
          cat F628_RUN.log
          printf '%s\n' "$rc" > F628_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/f628_out/F6.28_CHECKPOINT.md BTC_Temporal_Friday_F628_Recovery_Sequence_10_30_Forensic_Checkpoint.md
            cp research/f628_out/f628_summary.json BTC_Temporal_Friday_F628_Recovery_Sequence_10_30_Forensic_Summary.json
            rm -f BTC_Temporal_Friday_F628_ERROR.log
            git add BTC_Temporal_Friday_F628_Recovery_Sequence_10_30_Forensic_Checkpoint.md BTC_Temporal_Friday_F628_Recovery_Sequence_10_30_Forensic_Summary.json F628_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F628_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Friday F6.28 recovery sequence forensic"
          else
            cp F628_RUN.log BTC_Temporal_Friday_F628_ERROR.log
            git add BTC_Temporal_Friday_F628_ERROR.log F628_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Friday F6.28 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f628-output
          path: |
            F628_RUN.log
            F628_EXIT_CODE.txt
            research/f628_out/F6.28_CHECKPOINT.md
            research/f628_out/f628_summary.json
            research/f628_out/f628_rows.csv
