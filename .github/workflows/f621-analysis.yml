name: Sunday SF10 True-OOS August Comparison
on:
  push:
    paths:
      - 'research/sunday_fridaymethod_sf10_true_oos_august.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run Sunday SF10 true-OOS comparison and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUNFM10_OUT=sunfm10_out python sunday_fridaymethod_sf10_true_oos_august.py > ../SUNFM10_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUNFM10_RUN.log
          printf '%s\n' "$rc" > SUNFM10_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sunfm10_out/SUNDAY_FRIDAY_METHOD_SF10_TRUE_OOS_AUGUST.md BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August.md
            cp research/sunfm10_out/sunfm10_true_oos_august_summary.json BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_Summary.json
            cp research/sunfm10_out/sunfm10_true_oos_august_rows.csv BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_Rows.csv
            rm -f BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August.md BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_Summary.json BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_Rows.csv SUNFM10_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SF10 true-OOS August comparison"
          else
            cp SUNFM10_RUN.log BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF10_True_OOS_August_ERROR.log SUNFM10_EXIT_CODE.txt
            msg="ci: persist Sunday SF10 true-OOS traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunfm10-output
          path: |
            SUNFM10_RUN.log
            SUNFM10_EXIT_CODE.txt
            research/sunfm10_out/SUNDAY_FRIDAY_METHOD_SF10_TRUE_OOS_AUGUST.md
            research/sunfm10_out/sunfm10_true_oos_august_summary.json
            research/sunfm10_out/sunfm10_true_oos_august_rows.csv
