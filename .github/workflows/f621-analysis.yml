name: SUN1.2 Sunday Hold-Exit and All-Hour Surface
on:
  push:
    paths:
      - 'research/sun12_sunday_hold_exit_and_allhour_surface.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN1.2 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN12_OUT=sun12_out python sun12_sunday_hold_exit_and_allhour_surface.py > ../SUN12_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN12_RUN.log
          printf '%s\n' "$rc" > SUN12_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun12_out/SUN1.2_CHECKPOINT.md BTC_Temporal_Sunday_SUN12_Hold_Exit_AllHour_Surface_Checkpoint.md
            cp research/sun12_out/sun12_summary.json BTC_Temporal_Sunday_SUN12_Hold_Exit_AllHour_Surface_Summary.json
            rm -f BTC_Temporal_Sunday_SUN12_ERROR.log
            git add BTC_Temporal_Sunday_SUN12_Hold_Exit_AllHour_Surface_Checkpoint.md BTC_Temporal_Sunday_SUN12_Hold_Exit_AllHour_Surface_Summary.json SUN12_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_SUN12_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN1.2 hold-exit and all-hour surface"
          else
            cp SUN12_RUN.log BTC_Temporal_Sunday_SUN12_ERROR.log
            git add BTC_Temporal_Sunday_SUN12_ERROR.log SUN12_EXIT_CODE.txt
            msg="ci: persist Sunday SUN1.2 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun12-output
          path: |
            SUN12_RUN.log
            SUN12_EXIT_CODE.txt
            research/sun12_out/SUN1.2_CHECKPOINT.md
            research/sun12_out/sun12_summary.json
            research/sun12_out/sun12_all_surface.csv
