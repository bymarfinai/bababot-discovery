name: SUN1.6 Sunday16 TP Boundary Extension
on:
  push:
    paths:
      - 'research/sun16_sunday16_tp_boundary_extension.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN1.6 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN16_OUT=sun16_out python sun16_sunday16_tp_boundary_extension.py > ../SUN16_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN16_RUN.log
          printf '%s\n' "$rc" > SUN16_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun16_out/SUN1.6_CHECKPOINT.md BTC_Temporal_Sunday16_SUN16_TP_Boundary_Extension_Checkpoint.md
            cp research/sun16_out/sun16_summary.json BTC_Temporal_Sunday16_SUN16_TP_Boundary_Extension_Summary.json
            rm -f BTC_Temporal_Sunday16_SUN16_ERROR.log
            git add BTC_Temporal_Sunday16_SUN16_TP_Boundary_Extension_Checkpoint.md BTC_Temporal_Sunday16_SUN16_TP_Boundary_Extension_Summary.json SUN16_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday16_SUN16_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN1.6 TP boundary extension"
          else
            cp SUN16_RUN.log BTC_Temporal_Sunday16_SUN16_ERROR.log
            git add BTC_Temporal_Sunday16_SUN16_ERROR.log SUN16_EXIT_CODE.txt
            msg="ci: persist Sunday SUN1.6 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun16-output
          path: |
            SUN16_RUN.log
            SUN16_EXIT_CODE.txt
            research/sun16_out/SUN1.6_CHECKPOINT.md
            research/sun16_out/sun16_summary.json
