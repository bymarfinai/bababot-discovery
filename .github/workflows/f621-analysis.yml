name: Tuesday August Compression Guard Diagnostic
on:
  push:
    paths:
      - 'research/tuesday_august_compression_guard_diagnostic.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run compression guard diagnostic and persist
        shell: bash
        run: |
          set +e
          cd research
          TUECOMPG_OUT=tuecompg_out python tuesday_august_compression_guard_diagnostic.py > ../TUECOMPG_RUN.log 2>&1
          rc=$?
          cd ..
          cat TUECOMPG_RUN.log
          printf '%s\n' "$rc" > TUECOMPG_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/tuecompg_out/TUESDAY_AUGUST_COMPRESSION_GUARD_DIAGNOSTIC.md BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic.md
            cp research/tuecompg_out/tuesday_august_compression_guard_summary.json BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic_Summary.json
            rm -f BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic_ERROR.log
            git add BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic.md BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic_Summary.json TUECOMPG_EXIT_CODE.txt
            git add -u BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic_ERROR.log 2>/dev/null || true
            msg="research: persist Tuesday August compression guard diagnostic"
          else
            cp TUECOMPG_RUN.log BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic_ERROR.log
            git add BTC_Temporal_Tuesday_August_Compression_Guard_Diagnostic_ERROR.log TUECOMPG_EXIT_CODE.txt
            msg="ci: persist Tuesday compression diagnostic traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuecompg-output
          path: |
            TUECOMPG_RUN.log
            TUECOMPG_EXIT_CODE.txt
            research/tuecompg_out/TUESDAY_AUGUST_COMPRESSION_GUARD_DIAGNOSTIC.md
            research/tuecompg_out/tuesday_august_compression_guard_summary.json
