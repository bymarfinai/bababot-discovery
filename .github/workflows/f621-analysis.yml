name: SUN1.0 Sunday 01:00 TP-SL Discovery Validation Surface
on:
  push:
    paths:
      - 'research/sun10_sunday01_tpsl_surface.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN1.0 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN10_OUT=sun10_out python sun10_sunday01_tpsl_surface.py > ../SUN10_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN10_RUN.log
          printf '%s\n' "$rc" > SUN10_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun10_out/SUN1.0_CHECKPOINT.md BTC_Temporal_Sunday01_SUN10_TPSL_Surface_Checkpoint.md
            cp research/sun10_out/sun10_summary.json BTC_Temporal_Sunday01_SUN10_TPSL_Surface_Summary.json
            rm -f BTC_Temporal_Sunday01_SUN10_ERROR.log
            git add BTC_Temporal_Sunday01_SUN10_TPSL_Surface_Checkpoint.md BTC_Temporal_Sunday01_SUN10_TPSL_Surface_Summary.json SUN10_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday01_SUN10_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN1.0 TP-SL surface"
          else
            cp SUN10_RUN.log BTC_Temporal_Sunday01_SUN10_ERROR.log
            git add BTC_Temporal_Sunday01_SUN10_ERROR.log SUN10_EXIT_CODE.txt
            msg="ci: persist Sunday SUN1.0 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun10-output
          path: |
            SUN10_RUN.log
            SUN10_EXIT_CODE.txt
            research/sun10_out/SUN1.0_CHECKPOINT.md
            research/sun10_out/sun10_summary.json
            research/sun10_out/sun10_surface.csv
            research/sun10_out/sun10_champion_trades.csv
