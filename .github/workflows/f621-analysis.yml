name: Tuesday August Failure Forensics
on:
  push:
    paths:
      - 'research/tuesday_august_failure_forensics.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run Tuesday August failure forensics and persist
        shell: bash
        run: |
          set +e
          cd research
          TUEAUGF_OUT=tueaugf_out python tuesday_august_failure_forensics.py > ../TUEAUGF_RUN.log 2>&1
          rc=$?
          cd ..
          cat TUEAUGF_RUN.log
          printf '%s\n' "$rc" > TUEAUGF_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/tueaugf_out/TUESDAY_AUGUST_FAILURE_FORENSICS.md BTC_Temporal_Tuesday_August_Failure_Forensics.md
            cp research/tueaugf_out/tuesday_august_failure_forensics_summary.json BTC_Temporal_Tuesday_August_Failure_Forensics_Summary.json
            cp research/tueaugf_out/tuesday_august_forensic_historical.csv BTC_Temporal_Tuesday_August_Forensic_Historical.csv
            cp research/tueaugf_out/tuesday_august_forensic_august.csv BTC_Temporal_Tuesday_August_Forensic_August.csv
            rm -f BTC_Temporal_Tuesday_August_Failure_Forensics_ERROR.log
            git add BTC_Temporal_Tuesday_August_Failure_Forensics.md BTC_Temporal_Tuesday_August_Failure_Forensics_Summary.json BTC_Temporal_Tuesday_August_Forensic_Historical.csv BTC_Temporal_Tuesday_August_Forensic_August.csv TUEAUGF_EXIT_CODE.txt
            git add -u BTC_Temporal_Tuesday_August_Failure_Forensics_ERROR.log 2>/dev/null || true
            msg="research: persist Tuesday August failure forensics"
          else
            cp TUEAUGF_RUN.log BTC_Temporal_Tuesday_August_Failure_Forensics_ERROR.log
            git add BTC_Temporal_Tuesday_August_Failure_Forensics_ERROR.log TUEAUGF_EXIT_CODE.txt
            msg="ci: persist Tuesday August forensic traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tueaugf-output
          path: |
            TUEAUGF_RUN.log
            TUEAUGF_EXIT_CODE.txt
            research/tueaugf_out/TUESDAY_AUGUST_FAILURE_FORENSICS.md
            research/tueaugf_out/tuesday_august_failure_forensics_summary.json
            research/tueaugf_out/tuesday_august_forensic_historical.csv
            research/tueaugf_out/tuesday_august_forensic_august.csv
