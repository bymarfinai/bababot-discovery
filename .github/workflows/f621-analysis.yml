name: Frozen Tuesday A5.11 August Replay
on:
  push:
    paths:
      - 'research/tuesday_a511_true_oos_august.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run frozen Tuesday A5.11 August replay and persist
        shell: bash
        run: |
          set +e
          cd research
          TUEA511_OUT=tuea511_out python tuesday_a511_true_oos_august.py > ../TUEA511_RUN.log 2>&1
          rc=$?
          cd ..
          cat TUEA511_RUN.log
          printf '%s\n' "$rc" > TUEA511_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/tuea511_out/TUESDAY_A511_TRUE_OOS_AUGUST.md BTC_Temporal_Tuesday_A511_True_OOS_August.md
            cp research/tuea511_out/tuesday_a511_true_oos_august_summary.json BTC_Temporal_Tuesday_A511_True_OOS_August_Summary.json
            cp research/tuea511_out/tuesday_a511_true_oos_august_rows.csv BTC_Temporal_Tuesday_A511_True_OOS_August_Rows.csv
            rm -f BTC_Temporal_Tuesday_A511_True_OOS_August_ERROR.log
            rm -f BTC_Temporal_Tuesday_A511_Parity_Failure.json
            git add BTC_Temporal_Tuesday_A511_True_OOS_August.md BTC_Temporal_Tuesday_A511_True_OOS_August_Summary.json BTC_Temporal_Tuesday_A511_True_OOS_August_Rows.csv TUEA511_EXIT_CODE.txt
            git add -u BTC_Temporal_Tuesday_A511_True_OOS_August_ERROR.log BTC_Temporal_Tuesday_A511_Parity_Failure.json 2>/dev/null || true
            msg="research: persist frozen Tuesday A5.11 August replay"
          else
            cp TUEA511_RUN.log BTC_Temporal_Tuesday_A511_True_OOS_August_ERROR.log
            if [ -f research/tuea511_out/tuesday_a511_parity_failure.json ]; then
              cp research/tuea511_out/tuesday_a511_parity_failure.json BTC_Temporal_Tuesday_A511_Parity_Failure.json
              git add BTC_Temporal_Tuesday_A511_Parity_Failure.json
            fi
            git add BTC_Temporal_Tuesday_A511_True_OOS_August_ERROR.log TUEA511_EXIT_CODE.txt
            msg="ci: persist Tuesday A5.11 August replay traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuea511-output
          path: |
            TUEA511_RUN.log
            TUEA511_EXIT_CODE.txt
            research/tuea511_out/TUESDAY_A511_TRUE_OOS_AUGUST.md
            research/tuea511_out/tuesday_a511_true_oos_august_summary.json
            research/tuea511_out/tuesday_a511_true_oos_august_rows.csv
            research/tuea511_out/tuesday_a511_parity_failure.json
