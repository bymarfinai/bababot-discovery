name: SUN1.9 Sunday16 Dynamic Direction Engine
on:
  push:
    paths:
      - 'research/sun19_sunday16_dynamic_direction_engine.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN1.9 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN19_OUT=sun19_out python sun19_sunday16_dynamic_direction_engine.py > ../SUN19_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN19_RUN.log
          printf '%s\n' "$rc" > SUN19_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun19_out/SUN1.9_CHECKPOINT.md BTC_Temporal_Sunday16_SUN19_Dynamic_Direction_Checkpoint.md
            cp research/sun19_out/sun19_summary.json BTC_Temporal_Sunday16_SUN19_Dynamic_Direction_Summary.json
            cp research/sun19_out/sun19_trades.csv BTC_Temporal_Sunday16_SUN19_Dynamic_Direction_Trades.csv
            rm -f BTC_Temporal_Sunday16_SUN19_ERROR.log
            git add BTC_Temporal_Sunday16_SUN19_Dynamic_Direction_Checkpoint.md BTC_Temporal_Sunday16_SUN19_Dynamic_Direction_Summary.json BTC_Temporal_Sunday16_SUN19_Dynamic_Direction_Trades.csv SUN19_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday16_SUN19_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN1.9 dynamic direction engine"
          else
            cp SUN19_RUN.log BTC_Temporal_Sunday16_SUN19_ERROR.log
            git add BTC_Temporal_Sunday16_SUN19_ERROR.log SUN19_EXIT_CODE.txt
            msg="ci: persist Sunday SUN1.9 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun19-output
          path: |
            SUN19_RUN.log
            SUN19_EXIT_CODE.txt
            research/sun19_out/SUN1.9_CHECKPOINT.md
            research/sun19_out/sun19_summary.json
            research/sun19_out/sun19_trades.csv
