name: SUN2.2 Sunday16 Frozen True-OOS
on:
  push:
    paths:
      - 'research/sun22_sunday16_frozen_router_true_oos.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN2.2 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN22_OUT=sun22_out python sun22_sunday16_frozen_router_true_oos.py > ../SUN22_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN22_RUN.log
          printf '%s\n' "$rc" > SUN22_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun22_out/SUN2.2_CHECKPOINT.md BTC_Temporal_Sunday16_SUN22_True_OOS_Checkpoint.md
            cp research/sun22_out/sun22_summary.json BTC_Temporal_Sunday16_SUN22_True_OOS_Summary.json
            cp research/sun22_out/sun22_true_oos_trades.csv BTC_Temporal_Sunday16_SUN22_True_OOS_Trades.csv
            rm -f BTC_Temporal_Sunday16_SUN22_ERROR.log
            git add BTC_Temporal_Sunday16_SUN22_True_OOS_Checkpoint.md BTC_Temporal_Sunday16_SUN22_True_OOS_Summary.json BTC_Temporal_Sunday16_SUN22_True_OOS_Trades.csv SUN22_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday16_SUN22_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN2.2 frozen true-OOS extension"
          else
            cp SUN22_RUN.log BTC_Temporal_Sunday16_SUN22_ERROR.log
            git add BTC_Temporal_Sunday16_SUN22_ERROR.log SUN22_EXIT_CODE.txt
            msg="ci: persist Sunday SUN2.2 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun22-output
          path: |
            SUN22_RUN.log
            SUN22_EXIT_CODE.txt
            research/sun22_out/SUN2.2_CHECKPOINT.md
            research/sun22_out/sun22_summary.json
            research/sun22_out/sun22_true_oos_trades.csv
