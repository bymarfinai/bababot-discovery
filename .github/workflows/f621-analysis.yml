name: F6.24 Friday Context Repair Failure Management
on:
  push:
    paths:
      - 'research/f624_friday_context_repair_failure_management.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.24 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F624_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F624_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.24 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.24 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          F624_OUT=f624_out python f624_friday_context_repair_failure_management.py > ../F624_RUN.log 2>&1
          rc=$?
          cd ..
          cat F624_RUN.log
          printf '%s\n' "$rc" > F624_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/f624_out/F6.24_CHECKPOINT.md BTC_Temporal_Friday_F624_Context_Repair_Failure65_Management_Checkpoint.md
            cp research/f624_out/f624_summary.json BTC_Temporal_Friday_F624_Context_Repair_Failure65_Management_Summary.json
            rm -f BTC_Temporal_Friday_F624_ERROR.log
            git add BTC_Temporal_Friday_F624_Context_Repair_Failure65_Management_Checkpoint.md BTC_Temporal_Friday_F624_Context_Repair_Failure65_Management_Summary.json F624_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F624_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Friday F6.24 context repair result"
          else
            cp F624_RUN.log BTC_Temporal_Friday_F624_ERROR.log
            git add BTC_Temporal_Friday_F624_ERROR.log F624_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Friday F6.24 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f624-output
          path: |
            F624_RUN.log
            F624_EXIT_CODE.txt
            research/f624_out/F6.24_CHECKPOINT.md
            research/f624_out/f624_summary.json
            research/f624_out/f624_rows.csv
