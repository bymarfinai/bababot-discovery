name: F6.31 Friday Flow-Reversal Recovery Guard
on:
  push:
    paths:
      - 'research/f631_friday_flow_reversal_recovery_guard.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.31 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F631_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F631_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.31 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.31 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          F631_OUT=f631_out python f631_friday_flow_reversal_recovery_guard.py > ../F631_RUN.log 2>&1
          rc=$?
          cd ..
          cat F631_RUN.log
          printf '%s\n' "$rc" > F631_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/f631_out/F6.31_CHECKPOINT.md BTC_Temporal_Friday_F631_Flow_Reversal_Recovery_Guard_Checkpoint.md
            cp research/f631_out/f631_summary.json BTC_Temporal_Friday_F631_Flow_Reversal_Recovery_Guard_Summary.json
            rm -f BTC_Temporal_Friday_F631_ERROR.log
            git add BTC_Temporal_Friday_F631_Flow_Reversal_Recovery_Guard_Checkpoint.md BTC_Temporal_Friday_F631_Flow_Reversal_Recovery_Guard_Summary.json F631_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F631_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Friday F6.31 flow-reversal guard result"
          else
            cp F631_RUN.log BTC_Temporal_Friday_F631_ERROR.log
            git add BTC_Temporal_Friday_F631_ERROR.log F631_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Friday F6.31 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f631-output
          path: |
            F631_RUN.log
            F631_EXIT_CODE.txt
            research/f631_out/F6.31_CHECKPOINT.md
            research/f631_out/f631_summary.json
            research/f631_out/f631_rows.csv
