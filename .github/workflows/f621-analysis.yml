name: SUN2.0 Sunday16 WAIT Refinement
on:
  push:
    paths:
      - 'research/sun20_sunday16_wait_refinement_agreement.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run SUN2.0 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUN20_OUT=sun20_out python sun20_sunday16_wait_refinement_agreement.py > ../SUN20_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUN20_RUN.log
          printf '%s\n' "$rc" > SUN20_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sun20_out/SUN2.0_CHECKPOINT.md BTC_Temporal_Sunday16_SUN20_Wait_Refinement_Checkpoint.md
            cp research/sun20_out/sun20_summary.json BTC_Temporal_Sunday16_SUN20_Wait_Refinement_Summary.json
            cp research/sun20_out/sun20_trades.csv BTC_Temporal_Sunday16_SUN20_Wait_Refinement_Trades.csv
            rm -f BTC_Temporal_Sunday16_SUN20_ERROR.log
            git add BTC_Temporal_Sunday16_SUN20_Wait_Refinement_Checkpoint.md BTC_Temporal_Sunday16_SUN20_Wait_Refinement_Summary.json BTC_Temporal_Sunday16_SUN20_Wait_Refinement_Trades.csv SUN20_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday16_SUN20_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SUN2.0 WAIT refinement"
          else
            cp SUN20_RUN.log BTC_Temporal_Sunday16_SUN20_ERROR.log
            git add BTC_Temporal_Sunday16_SUN20_ERROR.log SUN20_EXIT_CODE.txt
            msg="ci: persist Sunday SUN2.0 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun20-output
          path: |
            SUN20_RUN.log
            SUN20_EXIT_CODE.txt
            research/sun20_out/SUN2.0_CHECKPOINT.md
            research/sun20_out/sun20_summary.json
            research/sun20_out/sun20_trades.csv
