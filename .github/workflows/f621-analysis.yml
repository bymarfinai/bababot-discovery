name: F6.32 Friday Conditional Recovery Window
on:
  push:
    paths:
      - 'research/f632_friday_conditional_recovery_window.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'F6.32 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Friday_F632_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Friday_F632_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Friday F6.32 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run F6.32 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          F632_OUT=f632_out python f632_friday_conditional_recovery_window.py > ../F632_RUN.log 2>&1
          rc=$?
          cd ..
          cat F632_RUN.log
          printf '%s\n' "$rc" > F632_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/f632_out/F6.32_CHECKPOINT.md BTC_Temporal_Friday_F632_Conditional_Recovery_Window_Checkpoint.md
            cp research/f632_out/f632_summary.json BTC_Temporal_Friday_F632_Conditional_Recovery_Window_Summary.json
            rm -f BTC_Temporal_Friday_F632_ERROR.log
            git add BTC_Temporal_Friday_F632_Conditional_Recovery_Window_Checkpoint.md BTC_Temporal_Friday_F632_Conditional_Recovery_Window_Summary.json F632_EXIT_CODE.txt
            git add -u BTC_Temporal_Friday_F632_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Friday F6.32 conditional recovery window result"
          else
            cp F632_RUN.log BTC_Temporal_Friday_F632_ERROR.log
            git add BTC_Temporal_Friday_F632_ERROR.log F632_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Friday F6.32 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f632-output
          path: |
            F632_RUN.log
            F632_EXIT_CODE.txt
            research/f632_out/F6.32_CHECKPOINT.md
            research/f632_out/f632_summary.json
            research/f632_out/f632_rows.csv
