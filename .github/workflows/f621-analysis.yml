name: Sunday SF14 August Morphology Replay
on:
  push:
    paths:
      - 'research/sunday_fridaymethod_sf14_august_morphology_replay.py'
      - '.github/workflows/f621-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run Sunday SF14 and persist once
        shell: bash
        run: |
          set +e
          cd research
          SUNFM14_OUT=sunfm14_out python sunday_fridaymethod_sf14_august_morphology_replay.py > ../SUNFM14_RUN.log 2>&1
          rc=$?
          cd ..
          cat SUNFM14_RUN.log
          printf '%s\n' "$rc" > SUNFM14_EXIT_CODE.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$rc" -eq 0 ]; then
            cp research/sunfm14_out/SUNDAY_FRIDAY_METHOD_SF14_AUGUST_REPLAY.md BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay.md
            cp research/sunfm14_out/sunfm14_summary.json BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_Summary.json
            cp research/sunfm14_out/sunfm14_rows.csv BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_Rows.csv
            rm -f BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay.md BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_Summary.json BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_Rows.csv SUNFM14_EXIT_CODE.txt
            git add -u BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_ERROR.log 2>/dev/null || true
            msg="research: persist Sunday SF14 August morphology replay"
          else
            cp SUNFM14_RUN.log BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_ERROR.log
            git add BTC_Temporal_Sunday_FridayMethod_SF14_August_Replay_ERROR.log SUNFM14_EXIT_CODE.txt
            msg="ci: persist Sunday SF14 traceback"
          fi

          git diff --cached --quiet || git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunfm14-output
          path: |
            SUNFM14_RUN.log
            SUNFM14_EXIT_CODE.txt
            research/sunfm14_out/SUNDAY_FRIDAY_METHOD_SF14_AUGUST_REPLAY.md
            research/sunfm14_out/sunfm14_summary.json
            research/sunfm14_out/sunfm14_rows.csv
