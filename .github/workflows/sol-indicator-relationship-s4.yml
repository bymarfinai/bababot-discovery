name: SOL Indicator Relationship Stage 4

on:
  push:
    branches:
      - research/sol-indicator-relationship-s4
    paths:
      - "research/sol_indicator_relationship_s4.py"
      - "SOL_INDICATOR_RELATIONSHIP_S4_Preregistration.md"
      - ".github/workflows/sol-indicator-relationship-s4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-stage4:
    if: \${{ !contains(github.event.head_commit.message, '[stage4-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-indicator-relationship-s4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run Stage 4
        run: python research/sol_indicator_relationship_s4.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_INDICATOR_RELATIONSHIP_S4_Result.md \
                  SOL_INDICATOR_RELATIONSHIP_S4_Result.json \
                  SOL_INDICATOR_RELATIONSHIP_S4A_CELLS.csv \
                  SOL_INDICATOR_RELATIONSHIP_S4B_CONTRASTS.csv \
                  SOL_INDICATOR_RELATIONSHIP_S4_Status.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Persist SOL Stage 4 results [stage4-result]"
            git push origin HEAD:research/sol-indicator-relationship-s4
          fi
