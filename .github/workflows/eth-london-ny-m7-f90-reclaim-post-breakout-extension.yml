name: ETH London NY M7 Post-Breakout Extension

on:
  push:
    paths:
      - 'ETH_LONDON_NY_M7_F90_RECLAIM_POST_BREAKOUT_EXTENSION_Preregistration.md'
      - 'research/eth_london_ny_m7_f90_reclaim_post_breakout_extension.py'
      - '.github/workflows/eth-london-ny-m7-f90-reclaim-post-breakout-extension.yml'
  workflow_dispatch:

jobs:
  m7:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH London-NY M7
        run: python research/eth_london_ny_m7_f90_reclaim_post_breakout_extension.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add ETH_LONDON_NY_M7_F90_RECLAIM_POST_BREAKOUT_EXTENSION_Result.md ETH_LONDON_NY_M7_F90_RECLAIM_POST_BREAKOUT_EXTENSION_Trades.csv ETH_LONDON_NY_M7_F90_RECLAIM_POST_BREAKOUT_EXTENSION_Summary.csv ETH_LONDON_NY_M7_F90_RECLAIM_POST_BREAKOUT_EXTENSION_Status.txt
          git commit -m "research: persist ETH London-NY M7 post-breakout extension" || true
          git push
