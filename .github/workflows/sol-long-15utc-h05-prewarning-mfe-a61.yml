name: SOL Long 15UTC H05 Prewarning MFE A61

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - '.github/workflows/sol-long-15utc-h05-prewarning-mfe-a61.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a61:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A61 H05 prewarning MFE revalidation
        run: |
          set +e
          python research/sol_long_15utc_h05_prewarning_mfe_a61.py > SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_Run.log 2>&1
          code=$?
          echo "exit_code=$code" >> SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_Run.log
          cat SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_Run.log
          exit 0

      - name: Persist A61 outputs and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_Run.log
          for f in \
            SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_EVENTS.csv \
            SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_METRICS.csv \
            SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_BLOCKS.csv \
            SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_Result.md \
            SOL_LONG_15UTC_H05_PREWARNING_MFE_A61_Status.txt; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist A61 H05 prewarning MFE diagnostics"
            git push origin HEAD:research/sol-long-structure-a1-run
          fi
