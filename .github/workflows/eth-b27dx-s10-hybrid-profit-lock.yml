name: ETH B27DX S10 Hybrid Profit Lock

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S10_HYBRID_PROFIT_LOCK_Preregistration.md'
      - 'research/eth_b27dx_s10_hybrid_profit_lock.py'
      - '.github/workflows/eth-b27dx-s10-hybrid-profit-lock.yml'

permissions:
  contents: write

jobs:
  s10:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S10 hybrid profit lock
        run: python research/eth_b27dx_s10_hybrid_profit_lock.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S10_HYBRID_PROFIT_LOCK_*.md ETH_B27DX_S10_HYBRID_PROFIT_LOCK_*.csv ETH_B27DX_S10_HYBRID_PROFIT_LOCK_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "research: persist ETH B27DX S10 hybrid profit lock results"
          ok=0
          for i in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin main; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
