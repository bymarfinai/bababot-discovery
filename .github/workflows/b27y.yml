name: B27Y
on:
  push:
    paths:
      - '.github/workflows/b27y.yml'
      - 'research/btc_london_ny_f85_post_h2_extension_b27y.py'
      - 'BTC_LONDON_NY_F85_CLOSE_INVALIDATION_B27Y_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_LONDON_NY_F85_POST_H2_EXTENSION_B27Y_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_F85_POST_H2_EXTENSION_B27Y_Status.txt
          git commit -m 'ci: mark B27Y runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_f85_post_h2_extension_b27y.py
      - run: cd research && python btc_london_ny_f85_post_h2_extension_b27y.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_LONDON_NY_F85_POST_H2_EXTENSION_B27Y_Result.md BTC_LONDON_NY_F85_POST_H2_EXTENSION_B27Y_Paths.csv BTC_LONDON_NY_F85_POST_H2_EXTENSION_B27Y_Summary.csv BTC_LONDON_NY_F85_POST_H2_EXTENSION_B27Y_ExtensionAtlas.csv
          git commit -m 'research: persist B27Y F85 post-H2 extension result' || true
          git push
