name: S5.5 Saturday EMA Failure Context

on:
  push:
    paths:
      - '.github/workflows/s55-once.yml'
      - 'research/s55_saturday_ema_failure_context.py'
  workflow_dispatch:

jobs:
  s55:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas requests
      - name: Run S5.5
        run: python research/s55_saturday_ema_failure_context.py
      - name: Upload S5.5 outputs
        uses: actions/upload-artifact@v4
        with:
          name: s55-output
          path: s55_out/
