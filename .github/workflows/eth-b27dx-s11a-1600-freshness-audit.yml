name: ETH B27DX S11A 1600 Freshness Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S11A_1600_FRESHNESS_AUDIT_Preregistration.md'
      - 'research/eth_b27dx_s11a_1600_freshness_audit.py'
      - '.github/workflows/eth-b27dx-s11a-1600-freshness-audit.yml'

permissions:
  contents: write

jobs:
  s11a:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_b27dx_s11a_1600_freshness_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S11A_1600_FRESHNESS_AUDIT_*.md ETH_B27DX_S11A_1600_FRESHNESS_AUDIT_*.csv ETH_B27DX_S11A_1600_FRESHNESS_AUDIT_*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist ETH B27DX S11A 16:00 freshness audit results"
          git pull --rebase origin main
          git push origin main
