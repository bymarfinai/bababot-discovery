name: SOL Adaptive Structure Detector v2

on:
  push:
    branches:
      - sol-adaptive-structure-detector-v2
  workflow_dispatch:

jobs:
  sequence-analog-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scikit-learn scipy
      - name: Run frozen v2 sequence analog detector
        run: python research/sol_adaptive_structure_detector_v2.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-adaptive-structure-detector-v2
          path: |
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_Events.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_Predictions.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_YearSummary.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_EdgeQuartiles.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_GateAudit.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_Result.md
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_Status.txt
            research/SOL_ADAPTIVE_STRUCTURE_DETECTOR_V2_PREREG.md
