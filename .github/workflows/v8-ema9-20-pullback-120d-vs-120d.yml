name: V8 A EMA9 20 Pullback 120d vs 120d

on:
  push:
    branches: [v7-regime-failed-breakout]
    paths:
      - 'research/v8_a_ema9_20_pullback_120d_vs_120d.py'
      - '.github/workflows/v8-ema9-20-pullback-120d-vs-120d.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen EMA9/20 baseline
        run: PYTHONPATH=. python research/v8_a_ema9_20_pullback_120d_vs_120d.py
