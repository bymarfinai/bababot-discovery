name: ETH R4b Stage G 2026 failure decomposition

on:
  push:
    branches:
      - eth-r4-cohort-plateau-screen
    paths:
      - '.r4b-stageG-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageG:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen H04 2026 failure decomposition
        run: python research/eth_r4b_stageG_2026_failure_decomposition.py
      - name: Persist Stage G outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R4B_STAGE_G_2026_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH R4b stageG 2026 failure decomposition"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r4b-stageG-2026-failure-decomposition
          path: 'ETH_R4B_STAGE_G_2026_*'
          if-no-files-found: error
