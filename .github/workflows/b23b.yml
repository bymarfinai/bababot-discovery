name: B23B
on:
  push:
    paths:
      - '.github/workflows/b23b.yml'
      - 'research/btc_strong_trend_transition_atlas_b23b.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_STRONG_TREND_TRANSITION_ATLAS_B23B_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_STRONG_TREND_TRANSITION_ATLAS_B23B_Status.txt
          git commit -m 'ci: mark B23B runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_strong_trend_transition_atlas_b23b.py
      - run: cd research && python btc_strong_trend_transition_atlas_b23b.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_STRONG_TREND_TRANSITION_ATLAS_B23B_Result.md BTC_STRONG_TREND_TRANSITION_ATLAS_B23B_Summary.csv BTC_STRONG_TREND_TRANSITION_ATLAS_B23B_Episodes.csv
          git commit -m 'research: persist B23B result' || true
          git push
# trigger-1
