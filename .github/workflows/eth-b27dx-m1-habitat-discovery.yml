name: ETH B27DX M1 Habitat Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/eth_b27dx_m1_habitat_discovery.py'
      - 'ETH_B27DX_M1_HABITAT_DISCOVERY_Preregistration.md'
      - '.github/workflows/eth-b27dx-m1-habitat-discovery.yml'
permissions:
  contents: write
jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests
      - name: Run M1 habitat discovery
        run: python research/eth_b27dx_m1_habitat_discovery.py > ETH_B27DX_M1_HABITAT_DISCOVERY_Run.log 2>&1
      - name: Persist results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_M1_HABITAT_DISCOVERY_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist ETH B27DX M1 habitat discovery"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
