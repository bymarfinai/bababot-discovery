name: BNB B41-S4B MTF direction timing anatomy

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b41-s4b-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b41-s4b:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2
      - name: Run B41-S4B
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b41_s4b_mtf_direction_timing_anatomy.py
          python research/bnb_b41_s4b_mtf_direction_timing_anatomy.py | tee BNB_B41_S4B_MTF_DIRECTION_TIMING_ANATOMY_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b41-s4b-mtf-direction-timing-anatomy
          path: |
            BNB_B41_S4B_MTF_DIRECTION_TIMING_ANATOMY*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b41_s4b
          for f in BNB_B41_S4B_MTF_DIRECTION_TIMING_ANATOMY*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b41_s4b/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b41_s4b
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B41-S4B MTF direction timing anatomy'
            git pull --rebase origin bnb-b29-walkforward-reset
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
