name: ETH R3 H04 stageC one-shot 2024 confirmation

on:
  push:
    branches:
      - eth-r3-h04-stability-retest
    paths:
      - '.r3-h04-stageC-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageC:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H04 Stage C
        run: python research/eth_r3_h04_stageC_2024_confirmation.py
      - name: Persist Stage C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H04_STAGEC_2024_Events.csv ETH_R3_H04_STAGEC_2024_Summary.csv ETH_R3_H04_STAGEC_Result.md ETH_R3_H04_STAGEC_Status.txt
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH R3 H04 one-shot 2024 confirmation"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h04-stageC-one-shot-2024-confirmation
          path: |
            ETH_R3_H04_STAGEC_2024_Events.csv
            ETH_R3_H04_STAGEC_2024_Summary.csv
            ETH_R3_H04_STAGEC_Result.md
            ETH_R3_H04_STAGEC_Status.txt
