name: B27Q
on:
  push:
    paths:
      - '.github/workflows/b27q.yml'
      - 'research/btc_session_liquidity_pressure_entry_b27q.py'
      - 'BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Status.txt
          git commit -m 'ci: mark B27Q runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_session_liquidity_pressure_entry_b27q.py
      - run: cd research && python btc_session_liquidity_pressure_entry_b27q.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Result.md \
                  BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Visits.csv \
                  BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Signals.csv \
                  BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_Trades.csv \
                  BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_StructuralSummary.csv \
                  BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_EntrySummary.csv \
                  BTC_SESSION_LIQUIDITY_PRESSURE_ENTRY_B27Q_StatusCounts.csv
          git commit -m 'research: persist B27Q session liquidity pressure entry result' || true
          git push
