name: BNB B29 B2S prospective event-close shadow

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b29-b2s-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prospective-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2
      - name: Run frozen B29 B2S prospective shadow
        run: |
          set -euo pipefail
          LOG=BNB_B29_B2S_PROSPECTIVE_SHADOW_Run.log
          echo 'BNB B29 B2S prospective event-close shadow' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'protocol=research/BNB_B29_B2S_PROSPECTIVE_SHADOW_PREREGISTRATION.md' >> "$LOG"
          echo 'scientific_identity=B29-B2S-v1 frozen' >> "$LOG"
          echo 'tooling_feed=Binance Vision USD-M Futures daily 5m (REST endpoint blocked by runner HTTP 451)' >> "$LOG"
          python -m py_compile research/bnb_b29_b2s_prospective_shadow.py research/bnb_b29_b2s_prospective_shadow_vision_runner.py 2>&1 | tee -a "$LOG"
          python research/bnb_b29_b2s_prospective_shadow_vision_runner.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b29-b2s-prospective-shadow
          path: BNB_B29_B2S_PROSPECTIVE_SHADOW*
          if-no-files-found: warn
      - name: Persist prospective ledger and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b29_b2s
          for f in \
            BNB_B29_B2S_PROSPECTIVE_SHADOW_Result.md \
            BNB_B29_B2S_PROSPECTIVE_SHADOW_Ledger.csv \
            BNB_B29_B2S_PROSPECTIVE_SHADOW_Status.txt \
            BNB_B29_B2S_PROSPECTIVE_SHADOW_Checkpoint.json \
            BNB_B29_B2S_PROSPECTIVE_SHADOW_Run.log; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b29_b2s/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b29_b2s
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Update frozen B29 B2S prospective shadow ledger'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
