name: ETH R3 H03 stageB 2023 practical stability test

on:
  push:
    branches:
      - eth-r3-h03-stability-retest
    paths:
      - '.r3-h03-stageB-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageB:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H03 Stage B
        run: python research/eth_r3_h03_stageB_2023_test.py
      - name: Persist Stage B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H03_STAGEB_2023_LocalNeighborhood.csv ETH_R3_H03_STAGEB_Result.md ETH_R3_H03_STAGEB_Status.txt
          if [ -f ETH_R3_H03_STAGEB_FrozenStableCandidate.csv ]; then git add ETH_R3_H03_STAGEB_FrozenStableCandidate.csv; fi
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH R3 H03 stageB 2023 stability test"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h03-stageB-2023-practical-stability-test
          path: |
            ETH_R3_H03_STAGEB_2023_LocalNeighborhood.csv
            ETH_R3_H03_STAGEB_FrozenStableCandidate.csv
            ETH_R3_H03_STAGEB_Result.md
            ETH_R3_H03_STAGEB_Status.txt
          if-no-files-found: warn
