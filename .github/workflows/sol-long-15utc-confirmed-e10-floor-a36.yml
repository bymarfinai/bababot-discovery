name: SOL Long 15UTC Confirmed E10 Floor A36
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [research/sol-long-structure-a1-run]
    paths:
      - 'research/sol_long_15utc_confirmed_e10_floor_a36.py'
      - 'SOL_LONG_15UTC_CONFIRMED_E10_FLOOR_A36_Preregistration.md'
      - '.github/workflows/sol-long-15utc-confirmed-e10-floor-a36.yml'
jobs:
  a36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests
      - name: Run A36 confirmed E10 floor
        run: python research/sol_long_15utc_confirmed_e10_floor_a36.py
      - name: Persist A36 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_CONFIRMED_E10_FLOOR_A36_*.md SOL_LONG_15UTC_CONFIRMED_E10_FLOOR_A36_*.csv SOL_LONG_15UTC_CONFIRMED_E10_FLOOR_A36_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A36 confirmed E10 recovery floor'
          git push origin HEAD:research/sol-long-structure-a1-run
