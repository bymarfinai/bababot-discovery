name: BNB B29 A1 structure fingerprint

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b29-a1-trigger'

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered B29 A1 causal structure fingerprint
        run: |
          set -euo pipefail
          LOG=BNB_B29_A1_STRUCTURE_FINGERPRINT_Run.log
          echo 'BNB B29 A1 causal structure fingerprint' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'protocol=BNB_B29_A1_STRUCTURE_FINGERPRINT.md' >> "$LOG"
          python -m py_compile research/bnb_b29_a1_structure_fingerprint.py 2>&1 | tee -a "$LOG"
          python research/bnb_b29_a1_structure_fingerprint.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b29-a1-structure-fingerprint
          path: BNB_B29_A1_STRUCTURE_FINGERPRINT*
          if-no-files-found: warn
      - name: Persist compact A1 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b29_a1
          for f in \
            BNB_B29_A1_STRUCTURE_FINGERPRINT_Sanity.md \
            BNB_B29_A1_STRUCTURE_FINGERPRINT_StateCoverage.csv \
            BNB_B29_A1_STRUCTURE_FINGERPRINT_Schema.csv \
            BNB_B29_A1_STRUCTURE_FINGERPRINT_Status.txt \
            BNB_B29_A1_STRUCTURE_FINGERPRINT_Run.log; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b29_a1/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b29_a1
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B29 A1 fingerprint evidence'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
