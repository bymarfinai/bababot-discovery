name: V7 N BNB Event Geometry Forensic

on:
  push:
    paths:
      - 'research/v7_n_bnb_supply_event_geometry_forensic.py'
      - '.github/workflows/v7-bnb-event-geometry-forensic.yml'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26.0' 'fastapi>=0.110'
      - name: Run frozen BNB event-geometry forensic
        run: PYTHONPATH=. python research/v7_n_bnb_supply_event_geometry_forensic.py
