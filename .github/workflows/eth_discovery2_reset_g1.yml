name: ETH Discovery 2 Reset G1 pair-native geometry

on:
  push:
    branches: [eth-discovery2-reset-g1-geometry]
    paths:
      - 'ETH_DISCOVERY2_RESET_G1_GEOMETRY_Preregistration.md'
      - 'research/eth_discovery2_reset_g1_geometry.py'
      - '.github/workflows/eth_discovery2_reset_g1.yml'
      - '.eth-discovery2-reset-g1-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Reset G1
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_RESET_G1_GEOMETRY_Run.log
          echo 'ETH Discovery 2 Reset G1 pair-native geometry' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_reset_g1_geometry.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_reset_g1_geometry.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-reset-g1-geometry
          path: |
            ETH_DISCOVERY2_RESET_G1_GEOMETRY_*
