name: S6.4 Saturday Friday-F6.24 Transfer
on:
  push:
    paths:
      - 'research/s64_saturday_friday_f624_transfer.py'
      - '.github/workflows/s64-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'S6.4 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Saturday_S64_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Saturday_S64_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Saturday S6.4 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run S6.4 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          S64_OUT=s64_out python s64_saturday_friday_f624_transfer.py > ../S64_RUN.log 2>&1
          rc=$?
          cd ..
          cat S64_RUN.log
          printf '%s\n' "$rc" > S64_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/s64_out/S6.4_CHECKPOINT.md BTC_Temporal_Saturday_S64_Friday_F624_Transfer_Checkpoint.md
            cp research/s64_out/s64_summary.json BTC_Temporal_Saturday_S64_Friday_F624_Transfer_Summary.json
            rm -f BTC_Temporal_Saturday_S64_ERROR.log
            git add BTC_Temporal_Saturday_S64_Friday_F624_Transfer_Checkpoint.md BTC_Temporal_Saturday_S64_Friday_F624_Transfer_Summary.json S64_EXIT_CODE.txt
            git add -u BTC_Temporal_Saturday_S64_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Saturday S6.4 Friday F6.24 transfer"
          else
            cp S64_RUN.log BTC_Temporal_Saturday_S64_ERROR.log
            git add BTC_Temporal_Saturday_S64_ERROR.log S64_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Saturday S6.4 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s64-output
          path: |
            S64_RUN.log
            S64_EXIT_CODE.txt
            research/s64_out/S6.4_CHECKPOINT.md
            research/s64_out/s64_summary.json
            research/s64_out/s64_rows.csv
