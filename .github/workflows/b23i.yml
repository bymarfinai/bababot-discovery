name: B23I
on:
  push:
    paths:
      - '.github/workflows/b23i.yml'
      - 'research/btc_bear_cross_only_exit_b23i.py'
      - 'BTC_BEAR_CROSS_ONLY_EXIT_B23I_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_BEAR_CROSS_ONLY_EXIT_B23I_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_BEAR_CROSS_ONLY_EXIT_B23I_Status.txt
          git commit -m 'ci: mark B23I runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_bear_cross_only_exit_b23i.py
      - run: cd research && python btc_bear_cross_only_exit_b23i.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_BEAR_CROSS_ONLY_EXIT_B23I_Result.md BTC_BEAR_CROSS_ONLY_EXIT_B23I_Summary.csv BTC_BEAR_CROSS_ONLY_EXIT_B23I_Trades.csv BTC_BEAR_CROSS_ONLY_EXIT_B23I_Cycles.csv
          git commit -m 'research: persist B23I bear-cross-only result' || true
          git push
# trigger
