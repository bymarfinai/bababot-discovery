name: ETH London F85 breakout entry M3D issue runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  run_m3d:
    if: github.event.issue.title == 'RUN_ETH_LONDON_F85_BREAKOUT_ENTRY_M3D'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH London F85 breakout entry M3D
        run: |
          python -m py_compile research/eth_london_f85_breakout_entry_m3d.py
          python research/eth_london_f85_breakout_entry_m3d.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-london-f85-breakout-entry-m3d
          path: |
            ETH_LONDON_F85_BREAKOUT_ENTRY_M3D_*
      - name: Persist M3D outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A ETH_LONDON_F85_BREAKOUT_ENTRY_M3D_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist ETH London F85 breakout entry M3D results'
            git push
          fi
