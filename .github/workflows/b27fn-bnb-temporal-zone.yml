name: B27FN BNB temporal-zone refinement

on:
  push:
    branches:
      - bnb-hour01-temporal-zone-b27fn
    paths:
      - 'BNB_HOUR01_TEMPORAL_ZONE_B27FN_Preregistration.md'
      - 'research/bnb_hour01_temporal_zone_b27fn.py'
      - '.github/workflows/b27fn-bnb-temporal-zone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FN temporal-zone refinement
        run: python research/bnb_hour01_temporal_zone_b27fn.py | tee BNB_HOUR01_TEMPORAL_ZONE_B27FN_Run.log
      - name: Persist B27FN outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_HOUR01_TEMPORAL_ZONE_B27FN_Detail.csv \
                  BNB_HOUR01_TEMPORAL_ZONE_B27FN_Summary.csv \
                  BNB_HOUR01_TEMPORAL_ZONE_B27FN_Result.md \
                  BNB_HOUR01_TEMPORAL_ZONE_B27FN_Status.txt \
                  BNB_HOUR01_TEMPORAL_ZONE_B27FN_Run.log
          git diff --cached --quiet || git commit -m "persist B27FN BNB temporal-zone refinement result"
          git push origin HEAD:bnb-hour01-temporal-zone-b27fn
