name: ETH B27DX S11B 1600 Stale Cancel Hybrid

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S11B_1600_STALE_CANCEL_HYBRID_Preregistration.md'
      - 'research/eth_b27dx_s11b_1600_stale_cancel_hybrid.py'
      - '.github/workflows/eth-b27dx-s11b-1600-stale-cancel-hybrid.yml'

permissions:
  contents: write

jobs:
  s11b:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_b27dx_s11b_1600_stale_cancel_hybrid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S11B_1600_STALE_CANCEL_HYBRID_*.md ETH_B27DX_S11B_1600_STALE_CANCEL_HYBRID_*.csv ETH_B27DX_S11B_1600_STALE_CANCEL_HYBRID_*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist ETH B27DX S11B 16:00 stale-cancel hybrid results"
          git pull --rebase origin main
          git push origin main
# trigger after initial workflow registration
