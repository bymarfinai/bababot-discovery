name: S5.7H Saturday Frozen True OOS Extension

on:
  push:
    paths:
      - '.github/workflows/s57h-once.yml'
  workflow_dispatch:

jobs:
  s57h:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run S5.7H
        env:
          S57H_OUT: s57h_out
        run: python research/s57h_true_oos_extension.py
      - name: Upload S5.7H outputs
        uses: actions/upload-artifact@v4
        with:
          name: s57h-output
          path: s57h_out/
