name: BTC H4 AMD FVG Path Map H4P1 Dedicated Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_h4_amd_fvg_pathmap_h4p1.py'
      - 'BTC_H4_AMD_FVG_PathMap_H4P1_Preregistration.md'
      - '.github/workflows/btc-h4-amd-fvg-pathmap-h4p1.yml'

permissions:
  contents: write

concurrency:
  group: btc-h4-amd-fvg-pathmap-h4p1-dedicated
  cancel-in-progress: true

jobs:
  h4p1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run frozen H4P1
        id: h4p1run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_h4_amd_fvg_pathmap_h4p1.py > BTC_H4_AMD_FVG_PathMap_H4P1_Run.log 2>&1
          code=$?
          echo "$code" > BTC_H4_AMD_FVG_PathMap_H4P1_EXIT_CODE.txt
          cat BTC_H4_AMD_FVG_PathMap_H4P1_Run.log
          exit $code
      - name: Persist H4P1 artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_H4_AMD_FVG_PathMap_H4P1_EXIT_CODE.txt BTC_H4_AMD_FVG_PathMap_H4P1_Run.log
          for f in BTC_H4_AMD_FVG_PathMap_H4P1_Result.md BTC_H4_AMD_FVG_PathMap_H4P1_Result.json BTC_H4_AMD_FVG_PathMap_H4P1_Events.csv BTC_H4_AMD_FVG_PathMap_H4P1_August.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m h4p1-dedicated-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_H4_AMD_FVG_PathMap_H4P1_EXIT_CODE.txt BTC_H4_AMD_FVG_PathMap_H4P1_Run.log
            for f in BTC_H4_AMD_FVG_PathMap_H4P1_Result.md BTC_H4_AMD_FVG_PathMap_H4P1_Result.json BTC_H4_AMD_FVG_PathMap_H4P1_Events.csv BTC_H4_AMD_FVG_PathMap_H4P1_August.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist BTC H4 AMD FVG path map H4P1"
            git push
          fi
      - name: Fail if H4P1 failed
        if: steps.h4p1run.outcome == 'failure'
        run: exit 1

# dedicated workflow retrigger; frozen H4P1 logic unchanged
