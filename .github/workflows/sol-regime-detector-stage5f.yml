name: SOL Regime Detector Stage 5F

on:
  push:
    branches:
      - research/sol-regime-detector-stage5f
    paths:
      - 'SOL_REGIME_DETECTOR_STAGE5F_Preregistration.md'
      - 'research/sol_regime_detector_stage5f.py'
      - '.github/workflows/sol-regime-detector-stage5f.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage5f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-regime-detector-stage5f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen Stage 5F failure forensics
        run: python research/sol_regime_detector_stage5f.py
      - name: Persist Stage 5F outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_REGIME_DETECTOR_STAGE5F_Result.md \
            SOL_REGIME_DETECTOR_STAGE5F_Events.csv \
            SOL_REGIME_DETECTOR_STAGE5F_Summary.csv \
            SOL_REGIME_DETECTOR_STAGE5F_Blocks.csv \
            SOL_REGIME_DETECTOR_STAGE5F_Chains.csv \
            SOL_REGIME_DETECTOR_STAGE5F_Audit.csv \
            SOL_REGIME_DETECTOR_STAGE5F_Status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist SOL regime Stage 5F forensics"
          git pull --rebase origin research/sol-regime-detector-stage5f
          git push origin HEAD:research/sol-regime-detector-stage5f
