name: S5.0 Saturday Parent Forensics

on:
  push:
    branches: [main]
    paths:
      - 'research/s50_saturday_parent_forensics.py'
      - '.github/workflows/s50-once.yml'
  workflow_dispatch:

jobs:
  s50:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run S5.0
        run: python research/s50_saturday_parent_forensics.py
      - name: Upload S5.0 outputs
        uses: actions/upload-artifact@v4
        with:
          name: s50-output
          path: s50_out/
