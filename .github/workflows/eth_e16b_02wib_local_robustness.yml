name: ETH E16B 02 WIB local robustness

on:
  push:
    branches: [eth-e16b-02wib-local-robustness]
    paths:
      - 'research/eth_e16b_02wib_local_robustness.py'
      - 'research/ETH_E16B_02WIB_LOCAL_ROBUSTNESS_PREREGISTRATION.md'
      - '.github/workflows/eth_e16b_02wib_local_robustness.yml'
      - '.e16b-trigger'

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run E16B local robustness diagnostic
        run: python research/eth_e16b_02wib_local_robustness.py
      - name: Persist E16B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_E16B_02WIB_LOCAL_ROBUSTNESS_*
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH E16B local robustness results"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-e16b-02wib-local-robustness
          path: ETH_E16B_02WIB_LOCAL_ROBUSTNESS_*
          if-no-files-found: error
