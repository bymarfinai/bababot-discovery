name: B27AO short F15 confirmation audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_london_ny_short_f15_early_reject_b27ao.py'
      - 'BTC_LONDON_NY_SHORT_F15_EARLY_REJECT_B27AO_Preregistration.md'
      - '.github/workflows/b27ao.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Compile
        run: python -m py_compile research/btc_london_ny_short_f15_early_reject_b27ao.py
      - name: Run B27AO
        run: cd research && python btc_london_ny_short_f15_early_reject_b27ao.py
      - name: Persist results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add BTC_LONDON_NY_SHORT_F15_EARLY_REJECT_B27AO_Result.md \
                  BTC_LONDON_NY_SHORT_F15_EARLY_REJECT_B27AO_Trades.csv \
                  BTC_LONDON_NY_SHORT_F15_EARLY_REJECT_B27AO_Summary.csv \
                  BTC_LONDON_NY_SHORT_F15_EARLY_REJECT_B27AO_Status.txt || true
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: persist B27AO short F15 confirmation audit'
            git push
          fi
