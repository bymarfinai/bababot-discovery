name: ETH M3 winner MAE PR runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.eth-m2-correction-pr-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m3_winner_mae:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH M3 winner MAE audit only
        shell: bash
        run: |
          python -m py_compile research/eth_f85_f15_transfer_m3_winner_mae.py
          python research/eth_f85_f15_transfer_m3_winner_mae.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-transfer-m3-winner-mae
          path: |
            ETH_F85_F15_TRANSFER_M3_WINNER_MAE_*
