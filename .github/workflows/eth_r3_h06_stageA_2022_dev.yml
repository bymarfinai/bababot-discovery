name: ETH R4 cohort plateau screen

on:
  push:
    branches:
      - eth-r4-cohort-plateau-screen
    paths:
      - '.r4-stageA-trigger'
      - '.r4-stageB-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageA:
    if: ${{ contains(github.event.head_commit.message, 'R4 stageA') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R4 Stage A 2022 cohort freeze
        run: python research/eth_r4_cohort_stageA_2022_freeze.py
      - name: Persist R4 Stage A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R4_STAGEA_2022_PLATEAU_CENTERS.csv ETH_R4_STAGEA_2022_FROZEN_COHORT.csv ETH_R4_STAGEA_2022_COHORT_FREEZE.md ETH_R4_STAGEA_2022_Status.txt
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "research: persist ETH R4 stageA 2022 cohort freeze"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r4-stageA-2022-cohort-freeze
          path: |
            ETH_R4_STAGEA_2022_PLATEAU_CENTERS.csv
            ETH_R4_STAGEA_2022_FROZEN_COHORT.csv
            ETH_R4_STAGEA_2022_COHORT_FREEZE.md
            ETH_R4_STAGEA_2022_Status.txt
          if-no-files-found: error

  stageB:
    if: ${{ contains(github.event.head_commit.message, 'R4 stageB') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R4 Stage B 2023 frozen cohort screen
        run: python research/eth_r4_cohort_stageB_2023_screen.py
      - name: Persist R4 Stage B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R4_STAGEB_2023_CANDIDATE_NEIGHBORHOODS.csv ETH_R4_STAGEB_2023_CANDIDATE_VERDICTS.csv ETH_R4_STAGEB_2023_SURVIVORS.csv ETH_R4_STAGEB_2023_COHORT_SCREEN.md ETH_R4_STAGEB_2023_Status.txt
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "research: persist ETH R4 stageB 2023 cohort screen"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r4-stageB-2023-cohort-screen
          path: |
            ETH_R4_STAGEB_2023_CANDIDATE_NEIGHBORHOODS.csv
            ETH_R4_STAGEB_2023_CANDIDATE_VERDICTS.csv
            ETH_R4_STAGEB_2023_SURVIVORS.csv
            ETH_R4_STAGEB_2023_COHORT_SCREEN.md
            ETH_R4_STAGEB_2023_Status.txt
          if-no-files-found: error
