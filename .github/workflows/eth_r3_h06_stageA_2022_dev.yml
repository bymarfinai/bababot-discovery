name: ETH R3 H07 practical stability launcher

on:
  push:
    branches:
      - eth-r3-h07-stability-retest
    paths:
      - 'research/eth_r3_h07_stageA_2022_dev.py'
      - 'research/eth_r3_h07_stageB_2023_test.py'
      - '.github/workflows/eth_r3_h06_stageA_2022_dev.yml'
      - '.r3-h07-stageA-trigger'
      - '.r3-h07-stageB-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageA:
    if: ${{ !contains(github.event.head_commit.message, 'H07 stageB') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H07 Stage A
        run: python research/eth_r3_h07_stageA_2022_dev.py
      - name: Persist Stage A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H07_STAGEA_2022_DevGrid.csv ETH_R3_H07_STAGEA_Result.md ETH_R3_H07_STAGEA_Status.txt
          if [ -f ETH_R3_H07_STAGEA_FrozenDevCandidate.csv ]; then git add ETH_R3_H07_STAGEA_FrozenDevCandidate.csv; fi
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "research: persist ETH R3 H07 stageA 2022 development freeze"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h07-stageA-2022-development-freeze
          path: |
            ETH_R3_H07_STAGEA_2022_DevGrid.csv
            ETH_R3_H07_STAGEA_FrozenDevCandidate.csv
            ETH_R3_H07_STAGEA_Result.md
            ETH_R3_H07_STAGEA_Status.txt
          if-no-files-found: warn

  stageB:
    if: ${{ contains(github.event.head_commit.message, 'H07 stageB') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H07 Stage B
        run: python research/eth_r3_h07_stageB_2023_test.py
      - name: Persist Stage B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H07_STAGEB_2023_LocalNeighborhood.csv ETH_R3_H07_STAGEB_Result.md ETH_R3_H07_STAGEB_Status.txt
          if [ -f ETH_R3_H07_STAGEB_FrozenStableCandidate.csv ]; then git add ETH_R3_H07_STAGEB_FrozenStableCandidate.csv; fi
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "research: persist ETH R3 H07 stageB 2023 stability test"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h07-stageB-2023-practical-stability-test
          path: |
            ETH_R3_H07_STAGEB_2023_LocalNeighborhood.csv
            ETH_R3_H07_STAGEB_FrozenStableCandidate.csv
            ETH_R3_H07_STAGEB_Result.md
            ETH_R3_H07_STAGEB_Status.txt
          if-no-files-found: warn
