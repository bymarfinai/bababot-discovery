name: ETH R3 H00-H02 standardized scan

on:
  push:
    branches:
      - eth-r3-full24-standardized-map
    paths:
      - 'research/eth_r3_h00_h02_standardized_scan.py'
      - '.github/workflows/eth_r3_h06_stageA_2022_dev.yml'
      - '.r3-h00-h02-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H00-H02 standardized scan
        run: python research/eth_r3_h00_h02_standardized_scan.py
      - name: Persist standardized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H00* ETH_R3_H01* ETH_R3_H02*
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "research: persist ETH R3 H00-H02 standardized scan"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h00-h02-standardized-scan
          path: |
            ETH_R3_H00*
            ETH_R3_H01*
            ETH_R3_H02*
          if-no-files-found: error
