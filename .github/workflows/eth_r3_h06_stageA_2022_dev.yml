name: ETH R3 H15-H23 completion scan

on:
  push:
    branches:
      - eth-r3-h15-h23-completion-scan
    paths:
      - 'research/eth_r3_h15_h23_completion_scan.py'
      - '.github/workflows/eth_r3_h06_stageA_2022_dev.yml'
      - '.r3-h15-h23-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H15-H23 completion scan
        run: python research/eth_r3_h15_h23_completion_scan.py
      - name: Persist completion outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H15* ETH_R3_H16* ETH_R3_H17* ETH_R3_H18* ETH_R3_H19* ETH_R3_H20* ETH_R3_H21* ETH_R3_H22* ETH_R3_H23*
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "research: persist ETH R3 H15-H23 completion scan"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h15-h23-completion-scan
          path: |
            ETH_R3_H15*
            ETH_R3_H16*
            ETH_R3_H17*
            ETH_R3_H18*
            ETH_R3_H19*
            ETH_R3_H20*
            ETH_R3_H21*
            ETH_R3_H22*
            ETH_R3_H23*
          if-no-files-found: error
