name: B27BG 24H regime detector audit

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_regime_detector_audit_b27bg.py'
      - 'BTC_24H_REGIME_DETECTOR_AUDIT_B27BG_Preregistration.md'
      - '.github/workflows/b27bg.yml'
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_regime_detector_audit_b27bg.py
      - name: Run B27BG
        run: python research/btc_24h_regime_detector_audit_b27bg.py
      - name: Persist results on main push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_REGIME_DETECTOR_AUDIT_B27BG_Result.md \
                  BTC_24H_REGIME_DETECTOR_AUDIT_B27BG_Summary.csv \
                  BTC_24H_REGIME_DETECTOR_AUDIT_B27BG_Transitions.csv \
                  BTC_24H_REGIME_DETECTOR_AUDIT_B27BG_Episodes.csv \
                  BTC_24H_REGIME_DETECTOR_AUDIT_B27BG_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BG regime detector audit results'
            git push
          fi
