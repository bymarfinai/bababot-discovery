name: SOL Regime Detector Stage 3

on:
  push:
    branches:
      - research/sol-regime-detector-stage3
    paths:
      - 'SOL_REGIME_DETECTOR_STAGE3_Preregistration.md'
      - 'research/sol_regime_detector_stage3.py'
      - '.github/workflows/sol-regime-detector-stage3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-regime-detector-stage3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run frozen Stage 3 raw scoring
        run: python research/sol_regime_detector_stage3.py
      - name: Persist Stage 3 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_REGIME_DETECTOR_STAGE3_Result.md \
            SOL_REGIME_DETECTOR_STAGE3_Scores_DEV.csv \
            SOL_REGIME_DETECTOR_STAGE3_Audit.csv \
            SOL_REGIME_DETECTOR_STAGE3_Status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist SOL regime Stage 3 raw scores"
          git pull --rebase origin research/sol-regime-detector-stage3
          git push origin HEAD:research/sol-regime-detector-stage3
