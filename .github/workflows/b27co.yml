name: B27CO F05 clock-specific pre-T5 SL economics

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_f05_clock_sl_b27co.py'
      - 'BTC_24H_F05_CLOCK_SL_B27CO_Preregistration.md'
      - '.github/workflows/b27co.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27CO
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_24H_F05_CLOCK_SL_B27CO_Run.log
          echo 'B27CO run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_24h_f05_clock_sl_b27co.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_f05_clock_sl_b27co.py >> "$LOG" 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27co-results
          path: |
            BTC_24H_F05_CLOCK_SL_B27CO_Result.md
            BTC_24H_F05_CLOCK_SL_B27CO_AllVariants.csv
            BTC_24H_F05_CLOCK_SL_B27CO_SelectedTrades.csv
            BTC_24H_F05_CLOCK_SL_B27CO_Candidates.csv
            BTC_24H_F05_CLOCK_SL_B27CO_Summary.csv
            BTC_24H_F05_CLOCK_SL_B27CO_Status.txt
            BTC_24H_F05_CLOCK_SL_B27CO_Audit.txt
            BTC_24H_F05_CLOCK_SL_B27CO_Run.log
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_F05_CLOCK_SL_B27CO_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CO clock-specific SL outputs'
            git push
          fi
      - name: Fail if script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
