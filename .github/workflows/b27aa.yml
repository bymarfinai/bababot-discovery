name: B27AA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b27aa.yml'
      - 'research/btc_london_ny_f85_early_reclaim_b27aa.py'
jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_f85_early_reclaim_b27aa.py
      - run: cd research && python btc_london_ny_f85_early_reclaim_b27aa.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_F85_EARLY_RECLAIM_B27AA_Result.md BTC_LONDON_NY_F85_EARLY_RECLAIM_B27AA_Trades.csv BTC_LONDON_NY_F85_EARLY_RECLAIM_B27AA_Summary.csv BTC_LONDON_NY_F85_EARLY_RECLAIM_B27AA_Selection.csv BTC_LONDON_NY_F85_EARLY_RECLAIM_B27AA_StatusCounts.csv
          git commit -m 'research: persist B27AA result' || true
          git push
