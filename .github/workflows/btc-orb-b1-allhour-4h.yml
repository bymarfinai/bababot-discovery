name: BTC ORB B1 All-Hour 4H

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_orb_b1_allhour_4h.py'
      - 'BTC_ORB_B1_AllHour_4H_Preregistration.md'
      - '.github/workflows/btc-orb-b1-allhour-4h.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Run frozen B1
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_orb_b1_allhour_4h.py > BTC_ORB_B1_AllHour_4H_Run.log 2>&1
          code=$?
          echo "$code" > BTC_ORB_B1_AllHour_4H_EXIT_CODE.txt
          cat BTC_ORB_B1_AllHour_4H_Run.log
          exit $code
      - name: Persist artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_ORB_B1_AllHour_4H_EXIT_CODE.txt BTC_ORB_B1_AllHour_4H_Run.log
          for f in BTC_ORB_B1_AllHour_4H_Result.md BTC_ORB_B1_AllHour_4H_Result.json BTC_ORB_B1_AllHour_4H_Candidates.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC ORB B1 all-hour 4H result"
            git push
          fi
      - name: Fail if test failed
        if: steps.run.outcome == 'failure'
        run: exit 1
