name: SOL Long 15UTC RC30C2 Parent MAE Transfer A39
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [research/sol-long-structure-a1-run]
    paths:
      - 'research/sol_long_15utc_rc30c2_parent_mae_transfer_a39.py'
      - 'SOL_LONG_15UTC_RC30C2_PARENT_MAE_TRANSFER_A39_Preregistration.md'
      - '.github/workflows/sol-long-15utc-rc30c2-parent-mae-transfer-a39.yml'
jobs:
  a39:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests
      - name: Run A39 parent-MAE transfer
        run: python research/sol_long_15utc_rc30c2_parent_mae_transfer_a39.py
      - name: Persist A39 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_RC30C2_PARENT_MAE_TRANSFER_A39_*.md SOL_LONG_15UTC_RC30C2_PARENT_MAE_TRANSFER_A39_*.csv SOL_LONG_15UTC_RC30C2_PARENT_MAE_TRANSFER_A39_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A39 parent-MAE transfer'
          git push origin HEAD:research/sol-long-structure-a1-run
