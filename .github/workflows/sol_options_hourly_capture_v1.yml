name: SOL Options Control Validation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sol_options_hourly_capture_v1.yml'

permissions:
  contents: read

jobs:
  validate-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SOL options discovery branch
        uses: actions/checkout@v4
        with:
          ref: sol-options-liquidity-map-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile frozen SOL options research code
        run: |
          python -m py_compile sol_options_liquidity_map.py
          python -m py_compile research/capture_sol_options_hourly_v1.py
          python -m py_compile research/sol_options_wall_forward_validation_v1.py
          python -m py_compile research/sol_options_wall_control_test_v1.py

      - name: Validate frozen first options fixture
        run: PYTHONPATH=. python research/validate_sol_options_liquidity_v1.py
