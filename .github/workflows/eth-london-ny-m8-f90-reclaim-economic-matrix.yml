name: ETH London NY M8 F90 Reclaim Economic Matrix

on:
  push:
    paths:
      - 'ETH_LONDON_NY_M8_F90_RECLAIM_ECONOMIC_MATRIX_Preregistration.md'
      - 'research/eth_london_ny_m8_f90_reclaim_economic_matrix.py'
      - '.github/workflows/eth-london-ny-m8-f90-reclaim-economic-matrix.yml'
  workflow_dispatch:

jobs:
  m8:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH London-NY M8
        run: python research/eth_london_ny_m8_f90_reclaim_economic_matrix.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add ETH_LONDON_NY_M8_F90_RECLAIM_ECONOMIC_MATRIX_Result.md ETH_LONDON_NY_M8_F90_RECLAIM_ECONOMIC_MATRIX_Trades.csv ETH_LONDON_NY_M8_F90_RECLAIM_ECONOMIC_MATRIX_Summary.csv ETH_LONDON_NY_M8_F90_RECLAIM_ECONOMIC_MATRIX_Audit.csv ETH_LONDON_NY_M8_F90_RECLAIM_ECONOMIC_MATRIX_Status.txt
          git commit -m "research: persist ETH London-NY M8 economic matrix" || true
          git push
