name: S5.0A Saturday Parity Probe
on:
  push:
    paths:
      - '.github/workflows/s50a-parity-once.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: python research/s50a_parity_probe.py
