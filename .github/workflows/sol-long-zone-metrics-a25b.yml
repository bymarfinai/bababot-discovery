name: SOL Long Zone Metrics A25B

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_zone_metrics_a25b.py'
      - '.github/workflows/sol-long-zone-metrics-a25b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a25b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run A25B zone metrics
        run: python research/sol_long_zone_metrics_a25b.py
      - name: Persist A25B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_THREE_ZONE_METRICS_A25B_ZONES.md SOL_LONG_THREE_ZONE_METRICS_A25B_Status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist SOL A25B zone metrics"
          git pull --rebase origin research/sol-long-structure-a1-run
          git push origin HEAD:research/sol-long-structure-a1-run
