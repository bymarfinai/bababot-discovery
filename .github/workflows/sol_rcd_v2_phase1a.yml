name: SOL RCD v2 Phase 1A

on:
  push:
    branches:
      - sol-robust-character-discovery-v2
    paths:
      - '.sol-rcd-v2-phase1a-trigger'

permissions:
  contents: write

jobs:
  sol-rcd-v2-phase1a:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered SOL RCD v2 Phase 1A
        run: |
          set -euo pipefail
          LOG=SOL_RCD_V2_PHASE1A_Run.log
          echo 'SOL Robust Character Discovery v2 Phase 1A' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/sol_robust_character_discovery_v2_phase1a.py 2>&1 | tee -a "$LOG"
          python research/sol_robust_character_discovery_v2_phase1a.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: sol-rcd-v2-phase1a
          path: SOL_RCD_V2_PHASE1A_*
          if-no-files-found: error
      - name: Persist Phase 1A outputs to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_RCD_V2_PHASE1A_*
          if git diff --cached --quiet; then
            echo 'No Phase 1A output changes to persist.'
          else
            git commit -m 'persist SOL RCD v2 Phase 1A outputs'
            git push origin HEAD:sol-robust-character-discovery-v2
          fi
