name: SOL Long 15UTC Loss Trigger A51

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_15utc_loss_trigger_a51.py'
      - 'SOL_LONG_15UTC_LOSS_TRIGGER_A51_Preregistration.md'
      - '.github/workflows/sol-long-15utc-loss-trigger-a51.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a51:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A51 universal loss trigger anatomy
        run: python research/sol_long_15utc_loss_trigger_a51.py

      - name: Persist A51 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_LOSS_TRIGGER_A51_EVENTS.csv \
                  SOL_LONG_15UTC_LOSS_TRIGGER_A51_CLASS_SUMMARY.csv \
                  SOL_LONG_15UTC_LOSS_TRIGGER_A51_WARNING_SUMMARY.csv \
                  SOL_LONG_15UTC_LOSS_TRIGGER_A51_Result.md \
                  SOL_LONG_15UTC_LOSS_TRIGGER_A51_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A51 15UTC universal loss trigger anatomy'
          git pull --rebase origin research/sol-long-structure-a1-run
          git push origin HEAD:research/sol-long-structure-a1-run
