name: SOL structure discovery B1

on:
  push:
    branches:
      - research/sol-structure-discovery-b1
    paths:
      - '.sol-structure-b1-trigger'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run development-only structure discovery
        run: python research/sol_structure_discovery_b1.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-structure-discovery-b1
          path: SOL_STRUCTURE_DISCOVERY_B1_*
      - name: Persist discovery result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_STRUCTURE_DISCOVERY_B1_*
          git commit -m "research(sol): persist structure discovery B1"
          git push
