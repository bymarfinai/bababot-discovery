name: V4 A1.2 Liquidity Geometry Screen

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait deploy, refresh data, compare three frozen geometries
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          PAIRS='["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]'

          echo '=== WAIT FOR A1.2 ENDPOINT ==='
          READY=0
          for i in $(seq 1 120); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              "$BASE/v4/liquidity-retest?symbol=BTCUSDT&days=30&rr=1.0&execution_tf=5m&zone_mode=reaction_body&sample_limit=0" || true)
            if [ "$CODE" = '200' ]; then
              PHASE=$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/probe.json'))
              print(d.get('phase',''))
          except Exception:
              print('')
          PY
          )
              if [ "$PHASE" = 'V4-A1.2' ]; then READY=1; echo "ready probe=$i"; break; fi
            fi
            echo "probe $i http=$CODE"
            sleep 5
          done
          if [ "$READY" != '1' ]; then echo 'A1.2 endpoint not ready'; cat /tmp/probe.json || true; exit 1; fi

          echo '=== REFRESH EXACT 120D 1H + 5M ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            -X POST -H 'Content-Type: application/json' \
            -d "{\"days\":120,\"pairs\":${PAIRS},\"timeframes\":[\"1h\",\"5m\"]}" \
            "$BASE/fetch-data"
          echo

          for i in $(seq 1 300); do
            curl -fsS --retry 4 --retry-delay 2 --retry-all-errors "$BASE/fetch-status" > /tmp/fetch-status.json
            STATUS=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/fetch-status.json'))
          print(d.get('fetch_state',{}).get('status',''))
          PY
          )
            if [ $((i % 5)) -eq 0 ]; then
              python - <<'PY'
          import json
          s=json.load(open('/tmp/fetch-status.json')).get('fetch_state',{})
          print('FETCH',s.get('status'),s.get('progress'),'candles=',s.get('total_candles'))
          PY
            fi
            if [ "$STATUS" = 'done' ]; then break; fi
            if [ "$STATUS" = 'error' ]; then cat /tmp/fetch-status.json; exit 1; fi
            sleep 5
          done
          if [ "$STATUS" != 'done' ]; then echo 'Fetch did not finish'; exit 1; fi

          for MODE in pocket reaction_body reaction_range; do
            echo "=== MODE $MODE ==="
            for SYM in BTCUSDT ETHUSDT SOLUSDT BNBUSDT; do
              OUT="/tmp/${MODE}-${SYM}.json"
              curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
                "$BASE/v4/liquidity-retest?symbol=${SYM}&days=120&rr=1.0&execution_tf=5m&zone_mode=${MODE}&sample_limit=0" > "$OUT"
              python - "$MODE" "$SYM" "$OUT" <<'PY'
          import json,sys
          mode,sym,path=sys.argv[1:]
          d=json.load(open(path))
          print('PAIR_RESULT',mode,sym,json.dumps({k:d.get(k) for k in ['zone_count','overall','demand','supply','diagnostics','error'] if k in d},separators=(',',':')))
          PY
            done
          done

          echo '=== AGGREGATES ==='
          python - <<'PY'
          import json
          pairs=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT']
          modes=['pocket','reaction_body','reaction_range']
          for mode in modes:
              ds=[json.load(open(f'/tmp/{mode}-{p}.json')) for p in pairs]
              def agg(key):
                  w=sum((d.get(key) or {}).get('bounce',0) or 0 for d in ds)
                  l=sum((d.get(key) or {}).get('break',0) or 0 for d in ds)
                  z=sum((d.get(key) or {}).get('zones',0) or 0 for d in ds)
                  amb=sum((d.get('diagnostics') or {}).get('ambiguous_entry_bars',0) or 0 for d in ds)
                  r=w+l
                  return {'zones':z,'resolved':r,'wins':w,'losses':l,'wr_pct':round(100*w/r,2) if r else None,'ambiguous_entry_bars':amb}
              print('MODE_AGG',mode,json.dumps({'overall':agg('overall'),'demand':agg('demand'),'supply':agg('supply')},separators=(',',':')))
          PY
