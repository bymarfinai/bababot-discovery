name: BTC Temporal A3.5 Prewindow Direction Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a35:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.5 pre-window 5m dynamic direction
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a35_prewindow.py
