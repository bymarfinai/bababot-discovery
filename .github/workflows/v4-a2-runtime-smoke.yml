name: BTC Temporal A4.1 Rescue Rules Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a41:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run A4.1 interpretable rescue rules
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a41_rescue_rules.py
