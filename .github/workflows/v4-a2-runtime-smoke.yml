name: BTC Temporal A3.2 Cross-Day Direction Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a32:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.2 cross-day path learner
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a32_crossday.py
