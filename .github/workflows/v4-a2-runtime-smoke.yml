name: BTC Temporal A3.8 Tuesday Money Extension

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a38:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.8 money optimizer boundary extension
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a38_money_extension.py
