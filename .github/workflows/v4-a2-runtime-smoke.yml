name: BTC Temporal A3.6 Direct First-Touch Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a36:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.6 direct first-touch classifier
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a36_firsttouch.py
