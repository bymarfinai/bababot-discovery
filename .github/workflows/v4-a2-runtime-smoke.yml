name: BTC Temporal A3.1 Dynamic Observation Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a31:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.1 dynamic observation-depth path learner
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a31_pathscan.py
