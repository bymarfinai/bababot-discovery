name: BTC Temporal Friday15 A6.0 Money Geometry

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  friday15-a60:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Friday15 A6.0 money geometry
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_friday15_a60_money_geometry.py
