name: BTC Temporal A3.4 5m Event Direction Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a34:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.4 5m event-sequence dynamic direction
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a34_5m_events.py
