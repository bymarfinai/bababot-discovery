name: BTC Temporal A3.7 Tuesday Money Optimizer

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a37:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run A3.7 money-first TP SL optimizer
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a37_money_optimizer.py
