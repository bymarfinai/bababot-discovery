name: BTC Temporal A5.5 EMA Overextension

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a55:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run A5.5 EMA overextension
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a55_ema_overextension.py
