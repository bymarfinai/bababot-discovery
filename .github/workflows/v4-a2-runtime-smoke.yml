name: BTC Temporal Friday15 A6.28 Early Damage Control

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  friday15-a628:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Friday15 A6.28 early damage control
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_friday15_a628_early_damage_control.py
