name: V5 C Derivatives Native Setup

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
      - 'research/v5_c_derivatives_native.py'
      - 'research/v5_a2_derivatives_forensic.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen V5-C derivatives-native 120d screen
        shell: bash
        run: |
          set -euo pipefail
          python research/v5_c_derivatives_native.py
