name: V5 A2 Derivatives Winner Loser Forensic

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
      - 'research/v5_a2_derivatives_forensic.py'
      - 'research/v5_a2_funding_archive_runner.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen V5-A2 with official funding archive
        shell: bash
        run: |
          set -euo pipefail
          python research/v5_a2_funding_archive_runner.py
