name: BTC Temporal A2 Sequence Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run 971d BTC Tuesday dynamic sequence discovery
        shell: bash
        run: |
          set -euo pipefail
          URL='https://web-production-b6a05.up.railway.app/research/btc-temporal-a2?days=971&blocks=8&min_n=20'
          READY=0
          for i in $(seq 1 48); do
            CODE=$(curl -L -sS -o /tmp/a2.json -w '%{http_code}' "$URL" || true)
            STATUS=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/a2.json')).get('status',''))
          except Exception: print('')
          PY
          )
            if [ "$CODE" = '200' ] && [ "$STATUS" = 'BTC_TEMPORAL_A2_DYNAMIC_SEQUENCE' ]; then READY=1; break; fi
            echo "probe=$i http=$CODE status=$STATUS"
            sleep 10
          done
          if [ "$READY" != '1' ]; then echo 'A2 endpoint not ready'; cat /tmp/a2.json || true; exit 1; fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a2.json'))
          print('DATA',json.dumps(d.get('data',{}),separators=(',',':')))
          print('BASELINE')
          for h,r in d.get('baseline_exact_0600',{}).items(): print(h,json.dumps(r,separators=(',',':')))
          print('COUNTS',json.dumps({k:d.get(k) for k in ['candidate_count','target70_count','target65_count']},separators=(',',':')))
          print('TARGET70')
          for i,r in enumerate(d.get('target70',[]),1): print(i,json.dumps(r,separators=(',',':')))
          print('TARGET65')
          for i,r in enumerate(d.get('target65',[])[:15],1): print(i,json.dumps(r,separators=(',',':')))
          print('TOP_WR')
          for i,r in enumerate(d.get('leaderboard_wr',[])[:20],1): print(i,json.dumps(r,separators=(',',':')))
          print('TOP_STABILITY')
          for i,r in enumerate(d.get('leaderboard_stability',[])[:20],1): print(i,json.dumps(r,separators=(',',':')))
          PY
