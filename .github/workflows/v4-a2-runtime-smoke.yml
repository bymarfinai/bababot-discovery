name: V4 A2 Runtime Smoke

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed data status and V4-A2 BTC 120d
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          echo '=== DATA STATUS ==='
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$BASE/data/status" | tee /tmp/data-status.json
          echo
          echo '=== V4-A2 BTCUSDT 120D 5M RR1 ==='
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$BASE/v4/first-retest?symbol=BTCUSDT&days=120&rr=1.0&execution_tf=5m&sample_limit=0" | tee /tmp/v4-a2-btc.json
          echo
          echo '=== COMPACT RESULT ==='
          python - <<'PY'
          import json
          from pathlib import Path
          for label, path in [('data', '/tmp/data-status.json'), ('a2', '/tmp/v4-a2-btc.json')]:
              d=json.loads(Path(path).read_text())
              if label=='data':
                  btc=d.get('pairs',{}).get('BTCUSDT',{})
                  print('BTC_DATA', json.dumps(btc, separators=(',',':')))
              else:
                  keep={k:d.get(k) for k in ['phase','status','symbol','requested_days','execution_tf','error','data','overall','demand','supply','quality','verdict'] if k in d}
                  print('A2_RESULT', json.dumps(keep, separators=(',',':')))
          PY
