name: BTC Temporal A1 Discovery Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run 971d BTC weekday-hour discovery
        shell: bash
        run: |
          set -euo pipefail
          URL='https://web-production-b6a05.up.railway.app/research/btc-temporal?days=971&tz_offset_hours=7&blocks=8&top_n=30&min_n=80'
          READY=0
          for i in $(seq 1 36); do
            CODE=$(curl -L -sS -o /tmp/a1.json -w '%{http_code}' "$URL" || true)
            STATUS=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/a1.json')).get('status',''))
          except Exception: print('')
          PY
          )
            if [ "$CODE" = '200' ] && [ "$STATUS" = 'BTC_WEEKDAY_HOUR_FULL_DISCOVERY' ]; then READY=1; break; fi
            echo "probe=$i http=$CODE status=$STATUS"
            sleep 10
          done
          if [ "$READY" != '1' ]; then echo 'A1 endpoint not ready'; cat /tmp/a1.json || true; exit 1; fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a1.json'))
          print('DATA',json.dumps(d.get('data',{}),separators=(',',':')))
          print('SLOTS',d.get('slot_count_evaluated'))
          print('STABILITY_FIRST')
          for i,r in enumerate(d.get('leaderboard_stability_first',[]),1):
              print(i,json.dumps(r,separators=(',',':')))
          print('RAW_WR')
          for i,r in enumerate(d.get('leaderboard_raw_wr',[]),1):
              print(i,json.dumps(r,separators=(',',':')))
          print('TRACKED')
          print(json.dumps(d.get('tracked_candidates',{}),separators=(',',':')))
          PY
