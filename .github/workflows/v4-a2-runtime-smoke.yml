name: V4 A4 Frozen Demand Robustness

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test three frozen demand hypotheses by pair and time
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          for SYM in BTCUSDT ETHUSDT SOLUSDT BNBUSDT; do
            curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
              "$BASE/v4/first-retest?symbol=${SYM}&days=120&rr=1.0&execution_tf=5m&sample_limit=100" \
              > "/tmp/${SYM}.json"
          done

          python - <<'PY'
          import json
          from datetime import datetime

          PAIRS=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT']
          rows=[]
          for p in PAIRS:
              d=json.load(open(f'/tmp/{p}.json'))
              for x in d.get('results_sample',[]):
                  if x.get('side')!='DEMAND' or x.get('outcome') not in ('BOUNCE','BREAK'):
                      continue
                  z=dict(x); z['pair']=p; z['win']=1 if x['outcome']=='BOUNCE' else 0
                  z['_t']=datetime.fromisoformat(x['retest_time'])
                  rows.append(z)
          rows.sort(key=lambda r:r['_t'])

          RULES={
              'H1_BASE_GAP_GE5': lambda r: float(r['base_to_bos_bars'])>=5,
              'H2_CLOSE_LOC_LE070': lambda r: float(r['bos_close_location'])<=0.70,
              'H3_BOTH': lambda r: float(r['base_to_bos_bars'])>=5 and float(r['bos_close_location'])<=0.70,
          }

          def stat(xs):
              n=len(xs); w=sum(r['win'] for r in xs)
              return {'n':n,'wins':w,'losses':n-w,'wr_pct':round(100*w/n,2) if n else None}

          print('BASELINE_DEMAND',json.dumps(stat(rows),separators=(',',':')))
          n=len(rows)
          # chronological quarters use all demand observations in time order;
          # rule is then evaluated inside each pre-defined time block.
          blocks=[]
          for q in range(4):
              lo=(n*q)//4; hi=(n*(q+1))//4
              blocks.append(rows[lo:hi])

          for name,fn in RULES.items():
              sel=[r for r in rows if fn(r)]
              result={
                  'overall':stat(sel),
                  'by_pair':{p:stat([r for r in sel if r['pair']==p]) for p in PAIRS},
                  'time_quarters':[stat([r for r in b if fn(r)]) for b in blocks],
                  'first_half':stat([r for r in rows[:n//2] if fn(r)]),
                  'second_half':stat([r for r in rows[n//2:] if fn(r)]),
              }
              print('A4_RULE',name,json.dumps(result,separators=(',',':')))
          PY
