name: V4 A2 Runtime Smoke

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Refresh exact 120d 1h+5m and run 4-pair V4-A2
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          PAIRS='["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]'

          echo '=== REFRESH 1H + 5M ALL FOUR PAIRS, 120D ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            -X POST -H 'Content-Type: application/json' \
            -d "{\"days\":120,\"pairs\":${PAIRS},\"timeframes\":[\"1h\",\"5m\"]}" \
            "$BASE/fetch-data"
          echo

          for i in $(seq 1 300); do
            curl -fsS --retry 4 --retry-delay 2 --retry-all-errors "$BASE/fetch-status" > /tmp/fetch-status.json
            STATUS=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/fetch-status.json'))
          print(d.get('fetch_state',{}).get('status',''))
          PY
          )
            python - <<'PY'
          import json
          d=json.load(open('/tmp/fetch-status.json'))
          s=d.get('fetch_state',{})
          print('FETCH', s.get('status'), s.get('progress'), 'new=', s.get('total_candles'))
          PY
            if [ "$STATUS" = 'done' ]; then break; fi
            if [ "$STATUS" = 'error' ]; then cat /tmp/fetch-status.json; exit 1; fi
            sleep 5
          done

          STATUS=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/fetch-status.json'))
          print(d.get('fetch_state',{}).get('status',''))
          PY
          )
          if [ "$STATUS" != 'done' ]; then echo 'Fetch did not finish'; cat /tmp/fetch-status.json; exit 1; fi

          echo '=== DATA STATUS ==='
          curl -fsS "$BASE/data/status" > /tmp/data.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/data.json'))
          for s in ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT']:
              t=d.get('pairs',{}).get(s,{})
              print('DATA', s, json.dumps({'1h':t.get('1h'),'5m':t.get('5m')},separators=(',',':')))
          PY

          echo '=== FOUR PAIR EXACT-WINDOW V4-A2 ==='
          for SYM in BTCUSDT ETHUSDT SOLUSDT BNBUSDT; do
            OUT="/tmp/${SYM}.json"
            curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
              "$BASE/v4/first-retest?symbol=${SYM}&days=120&rr=1.0&execution_tf=5m&sample_limit=0" > "$OUT"
            python - "$SYM" "$OUT" <<'PY'
          import json,sys
          sym,path=sys.argv[1:]
          d=json.load(open(path))
          keep={k:d.get(k) for k in ['phase','status','symbol','requested_days','execution_tf','error','data','zone_count','overall','demand','supply','diagnostics'] if k in d}
          print('PAIR_RESULT', sym, json.dumps(keep,separators=(',',':')))
          PY
          done
