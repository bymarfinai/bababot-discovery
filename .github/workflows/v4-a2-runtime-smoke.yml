name: BTC Temporal A3 Dynamic Direction Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run 971d BTC Tuesday walk-forward dynamic direction
        shell: bash
        run: |
          set -euo pipefail
          URL='https://web-production-b6a05.up.railway.app/research/btc-temporal-a3-direction?days=971&blocks=8&warmup=20'
          READY=0
          for i in $(seq 1 60); do
            CODE=$(curl -L -sS -o /tmp/a3.json -w '%{http_code}' "$URL" || true)
            STATUS=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/a3.json')).get('status',''))
          except Exception: print('')
          PY
          )
            if [ "$CODE" = '200' ] && [ "$STATUS" = 'BTC_TEMPORAL_A3_DYNAMIC_DIRECTION_WALKFORWARD' ]; then READY=1; break; fi
            echo "probe=$i http=$CODE status=$STATUS"
            sleep 10
          done
          if [ "$READY" != '1' ]; then echo 'A3 endpoint not ready'; cat /tmp/a3.json || true; exit 1; fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a3.json'))
          print('DATA',json.dumps(d.get('data',{}),separators=(',',':')))
          print('COUNTS',json.dumps({
              'candidate_engine_count':d.get('candidate_engine_count'),
              'target70_directional':len(d.get('target70_directional',[])),
              'target70_ft05':len(d.get('target70_ft05',[])),
              'target70_ft08':len(d.get('target70_ft08',[]))
          },separators=(',',':')))
          print('BASELINE')
          for r in d.get('baseline_same_entry',[]): print(json.dumps(r,separators=(',',':')))
          print('DIR70')
          for i,r in enumerate(d.get('target70_directional',[])[:20],1): print(i,json.dumps(r,separators=(',',':')))
          print('FT05_70')
          for i,r in enumerate(d.get('target70_ft05',[])[:20],1): print(i,json.dumps(r,separators=(',',':')))
          print('FT08_70')
          for i,r in enumerate(d.get('target70_ft08',[])[:20],1): print(i,json.dumps(r,separators=(',',':')))
          print('TOP_DIR')
          for i,r in enumerate(d.get('top_directional',[])[:15],1): print(i,json.dumps(r,separators=(',',':')))
          print('TOP_FT05')
          for i,r in enumerate(d.get('top_first_touch_05',[])[:15],1): print(i,json.dumps(r,separators=(',',':')))
          print('TOP_FT08')
          for i,r in enumerate(d.get('top_first_touch_08',[])[:15],1): print(i,json.dumps(r,separators=(',',':')))
          PY
