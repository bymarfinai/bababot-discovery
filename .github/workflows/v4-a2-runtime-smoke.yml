name: V4 B6 Market State Forensic

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Diagnose causal market state behind recent 86pct window
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          PAIRS='["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]'

          echo '=== WAIT FOR V4-B6 ENDPOINT ==='
          READY=0
          for i in $(seq 1 120); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              "$BASE/v4/market-state-forensic?days=240&recent_days=120&rr=1.0&confirm_bars=3&sample_limit=0" || true)
            if [ "$CODE" = '200' ]; then
              PHASE=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/probe.json')).get('phase',''))
          except Exception: print('')
          PY
          )
              if [ "$PHASE" = 'V4-B6' ]; then READY=1; echo "ready probe=$i"; break; fi
            fi
            echo "probe $i http=$CODE"
            sleep 5
          done
          if [ "$READY" != '1' ]; then echo 'V4-B6 endpoint not ready'; cat /tmp/probe.json || true; exit 1; fi

          echo '=== CHECK 971D DATA RESIDENCY ==='
          curl -fsS "$BASE/data/status" > /tmp/data-status.json
          HAVE=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/data-status.json'))
          pairs=d.get('pairs',{})
          need=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT']
          ok=True
          for p in need:
              for tf in ['1h','5m']:
                  days=float(((pairs.get(p) or {}).get(tf) or {}).get('days',0) or 0)
                  if days < 969:
                      ok=False
          print('1' if ok else '0')
          PY
          )

          if [ "$HAVE" != '1' ]; then
            echo '=== REFRESH EXACT 971D 1H + 5M ==='
            curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
              -X POST -H 'Content-Type: application/json' \
              -d "{\"days\":971,\"pairs\":${PAIRS},\"timeframes\":[\"1h\",\"5m\"]}" \
              "$BASE/fetch-data"
            echo

            STATUS=''
            for i in $(seq 1 600); do
              curl -fsS --retry 4 --retry-delay 2 --retry-all-errors "$BASE/fetch-status" > /tmp/fetch-status.json
              STATUS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/fetch-status.json')).get('fetch_state',{}).get('status',''))
          PY
          )
              if [ $((i % 10)) -eq 0 ]; then
                python - <<'PY'
          import json
          s=json.load(open('/tmp/fetch-status.json')).get('fetch_state',{})
          print('FETCH',s.get('status'),s.get('progress'),'candles=',s.get('total_candles'))
          PY
              fi
              if [ "$STATUS" = 'done' ]; then break; fi
              if [ "$STATUS" = 'error' ]; then cat /tmp/fetch-status.json; exit 1; fi
              sleep 5
            done
            if [ "$STATUS" != 'done' ]; then echo 'Fetch did not finish'; exit 1; fi
          else
            echo '971d 1h+5m data already resident; skipping refresh.'
          fi

          echo '=== RUN V4-B6 MARKET-STATE FORENSIC ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            "$BASE/v4/market-state-forensic?days=971&recent_days=120&rr=1.0&confirm_bars=3&sample_limit=0" \
            > /tmp/b6.json

          python - <<'PY'
          import json
          d=json.load(open('/tmp/b6.json'))
          print('OVERALL',json.dumps(d.get('overall'),separators=(',',':')))
          print('RECENT',json.dumps(d.get('recent'),separators=(',',':')))
          print('HISTORICAL',json.dumps(d.get('historical'),separators=(',',':')))
          print('FEATURES',json.dumps(d.get('recent_vs_historical_features'),separators=(',',':')))
          print('IQR_MATCH',json.dumps(d.get('historical_wr_when_matching_recent_iqr_one_feature'),separators=(',',':')))
          print('STATE_BUCKETS',json.dumps(d.get('predeclared_state_buckets'),separators=(',',':')))
          print('MULTIVARIATE',json.dumps(d.get('historical_multivariate_recent_similarity'),separators=(',',':')))
          print('ERRORS',json.dumps(d.get('errors'),separators=(',',':')))
          PY
