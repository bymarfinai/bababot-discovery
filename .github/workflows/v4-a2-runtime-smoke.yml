name: BTC Temporal Friday15 T-Method F5.12 Hidden-State Transition Detector

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  friday15-f512:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Friday T-Method F5.12 hidden-state transition detector
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_friday15_f512_hidden_state_transition_detector.py
