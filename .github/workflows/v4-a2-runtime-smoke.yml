name: V4 B1 Absorption Forensic

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait deploy, refresh data, run frozen V4-B1 forensic
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          PAIRS='["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]'

          echo '=== WAIT FOR V4-B1 ENDPOINT ==='
          READY=0
          for i in $(seq 1 120); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              "$BASE/v4/absorption-forensic?symbols=BTCUSDT&days=30&rr=1.0&confirm_bars=3&sample_limit=0" || true)
            if [ "$CODE" = '200' ]; then
              PHASE=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/probe.json')).get('phase',''))
          except Exception: print('')
          PY
          )
              if [ "$PHASE" = 'V4-B1' ]; then READY=1; echo "ready probe=$i"; break; fi
            fi
            echo "probe $i http=$CODE"
            sleep 5
          done
          if [ "$READY" != '1' ]; then echo 'V4-B1 endpoint not ready'; cat /tmp/probe.json || true; exit 1; fi

          echo '=== REFRESH EXACT 120D 1H + 5M ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            -X POST -H 'Content-Type: application/json' \
            -d "{\"days\":120,\"pairs\":${PAIRS},\"timeframes\":[\"1h\",\"5m\"]}" \
            "$BASE/fetch-data"
          echo

          STATUS=''
          for i in $(seq 1 300); do
            curl -fsS --retry 4 --retry-delay 2 --retry-all-errors "$BASE/fetch-status" > /tmp/fetch-status.json
            STATUS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/fetch-status.json')).get('fetch_state',{}).get('status',''))
          PY
          )
            if [ $((i % 5)) -eq 0 ]; then
              python - <<'PY'
          import json
          s=json.load(open('/tmp/fetch-status.json')).get('fetch_state',{})
          print('FETCH',s.get('status'),s.get('progress'),'candles=',s.get('total_candles'))
          PY
            fi
            if [ "$STATUS" = 'done' ]; then break; fi
            if [ "$STATUS" = 'error' ]; then cat /tmp/fetch-status.json; exit 1; fi
            sleep 5
          done
          if [ "$STATUS" != 'done' ]; then echo 'Fetch did not finish'; exit 1; fi

          echo '=== V4-B1 FORENSIC ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            "$BASE/v4/absorption-forensic?symbols=BTCUSDT%2CETHUSDT%2CSOLUSDT%2CBNBUSDT&days=120&rr=1.0&confirm_bars=3&sample_limit=0" \
            > /tmp/forensic.json

          python - <<'PY'
          import json
          d=json.load(open('/tmp/forensic.json'))
          print('OVERALL',json.dumps(d.get('overall'),separators=(',',':')))
          print('BY_PAIR',json.dumps(d.get('by_pair'),separators=(',',':')))
          print('WIN_LOSS',json.dumps(d.get('winner_vs_loser'),separators=(',',':')))
          print('QUARTILES',json.dumps(d.get('quartile_wr'),separators=(',',':')))
          print('PAIR_DIRECTION',json.dumps(d.get('pair_direction_consistency'),separators=(',',':')))
          print('ERRORS',json.dumps(d.get('errors'),separators=(',',':')))
          PY
