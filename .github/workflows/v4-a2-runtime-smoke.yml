name: V6 B Liquidation Cascade Mechanics

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
      - 'research/v6_b_liquidation_cascade.py'
      - 'research/v6_a_liquidation_feasibility.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARDIS_API_KEY: ${{ secrets.TARDIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run actual-liquidation public-sample mechanics screen
        shell: bash
        run: |
          set -euo pipefail
          python research/v6_b_liquidation_cascade.py
