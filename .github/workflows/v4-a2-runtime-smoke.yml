name: V6 A Liquidation Feasibility

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
      - 'research/v6_a_liquidation_feasibility.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe historical forced-liquidation data path
        shell: bash
        run: |
          set -euo pipefail
          python research/v6_a_liquidation_feasibility.py
