name: V5 A1 Derivatives Data Feasibility Audit

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Binance derivatives history and official archives
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'

          echo '=== WAIT FOR V5-A1 ENDPOINT ==='
          READY=0
          for i in $(seq 1 120); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              "$BASE/v5/derivatives-feasibility?symbols=BTCUSDT&period=5m" || true)
            if [ "$CODE" = '200' ]; then
              PHASE=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/probe.json')).get('phase',''))
          except Exception: print('')
          PY
          )
              if [ "$PHASE" = 'V5-A1' ]; then READY=1; echo "ready probe=$i"; break; fi
            fi
            echo "probe $i http=$CODE"
            sleep 5
          done
          if [ "$READY" != '1' ]; then echo 'V5-A1 endpoint not ready'; cat /tmp/probe.json || true; exit 1; fi

          echo '=== RUN FOUR-PAIR V5-A1 ==='
          curl -fsS --retry 4 --retry-delay 2 --retry-all-errors \
            "$BASE/v5/derivatives-feasibility?symbols=BTCUSDT%2CETHUSDT%2CSOLUSDT%2CBNBUSDT&period=5m" \
            > /tmp/v5.json

          python - <<'PY'
          import json
          d=json.load(open('/tmp/v5.json'))
          print('PHASE',d.get('phase'),d.get('status'),d.get('as_of'))
          print('CAUSALITY',json.dumps(d.get('causality_lock'),separators=(',',':')))
          for sym,v in d.get('data',{}).items():
              print('SYMBOL',sym)
              print(' CURRENT_OI',json.dumps(v.get('current_open_interest'),separators=(',',':')))
              for ds,windows in v.get('rest_history_probes',{}).items():
                  print(' REST',ds,json.dumps({k:{'ok':x.get('ok'),'status':x.get('status'),'n':x.get('n'),'first_time':x.get('first_time'),'last_time':x.get('last_time')} for k,x in windows.items()},separators=(',',':')))
              print(' ARCHIVE',json.dumps(v.get('official_public_archive_probes'),separators=(',',':')))
          PY
