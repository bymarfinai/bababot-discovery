name: Ratio Series Causal Workbook Audit

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Run faithful causal ratio-series test on 1D and 1H
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-production-b6a05.up.railway.app'
          PAIRS='["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT"]'

          echo '=== WAIT FOR RATIO-SERIES ENDPOINT ==='
          READY=0
          for i in $(seq 1 120); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              "$BASE/research/ratio-series?symbols=BTCUSDT&timeframe=1h&days=60&sample_limit=0" || true)
            if [ "$CODE" = '200' ]; then
              PHASE=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/probe.json')).get('phase',''))
          except Exception: print('')
          PY
          )
              if [ "$PHASE" = 'RATIO-SERIES-CAUSAL-1' ]; then READY=1; echo "ready probe=$i"; break; fi
            fi
            echo "probe $i http=$CODE"
            sleep 5
          done
          if [ "$READY" != '1' ]; then echo 'ratio-series endpoint not ready'; cat /tmp/probe.json || true; exit 1; fi

          echo '=== ENSURE EXACT 971D 1H + 1D DATA ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            -X POST -H 'Content-Type: application/json' \
            -d "{\"days\":971,\"pairs\":${PAIRS},\"timeframes\":[\"1h\",\"1d\"]}" \
            "$BASE/fetch-data"
          echo

          STATUS=''
          for i in $(seq 1 600); do
            curl -fsS --retry 4 --retry-delay 2 --retry-all-errors "$BASE/fetch-status" > /tmp/fetch-status.json
            STATUS=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/fetch-status.json')).get('fetch_state',{}).get('status',''))
          PY
          )
            if [ $((i % 10)) -eq 0 ]; then
              python - <<'PY'
          import json
          s=json.load(open('/tmp/fetch-status.json')).get('fetch_state',{})
          print('FETCH',s.get('status'),s.get('progress'),'candles=',s.get('total_candles'))
          PY
            fi
            if [ "$STATUS" = 'done' ]; then break; fi
            if [ "$STATUS" = 'error' ]; then cat /tmp/fetch-status.json; exit 1; fi
            sleep 5
          done
          if [ "$STATUS" != 'done' ]; then echo 'Fetch did not finish'; exit 1; fi

          echo '=== RUN FAITHFUL 1D ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            "$BASE/research/ratio-series?symbols=BTCUSDT%2CETHUSDT%2CSOLUSDT%2CBNBUSDT&timeframe=1d&days=971&sample_limit=0" \
            > /tmp/daily.json

          echo '=== RUN BABA-BOT-RELEVANT 1H ==='
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
            "$BASE/research/ratio-series?symbols=BTCUSDT%2CETHUSDT%2CSOLUSDT%2CBNBUSDT&timeframe=1h&days=971&sample_limit=0" \
            > /tmp/hourly.json

          python - <<'PY'
          import json
          for label,path in [('DAILY','/tmp/daily.json'),('HOURLY','/tmp/hourly.json')]:
              d=json.load(open(path))
              print(label+'_DEFINITION',json.dumps(d.get('definition'),separators=(',',':')))
              print(label+'_AGG',json.dumps(d.get('aggregate'),separators=(',',':')))
              print(label+'_PAIR',json.dumps({k:v.get('lookbacks') for k,v in d.get('by_pair',{}).items()},separators=(',',':')))
              print(label+'_ERRORS',json.dumps(d.get('errors'),separators=(',',':')))
          PY
