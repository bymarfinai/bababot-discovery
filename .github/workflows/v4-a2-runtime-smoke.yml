name: BTC Temporal A4.2 Rescue Local Refine

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a42:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run A4.2 local rescue refinement
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a42_rescue_local_refine.py
