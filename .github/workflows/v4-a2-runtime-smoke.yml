name: BTC Temporal A4 Post-Entry Rescue Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run A4 post-entry rescue engine
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a4_rescue_engine.py
