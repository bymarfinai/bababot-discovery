name: BTC Temporal A3 Offline Binance Run

on:
  push:
    paths:
      - '.github/workflows/v4-a2-runtime-smoke.yml'

jobs:
  temporal-a3-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run A3 offline from Binance Futures archives
        shell: bash
        run: |
          set -euo pipefail
          python btc_temporal_a3_offline.py
