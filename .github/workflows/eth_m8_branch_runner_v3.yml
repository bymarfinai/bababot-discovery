name: ETH M8 economic combination branch runner v3

on:
  push:
    branches:
      - eth-transfer-m8-economic-combination
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH M8 economic combination v3
        shell: bash
        run: |
          python -m py_compile research/eth_f85_f15_transfer_m8_economic_combination.py
          python -m py_compile research/eth_f85_f15_transfer_m8_economic_combination_v3.py
          python research/eth_f85_f15_transfer_m8_economic_combination_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-m8-economic-combination-v3
          path: |
            ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_M8_*
