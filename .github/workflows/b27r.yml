name: B27R
on:
  push:
    paths:
      - '.github/workflows/b27r.yml'
      - 'research/btc_london_ny_long_entry_opt_b27r.py'
      - 'research/btc_london_ny_long_entry_opt_b27r_runner.py'
      - 'BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Status.txt
          git commit -m 'ci: mark B27R runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_long_entry_opt_b27r.py research/btc_london_ny_long_entry_opt_b27r_runner.py
      - run: cd research && python btc_london_ny_long_entry_opt_b27r_runner.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Result.md BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Trades.csv BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Summary.csv BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_Selection.csv BTC_LONDON_NY_LONG_ENTRY_OPT_B27R_StatusCounts.csv
          git commit -m 'research: persist B27R London-NY long entry optimization result' || true
          git push
