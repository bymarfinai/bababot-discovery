name: B11 Atlas Descriptive Summary
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/b11_atlas_descriptive_summary.py'
      - '.github/workflows/b11-atlas-descriptive-summary.yml'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - run: python research/b11_atlas_descriptive_summary.py > B11_ATLAS_DESCRIPTIVE_Run.log 2>&1
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_MTF_LEVEL_ATLAS_B11_DESCRIPTIVE_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist B11 MTF descriptive summary"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
