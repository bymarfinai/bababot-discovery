name: ETH Economic-First E12L one-hour LONG character

on:
  push:
    branches:
      - eth-e12l-long-00-01wib-character
    paths:
      - '.eth-e12l-trigger'

jobs:
  e12l:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Economic-First E12L
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E12L_LONG_00_01WIB_CHARACTER_Run.log
          echo 'ETH Economic-First E12L one-hour LONG character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e12l_long_00_01wib_character.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e12l_long_00_01wib_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-economic-first-e12l-long-00-01wib-character
          path: ETH_ECONOMIC_FIRST_E12L_LONG_00_01WIB_CHARACTER_*
          if-no-files-found: warn
