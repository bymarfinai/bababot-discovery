name: B27ER BNB clean F95 external holdout

on:
  workflow_dispatch:
  push:
    branches:
      - bnb-session-native-clean-f95-b27er
    paths:
      - 'research/bnb_session_native_london_ny_long_m6_clean_f95_b27er.py'
      - 'BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Preregistration.md'
      - '.github/workflows/b27er-bnb-clean-f95-external.yml'

permissions:
  contents: write

jobs:
  clean_f95:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bnb-session-native-clean-f95-b27er
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27ER frozen clean F95 external holdout
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python research/bnb_session_native_london_ny_long_m6_clean_f95_b27er.py 2>&1 | tee BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27er-bnb-clean-f95-external
          path: |
            BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_*.csv
            BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_*.md
            BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_*.txt
            BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_*.log
          if-no-files-found: warn
      - name: Persist B27ER outputs
        if: steps.run.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Detail.csv \
                  BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Summary.csv \
                  BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Result.md \
                  BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Status.txt \
                  BNB_SESSION_NATIVE_LONDON_NY_LONG_M6_CLEAN_F95_B27ER_Run.log
          git commit -m 'persist B27ER BNB clean F95 external holdout' || exit 0
          git push origin HEAD:bnb-session-native-clean-f95-b27er
      - name: Fail on B27ER execution error
        if: steps.run.outcome != 'success'
        run: exit 1
