name: B27FQ BNB execution-duration geometry grid

on:
  push:
    branches:
      - bnb-execution-duration-grid-b27fq
    paths:
      - 'BNB_EXECUTION_DURATION_GRID_B27FQ_Preregistration.md'
      - 'research/bnb_execution_duration_grid_b27fq.py'
      - '.github/workflows/b27fq-bnb-execution-duration-grid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FQ execution-duration geometry grid
        run: python research/bnb_execution_duration_grid_b27fq.py | tee BNB_EXECUTION_DURATION_GRID_B27FQ_Run.log
      - name: Persist B27FQ outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_EXECUTION_DURATION_GRID_B27FQ_Detail.csv \
                  BNB_EXECUTION_DURATION_GRID_B27FQ_Summary.csv \
                  BNB_EXECUTION_DURATION_GRID_B27FQ_Duration_Summary.csv \
                  BNB_EXECUTION_DURATION_GRID_B27FQ_Result.md \
                  BNB_EXECUTION_DURATION_GRID_B27FQ_Status.txt \
                  BNB_EXECUTION_DURATION_GRID_B27FQ_Run.log
          git diff --cached --quiet || git commit -m "persist B27FQ BNB execution-duration geometry result"
          git push origin HEAD:bnb-execution-duration-grid-b27fq
