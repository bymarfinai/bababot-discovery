name: SOL Long 15UTC Participation A48

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_15utc_participation_anatomy_a48.py'
      - 'SOL_LONG_15UTC_PARTICIPATION_ANATOMY_A48_Preregistration.md'
      - '.github/workflows/sol-long-15utc-participation-a48.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a48:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A48 participation anatomy
        run: python research/sol_long_15utc_participation_anatomy_a48.py

      - name: Persist A48 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_PARTICIPATION_A48_TRADES.csv \
                  SOL_LONG_15UTC_PARTICIPATION_A48_FEATURES.csv \
                  SOL_LONG_15UTC_PARTICIPATION_A48_Result.md \
                  SOL_LONG_15UTC_PARTICIPATION_A48_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A48 15UTC participation anatomy'
          git pull --rebase origin research/sol-long-structure-a1-run
          git push origin HEAD:research/sol-long-structure-a1-run
