name: SOL Long 15UTC Confirmed Retest Anatomy A35
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [research/sol-long-structure-a1-run]
    paths:
      - 'research/sol_long_15utc_confirmed_retest_anatomy_a35.py'
      - 'SOL_LONG_15UTC_CONFIRMED_RETEST_ANATOMY_A35_Preregistration.md'
      - '.github/workflows/sol-long-15utc-confirmed-retest-anatomy-a35.yml'
jobs:
  a35:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy pyarrow requests
      - name: Run A35 confirmed-retest anatomy
        run: python research/sol_long_15utc_confirmed_retest_anatomy_a35.py
      - name: Persist A35 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_CONFIRMED_RETEST_ANATOMY_A35_*.md SOL_LONG_15UTC_CONFIRMED_RETEST_ANATOMY_A35_*.csv SOL_LONG_15UTC_CONFIRMED_RETEST_ANATOMY_A35_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A35 confirmed-retest anatomy'
          git push origin HEAD:research/sol-long-structure-a1-run
