name: SOL ORB Structure Detector v1

on:
  push:
    branches:
      - sol-orb-structure-detector-v1
    paths:
      - '.sol-orb-structure-detector-v1-trigger'
      - 'research/sol_orb_structure_detector_v1.py'
      - 'research/run_sol_orb_structure_detector_v1.py'
      - 'SOL_ORB_STRUCTURE_DETECTOR_V1_PREREG.md'
      - '.github/workflows/sol_orb_structure_detector_v1.yml'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run SOL ORB Structure Detector v1
        run: |
          set -euo pipefail
          python -m py_compile research/sol_orb_structure_detector_v1.py
          python -m py_compile research/run_sol_orb_structure_detector_v1.py
          python research/run_sol_orb_structure_detector_v1.py | tee SOL_ORB_STRUCTURE_DETECTOR_V1_Run.log
      - uses: actions/upload-artifact@v4
        with:
          name: sol-orb-structure-detector-v1
          path: SOL_ORB_STRUCTURE_DETECTOR_V1_*
          if-no-files-found: error
