name: BTC Strong Uptrend Lifecycle B22B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-strong-uptrend-lifecycle-b22b.yml'
      - 'research/btc_strong_uptrend_lifecycle_b22b.py'
      - 'BTC_STRONG_UPTREND_LIFECYCLE_B22B_Preregistration.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_STRONG_UPTREND_LIFECYCLE_B22B_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_STRONG_UPTREND_LIFECYCLE_B22B_Status.txt
          git commit -m "ci: mark B22B runner started" || true
          git push || true
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research/btc_strong_uptrend_lifecycle_b22b.py
      - name: Run B22B
        id: runb22b
        shell: bash
        run: |
          set +e
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_strong_uptrend_lifecycle_b22b.py 2>&1 | tee BTC_STRONG_UPTREND_LIFECYCLE_B22B_Run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit ${code}
      - name: Persist
        if: always()
        run: |
          git pull --rebase || true
          git add BTC_STRONG_UPTREND_LIFECYCLE_B22B_* || true
          if [ -f BTC_STRONG_UPTREND_LIFECYCLE_B22B_Result.md ]; then
            echo "COMPLETED run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} ended_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_STRONG_UPTREND_LIFECYCLE_B22B_Status.txt
          else
            echo "FAILED run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} ended_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ) exit_code=${{ steps.runb22b.outputs.exit_code }}" > BTC_STRONG_UPTREND_LIFECYCLE_B22B_Status.txt
          fi
          git add BTC_STRONG_UPTREND_LIFECYCLE_B22B_Status.txt BTC_STRONG_UPTREND_LIFECYCLE_B22B_Run.log || true
          git commit -m "research: persist B22B strong uptrend lifecycle result" || true
          git push || true
