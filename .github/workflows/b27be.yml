name: B27BE 24H causal regime SHORT atlas

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_4h_regime_short_atlas_b27be.py'
      - 'BTC_24H_4H_REGIME_SHORT_ATLAS_B27BE_Preregistration.md'
      - '.github/workflows/b27be.yml'
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_4h_regime_short_atlas_b27be.py
      - name: Run B27BE
        run: python research/btc_24h_4h_regime_short_atlas_b27be.py
      - name: Persist results on main push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_4H_REGIME_SHORT_ATLAS_B27BE_Result.md \
                  BTC_24H_4H_REGIME_SHORT_ATLAS_B27BE_Detail.csv \
                  BTC_24H_4H_REGIME_SHORT_ATLAS_B27BE_RegimeSummary.csv \
                  BTC_24H_4H_REGIME_SHORT_ATLAS_B27BE_ClockSummary.csv \
                  BTC_24H_4H_REGIME_SHORT_ATLAS_B27BE_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BE 24H regime SHORT atlas results'
            git push
          fi
