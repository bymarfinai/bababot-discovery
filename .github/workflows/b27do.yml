name: B27DO 4-zone hybrid exit

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_hybrid_exit_b27do.py'
      - 'BTC_F85_LONG_HYBRID_EXIT_B27DO_Preregistration.md'
      - '.github/workflows/b27do.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27DO
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_F85_LONG_HYBRID_EXIT_B27DO_Run.log
          echo 'B27DO run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_f85_long_hybrid_exit_b27do.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          if [ "$c" -eq 0 ]; then
            python research/btc_f85_long_hybrid_exit_b27do.py >> "$LOG" 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27do-results
          path: |
            BTC_F85_LONG_HYBRID_EXIT_B27DO_*
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_F85_LONG_HYBRID_EXIT_B27DO_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DO hybrid exit outputs'
            git push
          fi
      - name: Fail if script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
