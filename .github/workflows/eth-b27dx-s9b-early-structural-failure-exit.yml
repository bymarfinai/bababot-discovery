name: ETH B27DX S9B Early Structural Failure Exit

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S9B_EARLY_STRUCTURAL_FAILURE_EXIT_Preregistration.md'
      - 'research/eth_b27dx_s9b_early_structural_failure_exit.py'
      - '.github/workflows/eth-b27dx-s9b-early-structural-failure-exit.yml'

jobs:
  s9b:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_b27dx_s9b_early_structural_failure_exit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S9B_EARLY_STRUCTURAL_FAILURE_EXIT_*.md ETH_B27DX_S9B_EARLY_STRUCTURAL_FAILURE_EXIT_*.csv ETH_B27DX_S9B_EARLY_STRUCTURAL_FAILURE_EXIT_*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist ETH B27DX S9B results"
          ok=0
          for i in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
