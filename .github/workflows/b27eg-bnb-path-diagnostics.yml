name: B27EG BNB path diagnostics

on:
  push:
    branches:
      - bnb-transfer-b27ed-b27ef
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bnb-transfer-b27ed-b27ef
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27EG diagnostics only
        id: audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          LOG=BNB_F85_F15_TRANSFER_M4_PATH_DIAGNOSTICS_B27EG_Run.log
          echo 'B27EG BNB path diagnostics' > "$LOG"
          echo "commit=$(git rev-parse HEAD)" >> "$LOG"
          python -m py_compile research/bnb_f85_f15_transfer_m4_path_diagnostics_b27eg.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/bnb_f85_f15_transfer_m4_path_diagnostics_b27eg.py >> "$LOG" 2>&1
            rc=$?
          fi
          cat "$LOG"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27eg-bnb-path-diagnostics
          path: BNB_F85_F15_TRANSFER_M4_PATH_DIAGNOSTICS_B27EG_*
          if-no-files-found: warn
      - name: Persist B27EG outputs to experiment branch
        if: steps.audit.outputs.rc == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BNB_F85_F15_TRANSFER_M4_PATH_DIAGNOSTICS_B27EG_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27EG BNB path diagnostics'
            git push origin HEAD:bnb-transfer-b27ed-b27ef
          fi
      - name: Fail on B27EG execution error
        if: steps.audit.outputs.rc != '0'
        run: exit 1
