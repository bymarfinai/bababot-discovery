name: S5.7E Saturday Post-Rejection Expansion Stall Atlas

on:
  push:
    paths:
      - '.github/workflows/s57e-once.yml'
  workflow_dispatch:

jobs:
  s57e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run S5.7E
        env:
          S57E_OUT: s57e_out
        run: python research/s57e_post_rejection_expansion_stall_atlas.py
      - name: Upload S5.7E outputs
        uses: actions/upload-artifact@v4
        with:
          name: s57e-output
          path: s57e_out/
