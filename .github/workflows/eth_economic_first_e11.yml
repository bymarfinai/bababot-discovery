name: ETH Economic-First E11 market-state character

on:
  push:
    branches:
      - eth-economic-first-e11-market-state-character
    paths:
      - 'research/eth_economic_first_e11_market_state_character.py'
      - 'ETH_ECONOMIC_FIRST_E11_MARKET_STATE_CHARACTER_Preregistration.md'
      - '.github/workflows/eth_economic_first_e11.yml'
      - '.eth-economic-first-e11-trigger'
  workflow_dispatch:

jobs:
  e11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Economic-First E11
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E11_MARKET_STATE_CHARACTER_Run.log
          echo 'ETH Economic-First E11 market-state character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e11_market_state_character.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e11_market_state_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-economic-first-e11-market-state-character
          path: ETH_ECONOMIC_FIRST_E11_MARKET_STATE_CHARACTER_*
          if-no-files-found: warn
