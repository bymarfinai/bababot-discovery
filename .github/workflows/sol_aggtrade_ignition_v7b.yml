name: SOL AggTrade Ignition V7B
on:
  push:
    branches: [research/sol-aggtrade-ignition-v7b]
    paths:
      - 'research/sol_aggtrade_ignition_v7b.py'
      - 'research/SOL_AGGTRADE_IGNITION_V7B_PREREG.md'
      - '.github/workflows/sol_aggtrade_ignition_v7b.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn
      - run: python -m py_compile research/sol_aggtrade_ignition_v7b.py
      - run: python research/sol_aggtrade_ignition_v7b.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-aggtrade-ignition-v7b
          if-no-files-found: error
          path: |
            SOL_AGGTRADE_IGNITION_V7B_ParentEvents.csv
            SOL_AGGTRADE_IGNITION_V7B_DownloadDiagnostics.csv
            SOL_AGGTRADE_IGNITION_V7B_EventFeatures.csv
            SOL_AGGTRADE_IGNITION_V7B_Coverage.csv
            SOL_AGGTRADE_IGNITION_V7B_Forensics.csv
            SOL_AGGTRADE_IGNITION_V7B_StableDifferentiators.csv
            SOL_AGGTRADE_IGNITION_V7B_Grid2024.csv
            SOL_AGGTRADE_IGNITION_V7B_FeatureImportance.csv
            SOL_AGGTRADE_IGNITION_V7B_Selected.csv
            SOL_AGGTRADE_IGNITION_V7B_Result.md
            SOL_AGGTRADE_IGNITION_V7B_Status.txt
            research/SOL_AGGTRADE_IGNITION_V7B_PREREG.md
