name: BNB B41-S3 Q80 wall interaction character

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b41-s3-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b41-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2
      - name: Run B41-S3
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b41_s3_q80_wall_interaction_character.py
          python research/bnb_b41_s3_q80_wall_interaction_character.py | tee BNB_B41_S3_Q80_WALL_INTERACTION_CHARACTER_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b41-s3-q80-wall-interaction-character
          path: |
            BNB_B41_S3_Q80_WALL_INTERACTION_CHARACTER*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b41_s3
          for f in BNB_B41_S3_Q80_WALL_INTERACTION_CHARACTER*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b41_s3/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b41_s3
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B41-S3 Q80 wall interaction character'
            git pull --rebase origin bnb-b29-walkforward-reset
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
