name: SOL Derivatives State V4
on:
  push:
    branches: [research/sol-deriv-state-v4]
    paths:
      - 'research/sol_deriv_state_v4.py'
      - 'research/SOL_DERIV_STATE_V4_PREREG.md'
      - '.github/workflows/sol_deriv_state_v4.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn
      - run: python -m py_compile research/sol_deriv_state_v4.py
      - run: python research/sol_deriv_state_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-deriv-state-v4
          if-no-files-found: error
          path: |
            SOL_DERIV_STATE_V4_Results.csv
            SOL_DERIV_STATE_V4_Gate.csv
            SOL_DERIV_STATE_V4_Trades.csv
            SOL_DERIV_STATE_V4_Result.md
            SOL_DERIV_STATE_V4_Status.txt
            research/SOL_DERIV_STATE_V4_PREREG.md
