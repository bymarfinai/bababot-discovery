name: B27FE BNB hour04 structural discovery

on:
  push:
    branches:
      - bnb-hour04-structure-b27fe
    paths:
      - 'BNB_HOURLY_STRUCTURE_B27FE_Preregistration.md'
      - 'research/bnb_hourly_structure_b27fe.py'
      - '.github/workflows/b27fe-bnb-hour04-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FE structural discovery
        run: python research/bnb_hourly_structure_b27fe.py | tee BNB_HOURLY_STRUCTURE_B27FE_Run.log
      - name: Persist B27FE outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_HOURLY_STRUCTURE_B27FE_Detail.csv \
                  BNB_HOURLY_STRUCTURE_B27FE_Summary.csv \
                  BNB_HOURLY_STRUCTURE_B27FE_Result.md \
                  BNB_HOURLY_STRUCTURE_B27FE_Status.txt \
                  BNB_HOURLY_STRUCTURE_B27FE_Run.log
          git diff --cached --quiet || git commit -m "persist B27FE BNB hour04 structural result"
          git push origin HEAD:bnb-hour04-structure-b27fe
