name: ETH B27DX S3B Stop Geometry

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s3b-stop-geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s3b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S3B stop geometry
        run: python research/eth_b27dx_s3b_stop_geometry.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S3B_STOP_GEOMETRY_*.md ETH_B27DX_S3B_STOP_GEOMETRY_*.csv ETH_B27DX_S3B_STOP_GEOMETRY_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH B27DX S3B stop geometry results"
            git pull --rebase origin main
            git push
          fi
