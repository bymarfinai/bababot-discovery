name: B27FO BNB reference-duration geometry grid

on:
  push:
    branches:
      - bnb-reference-duration-grid-b27fo
    paths:
      - 'BNB_REFERENCE_DURATION_GRID_B27FO_Preregistration.md'
      - 'research/bnb_reference_duration_grid_b27fo.py'
      - '.github/workflows/b27fo-bnb-reference-duration-grid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FO reference-duration geometry grid
        run: python research/bnb_reference_duration_grid_b27fo.py | tee BNB_REFERENCE_DURATION_GRID_B27FO_Run.log
      - name: Persist B27FO outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_REFERENCE_DURATION_GRID_B27FO_Detail.csv \
                  BNB_REFERENCE_DURATION_GRID_B27FO_Summary.csv \
                  BNB_REFERENCE_DURATION_GRID_B27FO_Duration_Summary.csv \
                  BNB_REFERENCE_DURATION_GRID_B27FO_Result.md \
                  BNB_REFERENCE_DURATION_GRID_B27FO_Status.txt \
                  BNB_REFERENCE_DURATION_GRID_B27FO_Run.log
          git diff --cached --quiet || git commit -m "persist B27FO BNB reference-duration geometry result"
          git push origin HEAD:bnb-reference-duration-grid-b27fo
