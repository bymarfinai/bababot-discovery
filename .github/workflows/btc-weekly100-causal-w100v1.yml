name: BTC Weekly100 Causal W100V1 Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly100_causal_w100v1.py'
      - 'BTC_Weekly100_Causal_W100V1_Preregistration.md'
      - '.github/workflows/btc-weekly100-causal-w100v1.yml'

permissions:
  contents: write

concurrency:
  group: btc-weekly100-causal-w100v1
  cancel-in-progress: true

jobs:
  w100v1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run frozen W100-V1
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_weekly100_causal_w100v1.py > BTC_Weekly100_Causal_W100V1_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Weekly100_Causal_W100V1_EXIT_CODE.txt
          cat BTC_Weekly100_Causal_W100V1_Run.log
          exit $code
      - name: Persist artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Weekly100_Causal_W100V1_EXIT_CODE.txt BTC_Weekly100_Causal_W100V1_Run.log
          for f in BTC_Weekly100_Causal_W100V1_Result.md BTC_Weekly100_Causal_W100V1_Result.json BTC_Weekly100_Causal_W100V1_Trades.csv BTC_Weekly100_Causal_W100V1_August.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m weekly100-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_Weekly100_Causal_W100V1_EXIT_CODE.txt BTC_Weekly100_Causal_W100V1_Run.log
            for f in BTC_Weekly100_Causal_W100V1_Result.md BTC_Weekly100_Causal_W100V1_Result.json BTC_Weekly100_Causal_W100V1_Trades.csv BTC_Weekly100_Causal_W100V1_August.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist BTC weekly100 causal W100-V1"
            git push
          fi
      - name: Fail if runner failed
        if: steps.run.outcome == 'failure'
        run: exit 1
