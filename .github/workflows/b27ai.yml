name: B27AI short breakdown-reclaim exit

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_london_ny_short_breakdown_reclaim_b27ai.py'
      - 'BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Preregistration.md'
      - '.github/workflows/b27ai.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Compile
        run: python -m py_compile research/btc_london_ny_short_breakdown_reclaim_b27ai.py
      - name: Run B27AI
        run: cd research && python btc_london_ny_short_breakdown_reclaim_b27ai.py
      - name: Persist results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Result.md \
                  BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Trades.csv \
                  BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Summary.csv \
                  BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Status.txt
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: persist B27AI short breakdown-reclaim result'
            git push
          fi
