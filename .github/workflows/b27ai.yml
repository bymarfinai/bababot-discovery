name: B27AI short breakdown-reclaim exit

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_london_ny_short_breakdown_reclaim_b27ai.py'
      - 'BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Preregistration.md'
      - '.github/workflows/b27ai.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Compile
        run: python -m py_compile research/btc_london_ny_short_breakdown_reclaim_b27ai.py
      - name: Run and persist diagnostics
        shell: bash
        run: |
          set +e
          cd research
          python btc_london_ny_short_breakdown_reclaim_b27ai.py > ../BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_CI_LOG.txt 2>&1
          code=$?
          cd ..
          echo "EXIT_CODE=$code" >> BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_CI_LOG.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_CI_LOG.txt
          for f in \
            BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Result.md \
            BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Trades.csv \
            BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Summary.csv \
            BTC_LONDON_NY_SHORT_BREAKDOWN_RECLAIM_B27AI_Status.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'research: persist B27AI short breakdown-reclaim output'
            git push
          fi
          exit $code
