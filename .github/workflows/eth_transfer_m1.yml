name: ETH transfer M1 K1 OPP0 structural replication

on:
  push:
    branches: [main]
    paths:
      - 'ETH_F85_F15_TRANSFER_M1_K1_OPP0_Preregistration.md'
      - 'research/eth_f85_f15_transfer_m1_k1_opp0.py'
      - '.github/workflows/eth_transfer_m1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/eth_f85_f15_transfer_m1_k1_opp0.py'
      - '.github/workflows/eth_transfer_m1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH transfer M1 only
        id: run
        shell: bash
        run: |
          set +e
          LOG=ETH_F85_F15_TRANSFER_M1_K1_OPP0_Run.log
          echo 'ETH transfer M1 K1 OPP0 structural replication' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_f85_f15_transfer_m1_k1_opp0.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/eth_f85_f15_transfer_m1_k1_opp0.py >> "$LOG" 2>&1
            rc=$?
          fi
          cat "$LOG"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-transfer-m1-k1-opp0
          path: ETH_F85_F15_TRANSFER_M1_K1_OPP0_*
      - name: Persist M1 outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A ETH_F85_F15_TRANSFER_M1_K1_OPP0_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist ETH transfer M1 structural results'
            git push || true
          fi
      - name: Fail on M1 execution error
        if: steps.run.outputs.rc != '0'
        run: exit 1

# PR execution marker only; research rules unchanged.
