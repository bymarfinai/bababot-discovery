name: S5.7 Saturday Giveback Sequence Forensic

on:
  push:
    paths:
      - '.github/workflows/s57-once.yml'
      - 'research/s57_saturday_giveback_sequence_forensics.py'
  workflow_dispatch:

jobs:
  s57:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas requests
      - name: Run S5.7
        run: python research/s57_saturday_giveback_sequence_forensics.py
      - name: Upload S5.7 outputs
        uses: actions/upload-artifact@v4
        with:
          name: s57-output
          path: s57_out/
