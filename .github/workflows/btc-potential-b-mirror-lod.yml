name: BTC Potential B Mirror LOD

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_potential_b_mirror_lod_august_2026.py'
      - 'BTC_PotentialB_Mirror_LOD_August2026_Preregistration.md'
      - '.github/workflows/btc-potential-b-mirror-lod.yml'

permissions:
  contents: write

concurrency:
  group: btc-potential-b-mirror-lod
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Run frozen mirror
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_potential_b_mirror_lod_august_2026.py > BTC_PotentialB_Mirror_LOD_August2026_Run.log 2>&1
          code=$?
          echo "$code" > BTC_PotentialB_Mirror_LOD_August2026_EXIT_CODE.txt
          cat BTC_PotentialB_Mirror_LOD_August2026_Run.log
          exit $code
      - name: Persist artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_PotentialB_Mirror_LOD_August2026_EXIT_CODE.txt BTC_PotentialB_Mirror_LOD_August2026_Run.log
          for f in BTC_PotentialB_Mirror_LOD_August2026_Result.md BTC_PotentialB_Mirror_LOD_August2026_Result.json BTC_PotentialB_Mirror_LOD_August2026_Events.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m potential-b-mirror-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_PotentialB_Mirror_LOD_August2026_EXIT_CODE.txt BTC_PotentialB_Mirror_LOD_August2026_Run.log
            for f in BTC_PotentialB_Mirror_LOD_August2026_Result.md BTC_PotentialB_Mirror_LOD_August2026_Result.json BTC_PotentialB_Mirror_LOD_August2026_Events.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist Potential B LOD mirror result"
            git push
          fi
      - name: Fail if run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
