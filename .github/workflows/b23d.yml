name: B23D
on:
  push:
    paths:
      - '.github/workflows/b23d.yml'
      - 'research/btc_dynamic_condition_engine_b23d.py'
      - 'BTC_DYNAMIC_CONDITION_ENGINE_B23D_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_DYNAMIC_CONDITION_ENGINE_B23D_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_DYNAMIC_CONDITION_ENGINE_B23D_Status.txt
          git commit -m 'ci: mark B23D runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_dynamic_condition_engine_b23d.py
      - run: cd research && python btc_dynamic_condition_engine_b23d.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_DYNAMIC_CONDITION_ENGINE_B23D_Result.md BTC_DYNAMIC_CONDITION_ENGINE_B23D_Summary.csv BTC_DYNAMIC_CONDITION_ENGINE_B23D_Trades.csv
          git commit -m 'research: persist B23D same-timeframe result' || true
          git push
