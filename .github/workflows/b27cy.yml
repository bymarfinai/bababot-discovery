name: B27CY research

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_full_loser_late_only_b27cy.py'
      - 'BTC_24H_FULL_LOSER_LATE_ONLY_B27CY_Preregistration.md'
      - '.github/workflows/b27cy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - name: Execute B27CY
        id: exp
        shell: bash
        run: |
          set +e
          LOG=BTC_24H_FULL_LOSER_LATE_ONLY_B27CY_Run.log
          echo 'B27CY run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_24h_full_loser_late_only_b27cy.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_full_loser_late_only_b27cy.py >> "$LOG" 2>&1
            r=$?
          else
            r=$c
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist research outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_FULL_LOSER_LATE_ONLY_B27CY_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CY research outputs'
            git push
          fi
      - name: Fail on experiment error
        if: steps.exp.outputs.rc != '0'
        run: exit 1
