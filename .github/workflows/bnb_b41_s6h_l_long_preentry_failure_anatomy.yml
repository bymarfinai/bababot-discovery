name: BNB B41-S6H-L LONG pre-entry failure anatomy

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b41-s6h-l-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b41-s6h-l:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2
      - name: Run B41-S6H-L
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b41_s6h_l_long_preentry_failure_anatomy.py
          python research/bnb_b41_s6h_l_long_preentry_failure_anatomy.py | tee BNB_B41_S6H_L_LONG_PREENTRY_FAILURE_ANATOMY_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b41-s6h-l-long-preentry-failure-anatomy
          path: |
            BNB_B41_S6H_L_LONG_PREENTRY_FAILURE_ANATOMY*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b41_s6h_l
          for f in BNB_B41_S6H_L_LONG_PREENTRY_FAILURE_ANATOMY*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b41_s6h_l/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b41_s6h_l
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B41-S6H-L LONG pre-entry failure anatomy'
            git pull --rebase origin bnb-b29-walkforward-reset
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
