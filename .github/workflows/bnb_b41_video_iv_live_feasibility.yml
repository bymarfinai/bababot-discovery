name: BNB B41 video IV live feasibility

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b41-video-iv-trigger'

permissions:
  contents: write

jobs:
  video-iv-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2
      - name: Run live IV feasibility
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b41_video_iv_live_feasibility.py
          python research/bnb_b41_video_iv_live_feasibility.py | tee BNB_B41_VIDEO_IV_LIVE_FEASIBILITY_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b41-video-iv-live-feasibility
          path: |
            BNB_B41_VIDEO_IV_LIVE_FEASIBILITY*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b41_video_iv
          for f in BNB_B41_VIDEO_IV_LIVE_FEASIBILITY*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b41_video_iv/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b41_video_iv
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B41 video IV live feasibility'
            git pull --rebase origin bnb-b29-walkforward-reset
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
