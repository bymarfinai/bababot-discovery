name: F6.1 Friday FAILURE60 Exit Counterfactual
on:
  push:
    paths:
      - '.github/workflows/f61-once.yml'
  workflow_dispatch:
jobs:
  f61:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas requests
      - name: Run F6.1
        env:
          PYTHONPATH: research
        run: python research/f61_friday_failure60_exit.py
      - name: Upload F6.1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: f61-output
          path: f61_out/
