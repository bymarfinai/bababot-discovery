name: SOL Sell Structural Character V4 H4 Confluence

on:
  push:
    branches: [sol-sell-structure-character-v4-h4-confluence]
    paths:
      - 'research/sol_sell_structural_character_v4_h4_confluence.py'
      - 'research/SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_PREREG.md'
      - '.github/workflows/sol_sell_structural_character_v4_h4_confluence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h4-confluence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-sell-structure-character-v4-h4-confluence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Compile
        run: python -m py_compile research/sol_sell_structural_character_v4_h4_confluence.py
      - name: Run H4 confluence
        run: python research/sol_sell_structural_character_v4_h4_confluence.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-sell-structural-character-v4-h4-confluence
          if-no-files-found: error
          path: |
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_H4Zones.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_AnnotatedReturns.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_Resolved.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_YearSummary.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_Summary.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_Result.md
            SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_Status.txt
            research/SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_PREREG.md
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_*.csv SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_*.md SOL_SELL_STRUCTURAL_CHARACTER_V4_H4_CONFLUENCE_*.txt
          if git diff --cached --quiet; then
            echo "No generated changes to persist"
          else
            git commit -m "persist SOL H4 structural confluence v4 result"
            git push origin HEAD:sol-sell-structure-character-v4-h4-confluence
          fi
