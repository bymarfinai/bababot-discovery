name: B27FL BNB clock normalization audit

on:
  push:
    branches:
      - bnb-clock-normalization-audit-b27fl
    paths:
      - 'BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Preregistration.md'
      - 'research/bnb_clock_normalization_audit_b27fl.py'
      - '.github/workflows/b27fl-bnb-clock-normalization-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FL comparability normalization audit
        run: python research/bnb_clock_normalization_audit_b27fl.py | tee BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Run.log
      - name: Persist B27FL outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Diagnosis.csv \
                  BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Normalized_Detail.csv \
                  BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Normalized_Summary.csv \
                  BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Comparison.csv \
                  BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Result.md \
                  BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Status.txt \
                  BNB_CLOCK_NORMALIZATION_AUDIT_B27FL_Run.log
          git diff --cached --quiet || git commit -m "persist B27FL BNB clock normalization audit result"
          git push origin HEAD:bnb-clock-normalization-audit-b27fl
