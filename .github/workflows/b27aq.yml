name: B27AQ research audit
on:
  push:
    paths:
      - 'research/btc_london_ny_short_blind_f15_e20_profit_lock_b27aq.py'
      - 'BTC_LONDON_NY_SHORT_BLIND_F15_E20_PROFIT_LOCK_B27AQ_Preregistration.md'
      - '.github/workflows/b27aq.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_london_ny_short_blind_f15_e20_profit_lock_b27aq.py
      - run: cd research && python btc_london_ny_short_blind_f15_e20_profit_lock_b27aq.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_LONDON_NY_SHORT_BLIND_F15_E20_PROFIT_LOCK_B27AQ_Result.md BTC_LONDON_NY_SHORT_BLIND_F15_E20_PROFIT_LOCK_B27AQ_Trades.csv BTC_LONDON_NY_SHORT_BLIND_F15_E20_PROFIT_LOCK_B27AQ_Summary.csv BTC_LONDON_NY_SHORT_BLIND_F15_E20_PROFIT_LOCK_B27AQ_Status.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'research: persist B27AQ result'
            git push
          fi
