name: B27BZ direct-break retest SHORT anatomy

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_direct_break_retest_short_b27bz.py'
      - 'BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Preregistration.md'
      - '.github/workflows/b27bz.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_direct_break_retest_short_b27bz.py
      - name: Run B27BZ
        run: python research/btc_24h_direct_break_retest_short_b27bz.py
      - uses: actions/upload-artifact@v4
        with:
          name: b27bz-results
          path: |
            BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Result.md
            BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Events.csv
            BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Summary.csv
            BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Status.txt
      - name: Persist B27BZ outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Result.md \
                  BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Events.csv \
                  BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Summary.csv \
                  BTC_24H_DIRECT_BREAK_RETEST_SHORT_B27BZ_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BZ direct-break retest results'
            git push
          fi
