name: SOL LONG E10-Fail Guard A16

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_E10_FAIL_GUARD_A16_Preregistration.md'
      - 'research/sol_long_e10_fail_guard_a16.py'
      - '.github/workflows/sol-long-e10-fail-guard-a16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A16 E10 fail guard
        run: python research/sol_long_e10_fail_guard_a16.py
      - name: Persist A16 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_E10_FAIL_GUARD_A16_Result.md \
                  SOL_LONG_E10_FAIL_GUARD_A16_DEVELOPMENT.csv \
                  SOL_LONG_E10_FAIL_GUARD_A16_OOS.csv \
                  SOL_LONG_E10_FAIL_GUARD_A16_TRADES.csv \
                  SOL_LONG_E10_FAIL_GUARD_A16_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL E10 fail guard A16 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
