name: ETH Economic-First E9 cross-era character

on:
  push:
    branches:
      - eth-economic-first-e9-cross-era-character
    paths:
      - 'research/eth_economic_first_e9_cross_era_character.py'
      - 'ETH_ECONOMIC_FIRST_E9_CROSS_ERA_CHARACTER_Preregistration.md'
      - '.eth-economic-first-e9-trigger'
      - '.github/workflows/eth_economic_first_e9.yml'
  workflow_dispatch:

jobs:
  e9:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Economic-First E9
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E9_CROSS_ERA_CHARACTER_Run.log
          echo 'ETH Economic-First E9 cross-era character search' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e9_cross_era_character.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e9_cross_era_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-economic-first-e9-cross-era-character
          path: ETH_ECONOMIC_FIRST_E9_CROSS_ERA_CHARACTER_*
