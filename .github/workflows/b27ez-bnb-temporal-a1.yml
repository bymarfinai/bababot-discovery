name: B27EZ BNB temporal A1 discovery
on:
  push:
    branches: [bnb-temporal-a1-b27ez]
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bnb-temporal-a1-b27ez
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run research scan
        run: |
          python research/bnb_temporal_a1_b27ez.py | tee BNB_TEMPORAL_A1_B27EZ_Run.log
      - name: Persist research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_TEMPORAL_A1_B27EZ_*.csv BNB_TEMPORAL_A1_B27EZ_*.md BNB_TEMPORAL_A1_B27EZ_*.txt BNB_TEMPORAL_A1_B27EZ_Run.log
          git diff --cached --quiet || git commit -m "persist B27EZ BNB temporal A1 discovery"
          git push origin HEAD:bnb-temporal-a1-b27ez
