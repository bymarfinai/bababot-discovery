name: B27CE reclaim followthrough
on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_reclaim_followthrough_b27ce.py'
      - 'BTC_24H_RECLAIM_FOLLOWTHROUGH_B27CE_Preregistration.md'
      - '.github/workflows/b27ce.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run analysis
        shell: bash
        run: |
          python research/btc_24h_reclaim_followthrough_b27ce.py > BTC_24H_RECLAIM_FOLLOWTHROUGH_B27CE_Run.log 2>&1
      - name: Persist outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_RECLAIM_FOLLOWTHROUGH_B27CE_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CE reclaim followthrough anatomy outputs'
            git push
          fi
