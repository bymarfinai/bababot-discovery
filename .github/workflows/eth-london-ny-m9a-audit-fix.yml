name: ETH London NY M9A Audit Fix

on:
  push:
    paths:
      - 'ETH_LONDON_NY_M9A_AUDIT_FIX.md'
      - 'research/eth_london_ny_m9a_audit_fix.py'
      - '.github/workflows/eth-london-ny-m9a-audit-fix.yml'
  workflow_dispatch:

jobs:
  m9a:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Run M9A audit fix
        run: python research/eth_london_ny_m9a_audit_fix.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add ETH_LONDON_NY_M9A_AUDIT_FIX_Result.md ETH_LONDON_NY_M9A_AUDIT_FIX_Status.txt
          git commit -m "research: persist ETH London-NY M9A audit fix" || true
          git push
