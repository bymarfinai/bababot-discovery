name: SOL Long 15UTC PreFill Gate A47C

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_15utc_prefill_quality_gate_a47c.py'
      - 'SOL_LONG_15UTC_PREFILL_QUALITY_GATE_A47C_Preregistration.md'
      - '.github/workflows/sol-long-15utc-prefill-gate-a47c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a47c:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Patch A47C dict initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/sol_long_15utc_prefill_quality_gate_a47c.py')
          s = p.read_text(encoding='utf-8')
          old = 'seen = set()'
          new = 'seen = {}'
          if old not in s:
              raise SystemExit('expected A47C expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run A47C pre-fill quality gate
        run: python research/sol_long_15utc_prefill_quality_gate_a47c.py

      - name: Persist A47C outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/sol_long_15utc_prefill_quality_gate_a47c.py \
                  SOL_LONG_15UTC_PREFILL_GATE_A47C_DEVELOPMENT.csv \
                  SOL_LONG_15UTC_PREFILL_GATE_A47C_OOS.csv \
                  SOL_LONG_15UTC_PREFILL_GATE_A47C_TRADES.csv \
                  SOL_LONG_15UTC_PREFILL_GATE_A47C_Result.md \
                  SOL_LONG_15UTC_PREFILL_GATE_A47C_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A47C 15UTC pre-fill quality gate'
          git pull --rebase origin research/sol-long-structure-a1-run
          git push origin HEAD:research/sol-long-structure-a1-run
