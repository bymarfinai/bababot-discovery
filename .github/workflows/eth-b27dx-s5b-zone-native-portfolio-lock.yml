name: ETH B27DX S5B Zone Native Portfolio Lock

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s5b-zone-native-portfolio-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S5B zone-native portfolio lock
        run: python research/eth_b27dx_s5b_zone_native_portfolio_lock.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S5B_ZONE_NATIVE_PORTFOLIO_LOCK_*.md ETH_B27DX_S5B_ZONE_NATIVE_PORTFOLIO_LOCK_*.csv ETH_B27DX_S5B_ZONE_NATIVE_PORTFOLIO_LOCK_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH B27DX S5B zone-native portfolio results"
            git pull --rebase origin main
            git push
          fi
