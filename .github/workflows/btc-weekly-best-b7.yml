name: BTC Weekly Best-State B7
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_best_b7.py'
      - 'BTC_WEEKLY_BEST_B7_Preregistration.md'
      - '.github/workflows/btc-weekly-best-b7.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas requests
      - name: Run B7
        run: PYTHONPATH=research python research/btc_weekly_best_b7.py > BTC_WEEKLY_BEST_B7_Run.log 2>&1
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_BEST_B7_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC weekly best B7 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
