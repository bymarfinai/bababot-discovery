name: BNB B42-S1 1pct opportunity atlas

on:
  push:
    branches:
      - bnb-b42-vectorbt-opportunity-atlas
    paths:
      - '.bnb-b42-s1-trigger'

permissions:
  contents: write

jobs:
  b42-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research stack
        run: pip install vectorbt==1.1.0 plotly==5.24.1 pandas==3.0.5 numpy==2.4.6 requests==2.34.2
      - name: Run B42-S1
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b42_s1_opportunity_atlas.py
          python research/bnb_b42_s1_opportunity_atlas.py | tee BNB_B42_S1_OPPORTUNITY_ATLAS_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b42-s1-opportunity-atlas
          path: |
            BNB_B42_S1_OPPORTUNITY_ATLAS*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b42_s1
          for f in BNB_B42_S1_OPPORTUNITY_ATLAS*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b42_s1/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b42_s1
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B42-S1 opportunity atlas'
            git pull --rebase origin bnb-b42-vectorbt-opportunity-atlas
            git push origin HEAD:bnb-b42-vectorbt-opportunity-atlas
          fi
