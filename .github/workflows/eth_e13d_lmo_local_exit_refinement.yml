name: ETH E13D LMO local exit refinement

on:
  push:
    branches:
      - eth-e13d-lmo-local-exit-refinement
    paths:
      - '.eth-e13d-trigger'

jobs:
  e13d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH E13D
        run: |
          set -euo pipefail
          LOG=ETH_E13D_LMO_LOCAL_EXIT_REFINEMENT_Run.log
          echo 'ETH E13D LMO local exit refinement' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_e13d_lmo_local_exit_refinement.py 2>&1 | tee -a "$LOG"
          python research/eth_e13d_lmo_local_exit_refinement.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-e13d-lmo-local-exit-refinement
          path: ETH_E13D_LMO_LOCAL_EXIT_REFINEMENT_*
          if-no-files-found: warn
