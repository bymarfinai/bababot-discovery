name: BTC Dynamic Trend State Exit B22H

on:
  push:
    paths:
      - 'BTC_DYNAMIC_TREND_STATE_EXIT_B22H_Preregistration.md'
      - 'research/btc_dynamic_trend_state_exit_b22h.py'
      - '.github/workflows/btc-dynamic-trend-state-exit-b22h.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_DYNAMIC_TREND_STATE_EXIT_B22H_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_DYNAMIC_TREND_STATE_EXIT_B22H_Status.txt
          git commit -m 'ci: mark B22H runner started' || true
          git push || true
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research/btc_dynamic_trend_state_exit_b22h.py
      - name: Run B22H
        run: cd research && python btc_dynamic_trend_state_exit_b22h.py
      - name: Persist
        run: |
          git pull --rebase
          git add BTC_DYNAMIC_TREND_STATE_EXIT_B22H_Result.md BTC_DYNAMIC_TREND_STATE_EXIT_B22H_Summary.csv BTC_DYNAMIC_TREND_STATE_EXIT_B22H_Trades.csv
          git commit -m 'research: persist B22H dynamic trend state exit result' || true
          git push
