name: B27AB
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b27ab.yml'
      - 'research/btc_london_ny_dynamic_runner_b27ab.py'
jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_dynamic_runner_b27ab.py
      - run: cd research && python btc_london_ny_dynamic_runner_b27ab.py
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_DYNAMIC_RUNNER_B27AB_Result.md BTC_LONDON_NY_DYNAMIC_RUNNER_B27AB_Trades.csv BTC_LONDON_NY_DYNAMIC_RUNNER_B27AB_Summary.csv BTC_LONDON_NY_DYNAMIC_RUNNER_B27AB_Status.txt
          git commit -m 'research: persist B27AB result' || true
          git push
