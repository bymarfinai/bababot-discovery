name: BNB R4b StageC 2024 component persistence

on:
  push:
    branches:
      - bnb-r4b-cohort-plateau-screen
    paths:
      - '.bnb-r4b-stageC-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageC:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run BNB R4b 2024 frozen-plateau persistence
        run: python research/bnb_r4b_stageC_2024_component_persistence.py
      - name: Persist BNB R4b Stage C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_R4B_STAGEC_2024_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist BNB R4b stageC 2024 persistence"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-r4b-stageC-2024-component-persistence
          path: 'BNB_R4B_STAGEC_2024_*'
          if-no-files-found: error
