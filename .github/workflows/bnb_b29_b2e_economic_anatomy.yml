name: BNB B29 B2E frozen character economic anatomy

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b29-b2e-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  economic-anatomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2 scipy
      - name: Download immutable accepted A1 fingerprint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen_a1
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10336102957/zip" \
            -o /tmp/b29_a1_accepted.zip
          unzip -q /tmp/b29_a1_accepted.zip -d frozen_a1
          test -f frozen_a1/BNB_B29_A1_STRUCTURE_FINGERPRINT.csv.gz
          test "$(sha256sum frozen_a1/BNB_B29_A1_STRUCTURE_FINGERPRINT.csv.gz | awk '{print $1}')" = "eae8f278d45e7c3035b03900b30e315b16a241c1fbc5fda39231681390c25cfa"
      - name: Run preregistered B29 B2E economic anatomy
        run: |
          set -euo pipefail
          LOG=BNB_B29_B2E_ECONOMIC_ANATOMY_Run.log
          echo 'BNB B29 B2E frozen character economic anatomy' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'protocol=research/BNB_B29_B2E_ECONOMIC_ANATOMY_PREREGISTRATION.md' >> "$LOG"
          echo 'scientific_identity=B29-B2E-v1 frozen' >> "$LOG"
          python -m py_compile research/bnb_b29_b2e_economic_anatomy.py 2>&1 | tee -a "$LOG"
          python research/bnb_b29_b2e_economic_anatomy.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b29-b2e-economic-anatomy
          path: BNB_B29_B2E_ECONOMIC_ANATOMY*
          if-no-files-found: warn
      - name: Persist compact B2E evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b29_b2e
          for f in \
            BNB_B29_B2E_ECONOMIC_ANATOMY_Result.md \
            BNB_B29_B2E_ECONOMIC_ANATOMY_HorizonMetrics.csv \
            BNB_B29_B2E_ECONOMIC_ANATOMY_ThresholdMetrics.csv \
            BNB_B29_B2E_ECONOMIC_ANATOMY_EraThresholdMetrics.csv \
            BNB_B29_B2E_ECONOMIC_ANATOMY_WinLossMetrics.csv \
            BNB_B29_B2E_ECONOMIC_ANATOMY_EventPaths.csv.gz \
            BNB_B29_B2E_ECONOMIC_ANATOMY_Status.txt \
            BNB_B29_B2E_ECONOMIC_ANATOMY_Integrity.json \
            BNB_B29_B2E_ECONOMIC_ANATOMY_Run.log; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b29_b2e/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b29_b2e
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist frozen B29 B2E economic anatomy evidence'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
