name: B27BI registry maintenance

on:
  push:
    branches: [main]
    paths:
      - 'research/registry_insert_b27bi.py'
      - '.github/workflows/b27bi_registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/registry_insert_b27bi.py
      - name: Persist registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BABA_BOT_RESEARCH_RESULTS_REGISTRY.md
          if ! git diff --cached --quiet; then
            git commit -m 'record B27BI continuation-transition feature audit in registry'
            git push
          fi
