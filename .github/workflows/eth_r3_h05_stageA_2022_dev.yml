name: ETH R3 H05 stageA 2022 development freeze

on:
  push:
    branches:
      - eth-r3-h05-stability-retest
    paths:
      - '.r3-h05-stageA-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageA:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H05 Stage A
        run: python research/eth_r3_h05_stageA_2022_dev.py
      - name: Persist Stage A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H05_STAGEA_2022_DevGrid.csv ETH_R3_H05_STAGEA_Result.md ETH_R3_H05_STAGEA_Status.txt
          if [ -f ETH_R3_H05_STAGEA_FrozenDevCandidate.csv ]; then git add ETH_R3_H05_STAGEA_FrozenDevCandidate.csv; fi
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH R3 H05 stageA 2022 development freeze"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h05-stageA-2022-development-freeze
          path: |
            ETH_R3_H05_STAGEA_2022_DevGrid.csv
            ETH_R3_H05_STAGEA_FrozenDevCandidate.csv
            ETH_R3_H05_STAGEA_Result.md
            ETH_R3_H05_STAGEA_Status.txt
          if-no-files-found: warn
