name: ETH native London-NY clock Z1

on:
  push:
    branches: [eth-native-london-ny-clock-z1]
    paths:
      - '.eth-native-clock-z1-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH native London-NY clock discovery Z1
        id: z1
        shell: bash
        run: |
          set +e
          LOG=ETH_NATIVE_LONDON_NY_CLOCK_Z1_Run.log
          echo 'ETH native London-NY clock discovery Z1' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_native_london_ny_clock_z1.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/eth_native_london_ny_clock_z1.py >> "$LOG" 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat "$LOG"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-native-london-ny-clock-z1
          path: ETH_NATIVE_LONDON_NY_CLOCK_Z1_*
      - name: Fail on Z1 execution error
        if: steps.z1.outputs.rc != '0'
        run: exit 1
