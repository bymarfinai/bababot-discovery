name: ETH native London-NY retest breakout Z2

on:
  push:
    branches: [eth-native-london-ny-retest-breakout-z2]
    paths:
      - 'ETH_NATIVE_LONDON_NY_RETEST_BREAKOUT_Z2_Preregistration.md'
      - 'ETH_NATIVE_LONDON_NY_CLOCK_Z1_CANONICAL.txt'
      - 'research/eth_native_london_ny_retest_breakout_z2.py'
      - '.github/workflows/eth_london_ny_m1.yml'
      - '.eth-native-retest-breakout-z2-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH native retest breakout Z2
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_NATIVE_LONDON_NY_RETEST_BREAKOUT_Z2_Run.log
          echo 'ETH native London->NY retest-to-breakout Z2' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_native_london_ny_retest_breakout_z2.py 2>&1 | tee -a "$LOG"
          python research/eth_native_london_ny_retest_breakout_z2.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-native-london-ny-retest-breakout-z2
          path: |
            ETH_NATIVE_LONDON_NY_RETEST_BREAKOUT_Z2_*
            ETH_NATIVE_LONDON_NY_CLOCK_Z1_CANONICAL.txt
