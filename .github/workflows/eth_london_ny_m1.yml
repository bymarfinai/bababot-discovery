name: ETH native London-NY entry discovery Z4

on:
  push:
    branches: [eth-native-london-ny-entry-z4]
    paths:
      - 'ETH_NATIVE_LONDON_NY_ENTRY_Z4_Preregistration.md'
      - 'ETH_NATIVE_LONDON_NY_CLOCK_Z1_CANONICAL.txt'
      - 'research/eth_native_london_ny_retest_breakout_z2.py'
      - 'research/eth_native_london_ny_entry_z4.py'
      - 'research/eth_native_london_ny_entry_z4_corrected.py'
      - '.github/workflows/eth_london_ny_m1.yml'
      - '.eth-native-entry-z4-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH native entry discovery Z4
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_NATIVE_LONDON_NY_ENTRY_Z4_Run.log
          echo 'ETH native London->NY entry discovery Z4' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_native_london_ny_retest_breakout_z2.py research/eth_native_london_ny_entry_z4.py research/eth_native_london_ny_entry_z4_corrected.py 2>&1 | tee -a "$LOG"
          python research/eth_native_london_ny_entry_z4_corrected.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-native-london-ny-entry-z4
          path: |
            ETH_NATIVE_LONDON_NY_ENTRY_Z4_*
            ETH_NATIVE_LONDON_NY_CLOCK_Z1_CANONICAL.txt
