name: B27T
on:
  push:
    paths:
      - '.github/workflows/b27t.yml'
      - 'research/btc_london_ny_pressure_path_audit_b27t.py'
      - 'BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_Status.txt
          git commit -m 'ci: mark B27T runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_pressure_path_audit_b27t.py
      - run: cd research && python btc_london_ny_pressure_path_audit_b27t.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_Result.md BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_Paths.csv BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_StopSemantics.csv BTC_LONDON_NY_PRESSURE_PATH_AUDIT_B27T_Summary.csv
          git commit -m 'research: persist B27T pressure path audit result' || true
          git push
