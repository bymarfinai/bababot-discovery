name: SOL Structural Liquidity Discovery V1

on:
  push:
    branches: [sol-structural-liquidity-discovery-v1]
    paths:
      - 'research/sol_structural_liquidity_discovery_v1.py'
      - 'research/SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_PREREG.md'
      - '.github/workflows/sol_structural_liquidity_discovery_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-structural-liquidity-discovery-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Compile
        run: python -m py_compile research/sol_structural_liquidity_discovery_v1.py
      - name: Run structural liquidity discovery
        run: python research/sol_structural_liquidity_discovery_v1.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-structural-liquidity-discovery-v1
          if-no-files-found: error
          path: |
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_Candidates.csv
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_Sweeps.csv
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_FamilySummary.csv
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_YearSummary.csv
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_EnrichmentAudit.csv
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_Result.md
            SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_Status.txt
            research/SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_PREREG.md
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_*.csv SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_*.md SOL_STRUCTURAL_LIQUIDITY_DISCOVERY_V1_*.txt
          if git diff --cached --quiet; then
            echo "No generated changes to persist"
          else
            git commit -m "persist SOL structural liquidity discovery v1 result"
            git pull --rebase origin sol-structural-liquidity-discovery-v1
            git push origin HEAD:sol-structural-liquidity-discovery-v1
          fi
