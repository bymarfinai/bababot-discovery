name: S5.2B Saturday Selective Runner Protect

on:
  push:
    paths:
      - '.github/workflows/s52b-once.yml'
      - 'research/s52b_selective_runner_protect.py'
  workflow_dispatch:

jobs:
  s52b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas requests
      - name: Run S5.2B
        run: python research/s52b_selective_runner_protect.py
      - name: Upload S5.2B outputs
        uses: actions/upload-artifact@v4
        with:
          name: s52b-output
          path: s52b_out/
