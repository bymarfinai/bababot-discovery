name: BNB LONG Reset V1 H02 Untouched OOS

on:
  push:
    branches:
      - bnb-long-character-discovery-reset-v1
    paths:
      - '.bnb-reset-v1-h02-oos-trigger'

jobs:
  h02-oos:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen H02 untouched OOS validation
        run: |
          set -euo pipefail
          LOG=BNB_LONG_RESET_V1_H02_OOS_Run.log
          echo 'BNB LONG Reset V1 H02 untouched OOS validation' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/bnb_long_reset_v1_h02_oos.py 2>&1 | tee -a "$LOG"
          python research/bnb_long_reset_v1_h02_oos.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-long-reset-v1-h02-oos
          path: BNB_LONG_RESET_V1_H02_OOS_*
          if-no-files-found: error
