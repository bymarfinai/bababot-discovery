name: SOL Score4 Directional Fresh Holdout V1

on:
  push:
    branches: [sol-score4-directional-fresh-holdout-v1]
    paths:
      - '.github/workflows/sol_score4_directional_fresh_holdout_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-score4-directional-fresh-holdout-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Verify frozen evaluator compiles
        run: python -m py_compile research/sol_score4_directional_anatomy_v2.py
      - name: Run frozen fresh-holdout evaluator
        run: python research/sol_score4_directional_anatomy_v2.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-score4-directional-fresh-holdout-v1
          if-no-files-found: error
          path: |
            SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_*.csv
            SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_*.md
            SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_*.txt
            research/SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_PREREG.md
            research/SOL_SCORE4_DIRECTIONAL_FRESH_HOLDOUT_V1_AUDIT.md
      - name: Persist refreshed result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_*.csv SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_*.md SOL_SCORE4_DIRECTIONAL_ANATOMY_V2_*.txt
          if git diff --cached --quiet; then
            echo "No generated changes to persist"
          else
            git commit -m "persist score4 fresh holdout v1 result"
            git pull --rebase origin sol-score4-directional-fresh-holdout-v1
            git push origin HEAD:sol-score4-directional-fresh-holdout-v1
          fi
