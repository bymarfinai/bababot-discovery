name: B27AM short F15 post-H2 extension atlas

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_london_ny_short_f15_post_h2_extension_b27am.py'
      - 'BTC_LONDON_NY_SHORT_F15_POST_H2_EXTENSION_B27AM_Preregistration.md'
      - '.github/workflows/b27am.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Compile
        run: python -m py_compile research/btc_london_ny_short_f15_post_h2_extension_b27am.py
      - name: Run B27AM
        run: cd research && python btc_london_ny_short_f15_post_h2_extension_b27am.py
      - name: Persist results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase || true
          git add BTC_LONDON_NY_SHORT_F15_POST_H2_EXTENSION_B27AM_Result.md \
                  BTC_LONDON_NY_SHORT_F15_POST_H2_EXTENSION_B27AM_Paths.csv \
                  BTC_LONDON_NY_SHORT_F15_POST_H2_EXTENSION_B27AM_Summary.csv \
                  BTC_LONDON_NY_SHORT_F15_POST_H2_EXTENSION_B27AM_ExtensionAtlas.csv \
                  BTC_LONDON_NY_SHORT_F15_POST_H2_EXTENSION_B27AM_Status.txt || true
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: persist B27AM short post-H2 extension atlas'
            git push
          fi
