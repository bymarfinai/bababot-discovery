name: B27FH BNB hour10-13 structural sweep

on:
  push:
    branches:
      - bnb-hour10-13-sweep-b27fh
    paths:
      - 'BNB_HOURLY_SWEEP_B27FH_Preregistration.md'
      - 'research/bnb_hourly_sweep_b27fh.py'
      - '.github/workflows/b27fh-bnb-hour10-13-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FH structural sweep
        run: python research/bnb_hourly_sweep_b27fh.py | tee BNB_HOURLY_SWEEP_B27FH_Run.log
      - name: Persist B27FH outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_HOURLY_SWEEP_B27FH_Detail.csv \
                  BNB_HOURLY_SWEEP_B27FH_Summary.csv \
                  BNB_HOURLY_SWEEP_B27FH_Result.md \
                  BNB_HOURLY_SWEEP_B27FH_Status.txt \
                  BNB_HOURLY_SWEEP_B27FH_Run.log
          git diff --cached --quiet || git commit -m "persist B27FH BNB hour10-13 structural sweep result"
          git push origin HEAD:bnb-hour10-13-sweep-b27fh
