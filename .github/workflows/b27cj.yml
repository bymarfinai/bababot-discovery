name: B27CJ post-rebreak T10 hybrid
on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_post_rebreak_t10_hybrid_b27cj.py'
      - 'BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_Preregistration.md'
      - '.github/workflows/b27cj.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27CJ
        shell: bash
        run: |
          set +e
          echo "B27CJ run start" > BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_Run.log
          python -m py_compile research/btc_24h_post_rebreak_t10_hybrid_b27cj.py >> BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_Run.log 2>&1
          c=$?
          if [ "$c" -eq 0 ]; then
            python research/btc_24h_post_rebreak_t10_hybrid_b27cj.py >> BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_Run.log 2>&1
            r=$?
          else
            r=$c
          fi
          echo "compile_exit_code=$c" >> BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_Run.log
          echo "run_exit_code=$r" >> BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_Run.log
          exit 0
      - name: Persist outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_24H_POST_REBREAK_T10_HYBRID_B27CJ_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CJ T10 profit-lock hybrid outputs'
            git push
          fi
