name: F6.12 Analysis
on:
  push:
    paths:
      - 'research/f612_friday_fib_early5_cut.py'
      - '.github/workflows/f612-analysis.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: |
          cd research
          python f612_friday_fib_early5_cut.py
      - uses: actions/upload-artifact@v4
        with:
          name: f612-output
          path: research/f612_out/
