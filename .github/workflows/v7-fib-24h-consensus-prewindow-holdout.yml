name: V7 I FIB 24h Consensus Prewindow Holdout

on:
  push:
    branches: [v7-regime-failed-breakout]
    paths:
      - 'research/v7_i_fib_24h_consensus_prewindow_holdout.py'
      - '.github/workflows/v7-fib-24h-consensus-prewindow-holdout.yml'
  workflow_dispatch:

jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26.0' 'fastapi>=0.110'
      - name: Reconstruct earlier official archive and run frozen holdout
        run: PYTHONPATH=. python research/v7_i_fib_24h_consensus_prewindow_holdout.py
