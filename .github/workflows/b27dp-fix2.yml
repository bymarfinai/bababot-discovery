name: B27DP B27DO live-parity audit fix2

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_b27do_live_parity_audit_b27dp_fix2.py'
      - '.github/workflows/b27dp-fix2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27DP fix2
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_F85_LONG_B27DO_LIVE_PARITY_AUDIT_B27DP_Run.log
          echo 'B27DP fix2 run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_f85_long_b27do_live_parity_audit_b27dp_fix2.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          r=$c
          if [ "$c" -eq 0 ]; then
            for attempt in 1 2 3; do
              echo "audit_attempt=$attempt" >> "$LOG"
              python research/btc_f85_long_b27do_live_parity_audit_b27dp_fix2.py >> "$LOG" 2>&1
              r=$?
              if [ "$r" -eq 0 ]; then break; fi
              sleep 10
            done
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27dp-live-parity-audit-fix2
          path: |
            BTC_F85_LONG_B27DO_LIVE_PARITY_AUDIT_B27DP_*
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A BTC_F85_LONG_B27DO_LIVE_PARITY_AUDIT_B27DP_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DP live-parity audit outputs'
            git push || true
          fi
      - name: Fail if audit script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
