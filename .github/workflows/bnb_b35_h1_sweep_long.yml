name: BNB B35 1H sweep LONG timeframe hypothesis

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b35-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b35-h1-sweep:
    if: contains(github.event.head_commit.message, 'B35:')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2
      - name: Download immutable accepted A1 fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen_a1
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10336102957/zip" \
            -o /tmp/a1.zip
          unzip -q /tmp/a1.zip -d frozen_a1
          test -f frozen_a1/BNB_B29_A1_STRUCTURE_FINGERPRINT.csv.gz
      - name: Run preregistered B35
        run: |
          set -euo pipefail
          LOG=BNB_B35_H1_SWEEP_LONG_Run.log
          echo 'BNB B35 1H liquidity-sweep LONG timeframe hypothesis' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'protocol=research/BNB_B35_H1_SWEEP_LONG_PREREGISTRATION.md' >> "$LOG"
          echo 'identity=BNB_B35_H1_SWEEP_LONG_V1' >> "$LOG"
          python -m py_compile research/bnb_b35_h1_sweep_long.py 2>&1 | tee -a "$LOG"
          python research/bnb_b35_h1_sweep_long.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b35-h1-sweep-long
          path: |
            BNB_B35_H1_SWEEP_LONG*
          if-no-files-found: warn
      - name: Persist B35 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b35
          for f in BNB_B35_H1_SWEEP_LONG*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b35/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b35
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B35 1H sweep LONG evidence'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
