name: SOL Adaptive Structure Detector v1

on:
  push:
    branches:
      - sol-adaptive-structure-detector-v1
  workflow_dispatch:

jobs:
  adaptive-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scikit-learn scipy
      - name: Run frozen adaptive structure detector
        run: python research/run_sol_adaptive_structure_detector_v1_fast.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-adaptive-structure-detector-v1
          path: |
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_Events.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_WalkForwardPredictions.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_YearSummary.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_EdgeQuartiles.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_FeatureImportance.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_GateAudit.csv
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_Result.md
            SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_Status.txt
            research/SOL_ADAPTIVE_STRUCTURE_DETECTOR_V1_PREREG.md
