name: BTC Weekly Volume Memory B13
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_volume_memory_b13.py'
      - 'research/btc_weekly_volume_memory_b13_fast.py'
      - 'BTC_WEEKLY_VOLUME_MEMORY_B13_Preregistration.md'
      - '.github/workflows/btc-weekly-volume-memory-b13.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas requests scikit-learn
      - name: Compile B13 fast runner
        run: python -m py_compile research/btc_weekly_volume_memory_b13.py research/btc_weekly_volume_memory_b13_fast.py
      - name: Run B13 optimized
        shell: bash
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_weekly_volume_memory_b13_fast.py 2>&1 | tee BTC_WEEKLY_VOLUME_MEMORY_B13_Run.log
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_VOLUME_MEMORY_B13_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC weekly volume memory B13 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi