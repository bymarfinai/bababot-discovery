name: ETH Discovery 2 Reset E1 entry discovery

on:
  push:
    branches: [eth-discovery2-reset-e1-entry]
    paths:
      - 'ETH_DISCOVERY2_RESET_E1_ENTRY_Preregistration.md'
      - 'research/eth_discovery2_reset_e1_entry.py'
      - '.github/workflows/eth_discovery2_reset_e1.yml'
      - '.eth-discovery2-reset-e1-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Reset E1
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_RESET_E1_ENTRY_Run.log
          echo 'ETH Discovery 2 Reset E1 entry discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_reset_e1_entry.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_reset_e1_entry.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-reset-e1-entry
          path: |
            ETH_DISCOVERY2_RESET_E1_ENTRY_*
