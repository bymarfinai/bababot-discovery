name: ETH Discovery 2 Reset S1 auction repair

on:
  push:
    branches: [eth-discovery2-reset-s1-auction-repair]
    paths:
      - 'ETH_DISCOVERY2_RESET_S1_AUCTION_REPAIR_Preregistration.md'
      - 'research/eth_discovery2_reset_s1_auction_repair.py'
      - '.github/workflows/eth_discovery2_reset_s1.yml'
      - '.eth-discovery2-reset-s1-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Reset S1
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_RESET_S1_AUCTION_REPAIR_Run.log
          echo 'ETH Discovery 2 Reset S1 auction repair' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_reset_s1_auction_repair.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_reset_s1_auction_repair.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-reset-s1-auction-repair
          path: |
            ETH_DISCOVERY2_RESET_S1_AUCTION_REPAIR_*
