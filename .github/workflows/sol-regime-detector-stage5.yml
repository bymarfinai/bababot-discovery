name: SOL Regime Detector Stage 5

on:
  push:
    branches:
      - research/sol-regime-detector-stage5
    paths:
      - 'SOL_REGIME_DETECTOR_STAGE5_Preregistration.md'
      - 'research/sol_regime_detector_stage5.py'
      - '.github/workflows/sol-regime-detector-stage5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sol-regime-detector-stage5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen Stage 5 regime validation
        run: python research/sol_regime_detector_stage5.py
      - name: Persist Stage 5 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_REGIME_DETECTOR_STAGE5_Result.md \
            SOL_REGIME_DETECTOR_STAGE5_Labels_DEV.csv \
            SOL_REGIME_DETECTOR_STAGE5_Summary.csv \
            SOL_REGIME_DETECTOR_STAGE5_Blocks.csv \
            SOL_REGIME_DETECTOR_STAGE5_Audit.csv \
            SOL_REGIME_DETECTOR_STAGE5_Status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist SOL regime Stage 5 validation"
          git pull --rebase origin research/sol-regime-detector-stage5
          git push origin HEAD:research/sol-regime-detector-stage5
