name: BNB B29 A4 selective evidence gate

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b29-a4-trigger'

permissions:
  contents: write

jobs:
  selective-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scikit-learn
      - name: Run preregistered B29 A4 selective evidence gate
        run: |
          set -euo pipefail
          LOG=BNB_B29_A4_SELECTIVE_EVIDENCE_Run.log
          echo 'BNB B29 A4 selective evidence gate' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'protocol=research/BNB_B29_A4_SELECTIVE_EVIDENCE_GATE.md' >> "$LOG"
          echo 'scientific_identity=B29-A4-v1 frozen' >> "$LOG"
          python -m py_compile research/bnb_b29_a4_selective_evidence_gate.py 2>&1 | tee -a "$LOG"
          python research/bnb_b29_a4_selective_evidence_gate.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b29-a4-selective-evidence
          path: BNB_B29_A4_SELECTIVE_EVIDENCE*
          if-no-files-found: warn
      - name: Persist compact A4 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b29_a4
          for f in \
            BNB_B29_A4_SELECTIVE_EVIDENCE_Result.md \
            BNB_B29_A4_SELECTIVE_EVIDENCE_FoldMetrics.csv \
            BNB_B29_A4_SELECTIVE_EVIDENCE_HorizonMetrics.csv \
            BNB_B29_A4_SELECTIVE_EVIDENCE_Status.txt \
            BNB_B29_A4_SELECTIVE_EVIDENCE_Run.log; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b29_a4/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b29_a4
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B29 A4 selective evidence'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
