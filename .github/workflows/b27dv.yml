name: B27DV shadow parity audit

on:
  push:
    branches: [main]
    paths:
      - 'bbc_f85_f15_shadow.py'
      - 'research/btc_f85_long_b27dq_f15_short20_live_parity_b27dv.py'
      - 'BTC_F85_LONG_B27DQ_F15_SHORT20_LIVE_PARITY_B27DV_Preregistration.md'
      - '.github/workflows/b27dv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run shadow-only parity audit
        id: audit
        shell: bash
        run: |
          set +e
          LOG=BTC_F85_LONG_B27DQ_F15_SHORT20_LIVE_PARITY_B27DV_Run.log
          echo 'B27DV shadow audit; no exchange writes' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile bbc_f85_f15_shadow.py research/btc_f85_long_b27dq_f15_short20_live_parity_b27dv.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/btc_f85_long_b27dq_f15_short20_live_parity_b27dv.py >> "$LOG" 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27dv-shadow-audit
          path: BTC_F85_LONG_B27DQ_F15_SHORT20_LIVE_PARITY_B27DV_*
      - name: Persist audit outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A BTC_F85_LONG_B27DQ_F15_SHORT20_LIVE_PARITY_B27DV_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DV shadow audit outputs'
            git push || true
          fi
      - name: Fail on audit error
        if: steps.audit.outputs.rc != '0'
        run: exit 1
