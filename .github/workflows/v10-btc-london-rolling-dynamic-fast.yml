name: V10 F2 BTC London Rolling Dynamic Fast
on:
  push:
    branches: [v7-regime-failed-breakout]
    paths:
      - 'research/v10_f2_btc_london_rolling_dynamic_fast.py'
      - '.github/workflows/v10-btc-london-rolling-dynamic-fast.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q scikit-learn
      - run: PYTHONPATH=. python research/v10_f2_btc_london_rolling_dynamic_fast.py
