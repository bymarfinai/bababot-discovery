name: ETH R3 registered stability launcher

on:
  push:
    branches:
      - eth-r3-h05-stability-retest
      - eth-r3-h06-stability-retest
    paths:
      - 'research/eth_r3_h05_stageB_2023_test.py'
      - 'research/eth_r3_h05_stageC_exploratory_2024.py'
      - 'research/eth_r3_h06_stageA_2022_dev.py'
      - '.github/workflows/eth_r3_h05_stageB_2023_test.yml'
      - '.r3-h05-stageB-trigger'
      - '.r3-h05-stageC-exploratory-trigger'
      - '.r3-h06-stageA-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h06_stageA:
    if: ${{ github.ref_name == 'eth-r3-h06-stability-retest' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH R3 H06 Stage A
        run: python research/eth_r3_h06_stageA_2022_dev.py
      - name: Persist H06 Stage A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R3_H06_STAGEA_2022_DevGrid.csv ETH_R3_H06_STAGEA_Result.md ETH_R3_H06_STAGEA_Status.txt
          if [ -f ETH_R3_H06_STAGEA_FrozenDevCandidate.csv ]; then git add ETH_R3_H06_STAGEA_FrozenDevCandidate.csv; fi
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH R3 H06 stageA 2022 development freeze"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r3-h06-stageA-2022-development-freeze
          path: |
            ETH_R3_H06_STAGEA_2022_DevGrid.csv
            ETH_R3_H06_STAGEA_FrozenDevCandidate.csv
            ETH_R3_H06_STAGEA_Result.md
            ETH_R3_H06_STAGEA_Status.txt
          if-no-files-found: warn

  h05_stageB:
    if: ${{ github.ref_name == 'eth-r3-h05-stability-retest' && !contains(github.event.head_commit.message, 'exploratory 2024 diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_r3_h05_stageB_2023_test.py

  h05_stageC_exploratory_2024:
    if: ${{ github.ref_name == 'eth-r3-h05-stability-retest' && contains(github.event.head_commit.message, 'exploratory 2024 diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_r3_h05_stageC_exploratory_2024.py
