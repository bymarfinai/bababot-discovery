name: SOL LONG H2 Reclaim Anatomy A7

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_H2_RECLAIM_ANATOMY_A7_Preregistration.md'
      - 'research/sol_long_h2_reclaim_anatomy_a7.py'
      - '.github/workflows/sol-long-h2-reclaim-anatomy-a7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A7 H2 reclaim anatomy
        run: python research/sol_long_h2_reclaim_anatomy_a7.py
      - name: Persist A7 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_H2_RECLAIM_ANATOMY_A7_Result.md \
                  SOL_LONG_H2_RECLAIM_ANATOMY_A7_EPISODES.csv \
                  SOL_LONG_H2_RECLAIM_ANATOMY_A7_SUMMARY.csv \
                  SOL_LONG_H2_RECLAIM_ANATOMY_A7_SNAPSHOTS.csv \
                  SOL_LONG_H2_RECLAIM_ANATOMY_A7_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL H2 reclaim anatomy A7 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
