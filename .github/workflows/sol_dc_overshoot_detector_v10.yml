name: SOL DC Overshoot Detector V10
on:
  push:
    branches: [research/sol-dc-overshoot-detector-v10]
    paths:
      - 'research/sol_dc_overshoot_detector_v10.py'
      - 'research/SOL_DC_OVERSHOOT_DETECTOR_V10_PREREG.md'
      - '.github/workflows/sol_dc_overshoot_detector_v10.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn
      - run: python -m py_compile research/sol_dc_overshoot_detector_v10.py
      - run: python research/sol_dc_overshoot_detector_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-dc-overshoot-detector-v10
          if-no-files-found: error
          path: |
            SOL_DC_OVERSHOOT_DETECTOR_V10_Events.csv
            SOL_DC_OVERSHOOT_DETECTOR_V10_Grid2024.csv
            SOL_DC_OVERSHOOT_DETECTOR_V10_Transfer.csv
            SOL_DC_OVERSHOOT_DETECTOR_V10_Selected.csv
            SOL_DC_OVERSHOOT_DETECTOR_V10_Result.md
            SOL_DC_OVERSHOOT_DETECTOR_V10_Status.txt
            research/SOL_DC_OVERSHOOT_DETECTOR_V10_PREREG.md
