name: BTC Friday C8 Liquidation Feasibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_friday_c8_liquidation_feasibility.py'
      - '.github/workflows/btc-friday-c8-liquidation-feasibility.yml'

permissions:
  contents: write

concurrency:
  group: btc-friday-c8-liquidation-feasibility
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Probe official liquidation archives
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_friday_c8_liquidation_feasibility.py > BTC_Friday_C8_Liquidation_Feasibility_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Friday_C8_Liquidation_Feasibility_EXIT_CODE.txt
          cat BTC_Friday_C8_Liquidation_Feasibility_Run.log
          exit $code
      - name: Persist probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Friday_C8_Liquidation_Feasibility_EXIT_CODE.txt BTC_Friday_C8_Liquidation_Feasibility_Run.log
          for f in BTC_Friday_C8_Liquidation_Feasibility.md BTC_Friday_C8_Liquidation_Feasibility.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m c8-probe
            git pull --rebase origin main
            git stash pop
            git add BTC_Friday_C8_Liquidation_Feasibility_EXIT_CODE.txt BTC_Friday_C8_Liquidation_Feasibility_Run.log
            for f in BTC_Friday_C8_Liquidation_Feasibility.md BTC_Friday_C8_Liquidation_Feasibility.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist BTC Friday C8 liquidation feasibility"
            git push
          fi
      - name: Fail if probe failed
        if: steps.run.outcome == 'failure'
        run: exit 1
