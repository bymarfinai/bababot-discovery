name: SOL Long 15UTC Post-H05 Secondary Trigger A54

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_15utc_post_h05_secondary_trigger_a54.py'
      - 'SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_Preregistration.md'
      - '.github/workflows/sol-long-15utc-post-h05-secondary-trigger-a54.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a54:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A54 post-H05 secondary trigger anatomy
        run: python research/sol_long_15utc_post_h05_secondary_trigger_a54.py

      - name: Persist A54 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_COHORT.csv \
                  SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_SNAPSHOTS.csv \
                  SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_CANDIDATES.csv \
                  SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_DIAGNOSTICS.csv \
                  SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_Result.md \
                  SOL_LONG_15UTC_POST_H05_SECONDARY_TRIGGER_A54_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A54 post-H05 secondary trigger anatomy'
          git pull --rebase origin research/sol-long-structure-a1-run
          git push origin HEAD:research/sol-long-structure-a1-run
