name: V7 Exact Trigger Probe

on:
  push:
    paths:
      - '.github/workflows/v7-exact-trigger-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe exact canonical forensic endpoint
        env:
          URL: https://web-production-b6a05.up.railway.app/v7/legacy-trigger-forensic?days=971&end_ts_ms=1785852000000
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          url=os.environ['URL']
          last=None
          for i in range(60):
              try:
                  with urllib.request.urlopen(url,timeout=300) as r:
                      if r.status==200:
                          d=json.load(r)
                          print('V7_EXACT_RESULT',json.dumps(d,separators=(',',':')))
                          raise SystemExit(0)
              except Exception as e:
                  last=repr(e)
              time.sleep(5)
          raise SystemExit('endpoint_not_ready: '+str(last))
          PY
