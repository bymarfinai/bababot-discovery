name: B27AJ long lineage audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_london_ny_long_lineage_audit_b27aj.py'
      - 'BTC_LONDON_NY_LONG_LINEAGE_AUDIT_B27AJ_Preregistration.md'
      - '.github/workflows/b27aj.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python research/btc_london_ny_long_lineage_audit_b27aj.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_LONDON_NY_LONG_LINEAGE_AUDIT_B27AJ_Result.md BTC_LONDON_NY_LONG_LINEAGE_AUDIT_B27AJ_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'research: persist B27AJ long lineage audit'
            git push
          fi
