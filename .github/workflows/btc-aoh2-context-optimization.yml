name: BTC AOH2 Context Optimization

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_aoh2_asia_open_context_optimization.py'
      - 'BTC_AOH2_AsiaOpen_Context_Optimization_Preregistration.md'
      - '.github/workflows/btc-aoh2-context-optimization.yml'

permissions:
  contents: write

concurrency:
  group: btc-aoh2-context-optimization
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Run frozen AOH2 optimization
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_aoh2_asia_open_context_optimization.py > BTC_AOH2_AsiaOpen_Context_Optimization_Run.log 2>&1
          code=$?
          echo "$code" > BTC_AOH2_AsiaOpen_Context_Optimization_EXIT_CODE.txt
          cat BTC_AOH2_AsiaOpen_Context_Optimization_Run.log
          exit $code
      - name: Persist artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_AOH2_AsiaOpen_Context_Optimization_EXIT_CODE.txt BTC_AOH2_AsiaOpen_Context_Optimization_Run.log
          for f in BTC_AOH2_AsiaOpen_Context_Optimization_Result.md BTC_AOH2_AsiaOpen_Context_Optimization_Result.json BTC_AOH2_AsiaOpen_Context_Optimization_Grid.csv BTC_AOH2_AsiaOpen_Context_Optimization_August.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m aoh2-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_AOH2_AsiaOpen_Context_Optimization_EXIT_CODE.txt BTC_AOH2_AsiaOpen_Context_Optimization_Run.log
            for f in BTC_AOH2_AsiaOpen_Context_Optimization_Result.md BTC_AOH2_AsiaOpen_Context_Optimization_Result.json BTC_AOH2_AsiaOpen_Context_Optimization_Grid.csv BTC_AOH2_AsiaOpen_Context_Optimization_August.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist AOH2 context optimization"
            git push
          fi
      - name: Fail if run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
