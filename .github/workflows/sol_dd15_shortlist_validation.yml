name: SOL DD15 frozen shortlist validation

on:
  push:
    branches:
      - validation/sol-dd15-shortlist
    paths:
      - '.sol-dd15-validation-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run frozen shortlist validation
        run: python research/sol_dd15_shortlist_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-dd15-shortlist-validation
          path: SOL_DD15_SHORTLIST_VALIDATION_*
      - name: Persist validation result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_DD15_SHORTLIST_VALIDATION_*
          git commit -m "research(sol): persist DD15 shortlist validation"
          git push
