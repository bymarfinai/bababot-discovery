name: SOL Long 15UTC W10 Intrabar 1m A58

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - '.github/workflows/sol-long-15utc-w10-intrabar-1m-a58.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a58:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A58 W10 intrabar 1m anatomy
        run: python research/sol_long_15utc_w10_intrabar_1m_a58.py

      - name: Persist A58 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_WINDOWS.csv \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_STATES.csv \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_MOTIFS.csv \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_CONTINUOUS.csv \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_COVERAGE.csv \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_Result.md \
            SOL_LONG_15UTC_W10_INTRABAR_1M_A58_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: persist A58 W10 intrabar 1m anatomy"
            git push origin HEAD:research/sol-long-structure-a1-run
          fi
