name: BNB B38-S1 lower-TF demand rebound study

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b38-s1-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b38-s1-lower-tf-demand:
    if: contains(github.event.head_commit.message, 'B38-S1:')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2 matplotlib==3.10.6
      - name: Download immutable accepted A1 fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen_a1
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10336102957/zip" \
            -o /tmp/a1.zip
          unzip -q /tmp/a1.zip -d frozen_a1
          test -f frozen_a1/BNB_B29_A1_STRUCTURE_FINGERPRINT.csv.gz
      - name: Run B38-S1 lower-TF demand rebound study
        run: |
          set -euo pipefail
          LOG=BNB_B38_S1_LOWER_TF_DEMAND_REBOUND_Run.log
          echo 'BNB B38-S1 lower-TF demand rebound study' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'identity=BNB_B38_S1_LOWER_TF_DEMAND_REBOUND_V1' >> "$LOG"
          python -m py_compile research/bnb_b38_s1_lower_tf_demand_rebound.py 2>&1 | tee -a "$LOG"
          python research/bnb_b38_s1_lower_tf_demand_rebound.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b38-s1-lower-tf-demand-rebound
          path: |
            BNB_B38_S1_LOWER_TF_DEMAND_REBOUND*
          if-no-files-found: warn
      - name: Persist B38-S1 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b38_s1
          for f in BNB_B38_S1_LOWER_TF_DEMAND_REBOUND*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b38_s1/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b38_s1
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B38-S1 lower-TF demand evidence'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
