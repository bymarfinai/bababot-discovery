name: SOL Long 15UTC Reclaim Conversion A27
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [research/sol-long-structure-a1-run]
    paths:
      - 'research/sol_long_15utc_reclaim_conversion_a27.py'
      - 'SOL_LONG_15UTC_RECLAIM_CONVERSION_A27_Preregistration.md'
      - '.github/workflows/sol-long-15utc-reclaim-conversion-a27.yml'
jobs:
  a27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy pyarrow requests
      - name: Run A27 15UTC reclaim conversion
        run: python research/sol_long_15utc_reclaim_conversion_a27.py
      - name: Persist A27 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_RECLAIM_CONVERSION_A27_*.md SOL_LONG_15UTC_RECLAIM_CONVERSION_A27_*.csv SOL_LONG_15UTC_RECLAIM_CONVERSION_A27_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A27 15UTC reclaim conversion'
          git push origin HEAD:research/sol-long-structure-a1-run
