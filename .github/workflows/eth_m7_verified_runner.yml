name: ETH M7 verified target atlas

on:
  push:
    branches:
      - eth-transfer-m7-verified-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run verified ETH M7
        shell: bash
        run: |
          test -f research/eth_f85_f15_transfer_m7_target_atlas.py
          python -m py_compile research/eth_f85_f15_transfer_m7_target_atlas.py
          python research/eth_f85_f15_transfer_m7_target_atlas.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-m7-verified-target-atlas
          path: |
            ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_M7_*
