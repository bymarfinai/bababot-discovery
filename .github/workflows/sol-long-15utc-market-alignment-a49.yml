name: SOL Long 15UTC Market Alignment A49

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_15utc_market_alignment_anatomy_a49.py'
      - 'SOL_LONG_15UTC_MARKET_ALIGNMENT_A49_Preregistration.md'
      - '.github/workflows/sol-long-15utc-market-alignment-a49.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a49:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A49 market alignment anatomy
        run: python research/sol_long_15utc_market_alignment_anatomy_a49.py

      - name: Persist A49 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_MARKET_ALIGNMENT_A49_TRADES.csv \
                  SOL_LONG_15UTC_MARKET_ALIGNMENT_A49_FEATURES.csv \
                  SOL_LONG_15UTC_MARKET_ALIGNMENT_A49_Result.md \
                  SOL_LONG_15UTC_MARKET_ALIGNMENT_A49_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A49 15UTC market alignment anatomy'
          git pull --rebase origin research/sol-long-structure-a1-run
          git push origin HEAD:research/sol-long-structure-a1-run
