name: ETH F85 LONG Exact Transplant E1

on:
  push:
    branches:
      - research/eth-f85-long-exact-transplant-e1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-e1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eth-f85-long-exact-transplant-e1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run frozen ETH exact transplant
        run: |
          python research/eth_f85_long_exact_transplant_e1.py 2>&1 | tee ETH_F85_LONG_EXACT_TRANSPLANT_E1_Run.log

      - name: Persist result outputs to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Result.md \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Summary.csv \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_ZoneSummary.csv \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Trades.csv \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Sensitivity.csv \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Status.txt \
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Run.log
          git commit -m "persist ETH F85 LONG exact transplant E1 outputs"
          git push origin HEAD:research/eth-f85-long-exact-transplant-e1

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eth-f85-long-exact-transplant-e1
          path: |
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Result.md
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Summary.csv
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_ZoneSummary.csv
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Trades.csv
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Sensitivity.csv
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Status.txt
            ETH_F85_LONG_EXACT_TRANSPLANT_E1_Run.log
