name: ETH Economic-First E5 strength bands

on:
  push:
    branches: [eth-economic-first-e5-e2-strength-bands]
    paths:
      - 'ETH_ECONOMIC_FIRST_E5_E2_STRENGTH_BANDS_Preregistration.md'
      - 'research/eth_economic_first_e5_e2_strength_bands.py'
      - '.github/workflows/eth_economic_first_e5.yml'
      - '.eth-economic-first-e5-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Economic-First E5
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E5_E2_STRENGTH_BANDS_Run.log
          echo 'ETH Economic-First E5 E2 strength-band regime map' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e5_e2_strength_bands.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e5_e2_strength_bands.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-economic-first-e5-e2-strength-bands
          path: |
            ETH_ECONOMIC_FIRST_E5_E2_STRENGTH_BANDS_*
