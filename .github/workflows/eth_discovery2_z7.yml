name: ETH Discovery 2 Z7 checkpoint harvest

on:
  push:
    branches: [eth-discovery2-z7-checkpoint-harvest]
    paths:
      - 'ETH_DISCOVERY2_Z7_CHECKPOINT_HARVEST_Preregistration.md'
      - 'research/eth_discovery2_z7_checkpoint_harvest.py'
      - '.github/workflows/eth_discovery2_z7.yml'
      - '.eth-discovery2-z7-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Z7
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_Z7_CHECKPOINT_HARVEST_Run.log
          echo 'ETH Discovery 2 Z7 checkpoint harvest' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_z7_checkpoint_harvest.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_z7_checkpoint_harvest.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-z7-checkpoint-harvest
          path: |
            ETH_DISCOVERY2_Z7_CHECKPOINT_HARVEST_*
