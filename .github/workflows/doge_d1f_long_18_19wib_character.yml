name: DOGE D1F 18-19 WIB LONG character

on:
  push:
    branches:
      - doge-d1f-long-18-19wib-character
    paths:
      - '.doge-d1f-trigger'
  workflow_dispatch:

jobs:
  doge-d1f:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered DOGE D1F
        run: |
          set -euo pipefail
          LOG=DOGE_D1F_LONG_18_19WIB_CHARACTER_Run.log
          echo 'DOGE D1F 18:00-19:00 WIB LONG pair-native character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/doge_d1f_long_18_19wib_character.py 2>&1 | tee -a "$LOG"
          python research/doge_d1f_long_18_19wib_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: doge-d1f-long-18-19wib-character
          path: DOGE_D1F_LONG_18_19WIB_CHARACTER_*
          if-no-files-found: warn
