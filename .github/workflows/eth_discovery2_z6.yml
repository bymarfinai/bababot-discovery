name: ETH Discovery 2 Z6 money geometry

on:
  push:
    branches: [eth-discovery2-z6-money-geometry]
    paths:
      - 'ETH_DISCOVERY2_Z6_MONEY_GEOMETRY_Preregistration.md'
      - 'research/eth_discovery2_z6_money_geometry.py'
      - 'research/eth_discovery2_z6_money_geometry_corrected.py'
      - '.github/workflows/eth_discovery2_z6.yml'
      - '.eth-discovery2-z6-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Discovery 2 Z6
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_DISCOVERY2_Z6_MONEY_GEOMETRY_Run.log
          echo 'ETH Discovery 2 Z6 money geometry' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_discovery2_z6_money_geometry.py research/eth_discovery2_z6_money_geometry_corrected.py 2>&1 | tee -a "$LOG"
          python research/eth_discovery2_z6_money_geometry_corrected.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-discovery2-z6-money-geometry
          path: |
            ETH_DISCOVERY2_Z6_MONEY_GEOMETRY_*
