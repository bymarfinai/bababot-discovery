name: BNB R4b StageA 2022 component freeze

on:
  push:
    branches:
      - bnb-r4b-cohort-plateau-screen
    paths:
      - '.bnb-r4b-stageA-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageA:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run BNB R4b 2022 connected-component freeze
        run: python research/bnb_r4b_component_stageA_2022_freeze.py
      - name: Persist BNB R4b Stage A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_R4B_STAGEA_2022_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist BNB R4b stageA 2022 component freeze"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-r4b-stageA-2022-component-freeze
          path: 'BNB_R4B_STAGEA_2022_*'
          if-no-files-found: error
