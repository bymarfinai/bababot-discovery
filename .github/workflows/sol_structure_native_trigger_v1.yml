name: SOL Structure Native Trigger V1

on:
  push:
    branches: [sol-structure-native-trigger-v1]
    paths:
      - 'research/sol_structure_native_trigger_v1.py'
      - 'research/SOL_STRUCTURE_NATIVE_TRIGGER_V1_PREREG.md'
      - '.github/workflows/sol_structure_native_trigger_v1.yml'
  workflow_dispatch:

jobs:
  native-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Compile frozen native-trigger detector
        run: python -m py_compile research/sol_structure_native_trigger_v1.py
      - name: Run frozen native-trigger detector
        run: python research/sol_structure_native_trigger_v1.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-structure-native-trigger-v1
          if-no-files-found: error
          path: |
            SOL_STRUCTURE_NATIVE_TRIGGER_V1_SetupEvents.csv
            SOL_STRUCTURE_NATIVE_TRIGGER_V1_TriggeredTrades.csv
            SOL_STRUCTURE_NATIVE_TRIGGER_V1_Summary.csv
            SOL_STRUCTURE_NATIVE_TRIGGER_V1_YearSummary.csv
            SOL_STRUCTURE_NATIVE_TRIGGER_V1_Result.md
            SOL_STRUCTURE_NATIVE_TRIGGER_V1_Status.txt
            research/SOL_STRUCTURE_NATIVE_TRIGGER_V1_PREREG.md
