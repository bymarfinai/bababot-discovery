name: B27FR BNB causal P10 entry economics

on:
  push:
    branches:
      - bnb-causal-p10-entry-economics-b27fr
    paths:
      - 'BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Preregistration.md'
      - 'research/bnb_causal_p10_entry_economics_b27fr.py'
      - '.github/workflows/b27fr-bnb-causal-p10-entry-economics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FR causal P10 entry economics
        run: python research/bnb_causal_p10_entry_economics_b27fr.py | tee BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Run.log
      - name: Persist B27FR outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Trades.csv \
                  BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Economics.csv \
                  BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Yearly.csv \
                  BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Exit_Reasons.csv \
                  BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Result.md \
                  BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Status.txt \
                  BNB_CAUSAL_P10_ENTRY_ECONOMICS_B27FR_Run.log
          git diff --cached --quiet || git commit -m "persist B27FR BNB causal P10 entry economics result"
          git push origin HEAD:bnb-causal-p10-entry-economics-b27fr
