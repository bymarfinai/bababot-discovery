name: BTC Weekly Winner Loser B14
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_winner_loser_b14.py'
      - 'BTC_WEEKLY_WINNER_LOSER_B14_Preregistration.md'
      - '.github/workflows/btc-weekly-winner-loser-b14.yml'
permissions:
  contents: write
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas requests scikit-learn
      - name: Compile B14
        run: python -m py_compile research/btc_weekly_winner_loser_b14.py
      - name: Run B14
        shell: bash
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_weekly_winner_loser_b14.py 2>&1 | tee BTC_WEEKLY_WINNER_LOSER_B14_Run.log
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_WINNER_LOSER_B14_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC winner-vs-loser fingerprint B14 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
