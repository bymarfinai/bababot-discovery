name: B23G
on:
  push:
    paths:
      - '.github/workflows/b23g.yml'
      - 'research/btc_first_green_after_cross_b23g.py'
      - 'BTC_FIRST_GREEN_AFTER_CROSS_B23G_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_FIRST_GREEN_AFTER_CROSS_B23G_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_FIRST_GREEN_AFTER_CROSS_B23G_Status.txt
          git commit -m 'ci: mark B23G runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_first_green_after_cross_b23g.py
      - run: cd research && python btc_first_green_after_cross_b23g.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_FIRST_GREEN_AFTER_CROSS_B23G_Result.md BTC_FIRST_GREEN_AFTER_CROSS_B23G_Summary.csv BTC_FIRST_GREEN_AFTER_CROSS_B23G_Trades.csv BTC_FIRST_GREEN_AFTER_CROSS_B23G_Cycles.csv
          git commit -m 'research: persist B23G first-green-after-cross result' || true
          git push
# trigger
