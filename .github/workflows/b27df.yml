# no-semantic trigger
name: B27DF F85 long zone filter screen
on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_zone_filter_b27df.py'
      - '.github/workflows/b27df.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27DF
        run: |
          set +e
          LOG=BTC_F85_LONG_ZONE_FILTER_B27DF_Run.log
          echo 'B27DF run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python research/btc_f85_long_zone_filter_b27df.py >> "$LOG" 2>&1
          RC=$?
          echo "run_exit_code=$RC" >> "$LOG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_F85_LONG_ZONE_FILTER_B27DF_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DF F85 long zone filter outputs'
            git push
          fi
          exit $RC
