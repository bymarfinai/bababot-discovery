name: ETH Economic-First E3 drive strength

on:
  push:
    branches: [eth-economic-first-e3-drive-strength]
    paths:
      - 'ETH_ECONOMIC_FIRST_E3_DRIVE_STRENGTH_Preregistration.md'
      - 'research/eth_economic_first_e3_drive_strength.py'
      - '.github/workflows/eth_economic_first_e3.yml'
      - '.eth-economic-first-e3-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered ETH Economic-First E3
        shell: bash
        run: |
          set -euo pipefail
          LOG=ETH_ECONOMIC_FIRST_E3_DRIVE_STRENGTH_Run.log
          echo 'ETH Economic-First E3 drive strength' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_economic_first_e3_drive_strength.py 2>&1 | tee -a "$LOG"
          python research/eth_economic_first_e3_drive_strength.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-economic-first-e3-drive-strength
          path: |
            ETH_ECONOMIC_FIRST_E3_DRIVE_STRENGTH_*
