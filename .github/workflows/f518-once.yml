name: F5.18 Friday Slow-Health Shadow

on:
  push:
    paths:
      - '.github/workflows/f518-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f518:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run F5.18 frozen slow-health shadow
        working-directory: research
        run: python f518_slow_health_shadow.py
      - name: Upload F5.18 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f518-output
          path: |
            research/f518_result.json
            research/f518_rows.csv
          if-no-files-found: ignore
