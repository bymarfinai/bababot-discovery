name: S6.5 Saturday Friday D3 Transfer
on:
  push:
    paths:
      - 'research/s65_saturday_friday_d3_transfer.py'
      - '.github/workflows/s65-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mark workflow start
        run: |
          printf 'S6.5 workflow started from %s\n' "$GITHUB_SHA" > BTC_Temporal_Saturday_S65_WORKFLOW_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Temporal_Saturday_S65_WORKFLOW_STARTED.txt
          git diff --cached --quiet || git commit -m "ci: mark Saturday S6.5 workflow start"
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Run S6.5 with persisted log
        shell: bash
        run: |
          set +e
          cd research
          S65_OUT=s65_out python s65_saturday_friday_d3_transfer.py > ../S65_RUN.log 2>&1
          rc=$?
          cd ..
          cat S65_RUN.log
          printf '%s\n' "$rc" > S65_EXIT_CODE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            cp research/s65_out/S6.5_CHECKPOINT.md BTC_Temporal_Saturday_S65_Friday_D3_Transfer_Checkpoint.md
            cp research/s65_out/s65_summary.json BTC_Temporal_Saturday_S65_Friday_D3_Transfer_Summary.json
            rm -f BTC_Temporal_Saturday_S65_ERROR.log
            git add BTC_Temporal_Saturday_S65_Friday_D3_Transfer_Checkpoint.md BTC_Temporal_Saturday_S65_Friday_D3_Transfer_Summary.json S65_EXIT_CODE.txt
            git add -u BTC_Temporal_Saturday_S65_ERROR.log 2>/dev/null || true
            git diff --cached --quiet || git commit -m "research: persist Saturday S6.5 Friday D3 transfer"
          else
            cp S65_RUN.log BTC_Temporal_Saturday_S65_ERROR.log
            git add BTC_Temporal_Saturday_S65_ERROR.log S65_EXIT_CODE.txt
            git diff --cached --quiet || git commit -m "ci: persist Saturday S6.5 traceback"
          fi
          git push
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s65-output
          path: |
            S65_RUN.log
            S65_EXIT_CODE.txt
            research/s65_out/S6.5_CHECKPOINT.md
            research/s65_out/s65_summary.json
            research/s65_out/s65_rows.csv
