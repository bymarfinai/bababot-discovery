name: SOL Sell Structural Character V3 Separation

on:
  push:
    branches: [sol-sell-structure-character-v3-separation]
    paths:
      - 'research/sol_sell_structural_character_v3_separation.py'
      - 'research/SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_PREREG.md'
      - '.github/workflows/sol_sell_structural_character_v3_separation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-sell-structure-character-v3-separation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Compile
        run: python -m py_compile research/sol_sell_structural_character_v3_separation.py
      - name: Run separation
        run: python research/sol_sell_structural_character_v3_separation.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-sell-structural-character-v3-separation
          if-no-files-found: error
          path: |
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_Thresholds.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_EligibleCandidates.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_SelectedDerivationCases.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_SelectedConfirmationCases.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_ConfirmationYearSummary.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_Summary.csv
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_Result.md
            SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_Status.txt
            research/SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_PREREG.md
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_*.csv SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_*.md SOL_SELL_STRUCTURAL_CHARACTER_V3_SEPARATION_*.txt
          if git diff --cached --quiet; then
            echo "No generated changes to persist"
          else
            git commit -m "persist SOL structural separation v3 result"
            git push origin HEAD:sol-sell-structure-character-v3-separation
          fi
