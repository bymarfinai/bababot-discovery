name: B23E
on:
  push:
    paths:
      - '.github/workflows/b23e.yml'
      - 'research/btc_crossover_cycle_entry_b23e.py'
      - 'BTC_CROSSOVER_CYCLE_ENTRY_B23E_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_CROSSOVER_CYCLE_ENTRY_B23E_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_CROSSOVER_CYCLE_ENTRY_B23E_Status.txt
          git commit -m 'ci: mark B23E runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_crossover_cycle_entry_b23e.py
      - run: cd research && python btc_crossover_cycle_entry_b23e.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_CROSSOVER_CYCLE_ENTRY_B23E_Result.md BTC_CROSSOVER_CYCLE_ENTRY_B23E_Summary.csv BTC_CROSSOVER_CYCLE_ENTRY_B23E_Trades.csv
          git commit -m 'research: persist B23E crossover-cycle result' || true
          git push
