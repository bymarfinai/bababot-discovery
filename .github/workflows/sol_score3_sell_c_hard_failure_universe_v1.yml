name: SOL Missing-C Hard-Failure Universe V1

on:
  push:
    branches: [sol-score3-sell-c-hard-failure-universe-v1]
    paths:
      - 'research/sol_score3_sell_c_hard_failure_universe_v1.py'
      - 'research/SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_PREREG.md'
      - '.github/workflows/sol_score3_sell_c_hard_failure_universe_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol-score3-sell-c-hard-failure-universe-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Compile
        run: python -m py_compile research/sol_score3_sell_c_hard_failure_universe_v1.py
      - name: Run frozen audit
        run: python research/sol_score3_sell_c_hard_failure_universe_v1.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-score3-sell-c-hard-failure-universe-v1
          if-no-files-found: error
          path: |
            SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_*.csv
            SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_*.md
            SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_*.txt
            research/SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_PREREG.md
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_*.csv SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_*.md SOL_SCORE3_SELL_C_HARD_FAILURE_UNIVERSE_V1_*.txt
          if git diff --cached --quiet; then
            echo "No generated changes to persist"
          else
            git commit -m "persist SOL missing-C hard-failure universe v1 result"
            git pull --rebase origin sol-score3-sell-c-hard-failure-universe-v1
            git push origin HEAD:sol-score3-sell-c-hard-failure-universe-v1
          fi
