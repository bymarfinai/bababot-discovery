name: B27BI sideways continuation-transition feature audit

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_sideways_continuation_transition_features_b27bi.py'
      - 'BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_Preregistration.md'
      - '.github/workflows/b27bi.yml'
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_sideways_continuation_transition_features_b27bi.py
      - name: Run B27BI
        run: python research/btc_24h_sideways_continuation_transition_features_b27bi.py
      - name: Persist results on main push only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_Result.md \
                  BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_Episodes.csv \
                  BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_ScoreSummary.csv \
                  BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_ClauseSummary.csv \
                  BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_FeatureSummary.csv \
                  BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_Masks.csv \
                  BTC_24H_SIDEWAYS_CONTINUATION_TRANSITION_FEATURES_B27BI_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BI continuation-transition feature audit results'
            git push
          fi
