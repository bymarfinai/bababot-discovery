name: BTC Continuous MA Failure Survival B22F

on:
  push:
    paths:
      - 'BTC_MA_FAILURE_SURVIVAL_B22F_Preregistration.md'
      - 'research/btc_ma_failure_survival_b22f.py'
      - '.github/workflows/btc-ma-failure-survival-b22f.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_MA_FAILURE_SURVIVAL_B22F_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_MA_FAILURE_SURVIVAL_B22F_Status.txt
          git commit -m 'ci: mark B22F runner started' || true
          git push || true
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research/btc_ma_failure_survival_b22f.py research/btc_opposing_htf_fakeout_b22e.py research/btc_strong_uptrend_lifecycle_b22b.py research/btc_mtf_bull_cascade_b21.py
      - name: Run B22F
        run: cd research && python btc_ma_failure_survival_b22f.py
      - name: Persist
        run: |
          git pull --rebase
          git add BTC_MA_FAILURE_SURVIVAL_B22F_Result.md BTC_MA_FAILURE_SURVIVAL_B22F_Result.json BTC_MA_FAILURE_SURVIVAL_B22F_Summary.csv BTC_MA_FAILURE_SURVIVAL_B22F_Events.csv
          git commit -m 'research: persist B22F continuous MA failure survival result' || true
          git push
