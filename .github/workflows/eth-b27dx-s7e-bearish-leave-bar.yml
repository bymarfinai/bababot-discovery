name: ETH B27DX S7E Bearish Leave Bar

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s7e-bearish-leave-bar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s7e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S7E bearish leave bar
        run: python research/eth_b27dx_s7e_bearish_leave_bar.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S7E_BEARISH_LEAVE_BAR_*.md ETH_B27DX_S7E_BEARISH_LEAVE_BAR_*.csv ETH_B27DX_S7E_BEARISH_LEAVE_BAR_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "research: persist ETH B27DX S7E bearish leave results"
          ok=0
          for i in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
