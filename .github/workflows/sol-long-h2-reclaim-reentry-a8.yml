name: SOL LONG H2 Reclaim Re-entry A8

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_H2_RECLAIM_REENTRY_A8_Preregistration.md'
      - 'research/sol_long_h2_reclaim_reentry_a8.py'
      - '.github/workflows/sol-long-h2-reclaim-reentry-a8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A8 reclaim re-entry
        run: python research/sol_long_h2_reclaim_reentry_a8.py
      - name: Persist A8 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_H2_RECLAIM_REENTRY_A8_Result.md \
                  SOL_LONG_H2_RECLAIM_REENTRY_A8_DEVELOPMENT.csv \
                  SOL_LONG_H2_RECLAIM_REENTRY_A8_OOS.csv \
                  SOL_LONG_H2_RECLAIM_REENTRY_A8_TRADES.csv \
                  SOL_LONG_H2_RECLAIM_REENTRY_A8_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL H2 reclaim reentry A8 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
