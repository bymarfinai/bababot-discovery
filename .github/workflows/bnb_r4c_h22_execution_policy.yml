name: BNB R4c H22 execution policy freeze

on:
  push:
    branches:
      - bnb-r4c-h22-execution-policy-freeze
    paths:
      - '.bnb-r4c-h22-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r4c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run BNB R4c H22 execution policy freeze
        run: python research/bnb_r4c_h22_execution_policy_freeze.py
      - name: Persist BNB R4c H22 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_R4C_H22_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist BNB R4c H22 execution policy"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-r4c-h22-execution-policy
          path: 'BNB_R4C_H22_*'
          if-no-files-found: error