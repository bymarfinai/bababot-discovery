name: SOL Long 15UTC W10 1m Range Compression A60

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - '.github/workflows/sol-long-15utc-w10-1m-range-compression-a60.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a60:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run A60 W10 1m range compression revalidation
        run: python research/sol_long_15utc_w10_1m_range_compression_a60.py

      - name: Persist A60 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_LONG_15UTC_W10_1M_RANGE_COMPRESSION_A60_METRICS.csv \
            SOL_LONG_15UTC_W10_1M_RANGE_COMPRESSION_A60_BLOCKS.csv \
            SOL_LONG_15UTC_W10_1M_RANGE_COMPRESSION_A60_Result.md \
            SOL_LONG_15UTC_W10_1M_RANGE_COMPRESSION_A60_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: persist A60 W10 1m range compression"
            git push origin HEAD:research/sol-long-structure-a1-run
          fi
