name: BTC Opposing HTF Fakeout B22E

on:
  push:
    paths:
      - 'BTC_OPPOSING_HTF_FAKEOUT_B22E_Preregistration.md'
      - 'research/btc_opposing_htf_fakeout_b22e.py'
      - '.github/workflows/btc-opposing-htf-fakeout-b22e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_OPPOSING_HTF_FAKEOUT_B22E_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_OPPOSING_HTF_FAKEOUT_B22E_Status.txt
          git commit -m 'ci: mark B22E runner started' || true
          git push || true
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Compile
        run: python -m py_compile research/btc_opposing_htf_fakeout_b22e.py research/btc_strong_uptrend_lifecycle_b22b.py research/btc_mtf_bull_cascade_b21.py
      - name: Run B22E
        run: cd research && python btc_opposing_htf_fakeout_b22e.py
      - name: Persist
        run: |
          git pull --rebase
          git add BTC_OPPOSING_HTF_FAKEOUT_B22E_Result.md BTC_OPPOSING_HTF_FAKEOUT_B22E_Result.json BTC_OPPOSING_HTF_FAKEOUT_B22E_Summary.csv BTC_OPPOSING_HTF_FAKEOUT_B22E_Events.csv
          git commit -m 'research: persist B22E opposing HTF fakeout result' || true
          git push
