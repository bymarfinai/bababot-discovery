name: ETH B27DX S5B Runner Breathing Gap

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s5b-runner-breathing-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S5B breathing-gap geometry
        run: python research/eth_b27dx_s5b_runner_breathing_gap.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S5B_RUNNER_BREATHING_GAP_*.md ETH_B27DX_S5B_RUNNER_BREATHING_GAP_*.csv ETH_B27DX_S5B_RUNNER_BREATHING_GAP_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH B27DX S5B breathing-gap results"
            git pull --rebase origin main
            git push origin main
          fi
