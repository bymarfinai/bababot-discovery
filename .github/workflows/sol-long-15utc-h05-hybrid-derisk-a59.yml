name: SOL Long 15UTC H05 Hybrid Derisk A59

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - '.github/workflows/sol-long-15utc-h05-hybrid-derisk-a59.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a59:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run A59 H05 hybrid derisk rearm
        run: python research/sol_long_15utc_h05_hybrid_derisk_a59.py

      - name: Persist A59 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SOL_LONG_15UTC_H05_HYBRID_DERISK_A59_TRADES.csv \
            SOL_LONG_15UTC_H05_HYBRID_DERISK_A59_METRICS.csv \
            SOL_LONG_15UTC_H05_HYBRID_DERISK_A59_BLOCKS.csv \
            SOL_LONG_15UTC_H05_HYBRID_DERISK_A59_DIAGNOSTICS.csv \
            SOL_LONG_15UTC_H05_HYBRID_DERISK_A59_Result.md \
            SOL_LONG_15UTC_H05_HYBRID_DERISK_A59_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: persist A59 H05 hybrid derisk result"
            git push origin HEAD:research/sol-long-structure-a1-run
          fi
