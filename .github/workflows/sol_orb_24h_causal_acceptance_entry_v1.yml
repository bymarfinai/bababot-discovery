name: SOL ORB 24H Causal Acceptance Entry v1
on:
  workflow_dispatch:
  push:
    branches: [sol-orb-structure-detector-v1]
    paths:
      - 'research/sol_orb_24h_causal_acceptance_entry_v1.py'
      - 'SOL_ORB_24H_CAUSAL_ACCEPTANCE_ENTRY_V1_PREREG.md'
      - '.sol-orb-24h-causal-acceptance-entry-v1-trigger'
      - '.github/workflows/sol_orb_24h_causal_acceptance_entry_v1.yml'
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run SOL ORB 24h causal acceptance entry v1
        run: |
          set -euo pipefail
          python -m py_compile research/sol_orb_24h_causal_acceptance_entry_v1.py
          python research/sol_orb_24h_causal_acceptance_entry_v1.py | tee SOL_ORB_24H_CAUSAL_ACCEPTANCE_ENTRY_V1_Run.log
      - uses: actions/upload-artifact@v4
        with:
          name: sol-orb-24h-causal-acceptance-entry-v1
          path: SOL_ORB_24H_CAUSAL_ACCEPTANCE_ENTRY_V1_*
          if-no-files-found: error
