name: SOL V5 Batch2E Directional Sequence

on:
  workflow_dispatch:
  push:
    branches:
      - sol-v5-batch2e-directional-sequence
    paths:
      - 'research/sol_v5_batch2e_directional_sequence.py'
      - 'research/SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_PREREG.md'
      - '.github/workflows/sol_v5_batch2e_directional_sequence.yml'

jobs:
  directional-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Run frozen Batch 2E directional sequence
        run: python research/sol_v5_batch2e_directional_sequence.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-v5-batch2e-directional-sequence
          if-no-files-found: error
          path: |
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_Predictions.csv
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_SelectedEntries.csv
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_YearSummary.csv
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_FeatureImportance.csv
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_ChannelImportance.csv
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_GateAudit.csv
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_Result.md
            SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_Status.txt
            research/SOL_V5_BATCH2E_DIRECTIONAL_SEQUENCE_PREREG.md
