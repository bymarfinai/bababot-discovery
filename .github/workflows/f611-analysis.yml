name: F6.11 Analysis
on:
  push:
    paths:
      - 'research/f611_friday_fibonacci_forensic.py'
      - '.github/workflows/f611-analysis.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: |
          cd research
          python f611_friday_fibonacci_forensic.py
      - uses: actions/upload-artifact@v4
        with:
          name: f611-output
          path: research/f611_out/
