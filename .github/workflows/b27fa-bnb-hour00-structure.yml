name: B27FA BNB hour00 structural discovery

on:
  push:
    branches:
      - bnb-hour00-structure-b27fa
    paths:
      - 'BNB_HOURLY_STRUCTURE_B27FA_Preregistration.md'
      - 'research/bnb_hourly_structure_b27fa.py'
      - '.github/workflows/b27fa-bnb-hour00-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FA structural discovery
        run: python research/bnb_hourly_structure_b27fa.py | tee BNB_HOURLY_STRUCTURE_B27FA_Run.log
      - name: Persist B27FA outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_HOURLY_STRUCTURE_B27FA_Detail.csv \
                  BNB_HOURLY_STRUCTURE_B27FA_Summary.csv \
                  BNB_HOURLY_STRUCTURE_B27FA_Result.md \
                  BNB_HOURLY_STRUCTURE_B27FA_Status.txt \
                  BNB_HOURLY_STRUCTURE_B27FA_Run.log
          git diff --cached --quiet || git commit -m "persist B27FA BNB hour00 structural result"
          git push origin HEAD:bnb-hour00-structure-b27fa
