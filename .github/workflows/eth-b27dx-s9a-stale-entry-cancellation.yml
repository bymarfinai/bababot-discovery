name: ETH B27DX S9A Stale Entry Cancellation

on:
  workflow_dispatch:
  push:
    paths:
      - 'ETH_B27DX_S9A_STALE_ENTRY_CANCELLATION_Preregistration.md'
      - 'research/eth_b27dx_s9a_stale_entry_cancellation.py'
      - '.github/workflows/eth-b27dx-s9a-stale-entry-cancellation.yml'

jobs:
  s9a:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/eth_b27dx_s9a_stale_entry_cancellation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S9A_STALE_ENTRY_CANCELLATION_*.md ETH_B27DX_S9A_STALE_ENTRY_CANCELLATION_*.csv ETH_B27DX_S9A_STALE_ENTRY_CANCELLATION_*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist ETH B27DX S9A results"
          git pull --rebase origin main
          git push
