name: SOL LONG H1 Loss Recovery A4

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_H1_LOSS_RECOVERY_A4_Preregistration.md'
      - 'research/sol_long_h1_loss_recovery_a4.py'
      - '.github/workflows/sol-long-h1-loss-recovery-a4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A4 loss recovery
        run: python research/sol_long_h1_loss_recovery_a4.py
      - name: Persist A4 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_H1_LOSS_RECOVERY_A4_Result.md \
                  SOL_LONG_H1_LOSS_RECOVERY_A4_ANATOMY.csv \
                  SOL_LONG_H1_LOSS_RECOVERY_A4_DEVELOPMENT.csv \
                  SOL_LONG_H1_LOSS_RECOVERY_A4_OOS.csv \
                  SOL_LONG_H1_LOSS_RECOVERY_A4_TRADES.csv \
                  SOL_LONG_H1_LOSS_RECOVERY_A4_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL LONG H1 loss recovery A4 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
