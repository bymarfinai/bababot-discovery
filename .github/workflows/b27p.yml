name: B27P
on:
  push:
    paths:
      - '.github/workflows/b27p.yml'
      - 'research/btc_all_tf_first_retest_midpoint_entry_b27p.py'
      - 'BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_Status.txt
          git commit -m 'ci: mark B27P runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_all_tf_first_retest_midpoint_entry_b27p.py
      - run: cd research && python btc_all_tf_first_retest_midpoint_entry_b27p.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_Result.md BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_Summary.csv BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_Trades.csv BTC_ALL_TF_FIRST_RETEST_MIDPOINT_ENTRY_B27P_StatusCounts.csv
          git commit -m 'research: persist B27P corrected all-TF midpoint result' || true
          git push
