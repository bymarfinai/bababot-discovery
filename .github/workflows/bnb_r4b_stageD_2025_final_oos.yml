name: BNB R4b StageD 2025 final OOS

on:
  push:
    branches:
      - bnb-r4b-cohort-plateau-screen
    paths:
      - '.bnb-r4b-stageD-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stageD:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run BNB R4b 2025 final full-year OOS
        run: python research/bnb_r4b_stageD_2025_final_oos.py
      - name: Persist BNB R4b Stage D outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_R4B_STAGED_2025_*
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist BNB R4b stageD 2025 final OOS"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bnb-r4b-stageD-2025-final-oos
          path: 'BNB_R4B_STAGED_2025_*'
          if-no-files-found: error
