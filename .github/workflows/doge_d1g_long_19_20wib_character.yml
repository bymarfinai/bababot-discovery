name: DOGE D1G 19-20 WIB LONG character

on:
  push:
    branches:
      - doge-d1g-long-19-20wib-character
    paths:
      - '.doge-d1g-trigger'
  workflow_dispatch:

jobs:
  doge-d1g:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run preregistered DOGE D1G
        run: |
          set -euo pipefail
          LOG=DOGE_D1G_LONG_19_20WIB_CHARACTER_Run.log
          echo 'DOGE D1G 19:00-20:00 WIB LONG pair-native character discovery' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/doge_d1g_long_19_20wib_character.py 2>&1 | tee -a "$LOG"
          python research/doge_d1g_long_19_20wib_character.py 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: doge-d1g-long-19-20wib-character
          path: DOGE_D1G_LONG_19_20WIB_CHARACTER_*
          if-no-files-found: warn
