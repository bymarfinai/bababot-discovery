name: ETH transfer M2 pre-H2 entry grid

on:
  push:
    branches: [main]
    paths:
      - 'ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_Preregistration.md'
      - 'research/eth_f85_f15_transfer_m2_pre_h2_entry_grid.py'
      - '.github/workflows/eth_transfer_m2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  m2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH transfer M2 only
        id: m2
        shell: bash
        run: |
          set +e
          LOG=ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_Run.log
          echo 'ETH transfer M2 pre-H2 structural entry grid' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/eth_f85_f15_transfer_m2_pre_h2_entry_grid.py >> "$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python research/eth_f85_f15_transfer_m2_pre_h2_entry_grid.py >> "$LOG" 2>&1
            rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-transfer-m2-pre-h2-grid
          path: ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_*
      - name: Persist M2 outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A ETH_F85_F15_TRANSFER_M2_PRE_H2_ENTRY_GRID_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist ETH transfer M2 pre-H2 results'
            git push || true
          fi
      - name: Fail on M2 execution error
        if: steps.m2.outputs.rc != '0'
        run: exit 1
