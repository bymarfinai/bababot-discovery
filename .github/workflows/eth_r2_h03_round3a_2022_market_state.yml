name: ETH R2 H03 round3a 2022 market-state discovery

on:
  push:
    branches:
      - eth-r2-h03-robust-lab
    paths:
      - '.r2-h03-r3a-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round3a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run R2 H03 round3a 2022 market-state discovery
        run: python research/eth_r2_h03_round3a_2022_market_state.py
      - name: Persist R2 H03 round3a outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_R2_H03_R3A_2022Grid.csv ETH_R2_H03_R3A_2022Regions.csv ETH_R2_H03_R3A_Result.md ETH_R2_H03_R3A_Status.txt
          if [ -f ETH_R2_H03_R3A_Frozen2022Region.csv ]; then git add ETH_R2_H03_R3A_Frozen2022Region.csv; fi
          if git diff --cached --quiet; then
            echo "No result changes to persist"
          else
            git commit -m "research: persist ETH R2 H03 round3a 2022 market-state discovery"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eth-r2-h03-round3a-2022-market-state
          path: |
            ETH_R2_H03_R3A_2022Grid.csv
            ETH_R2_H03_R3A_2022Regions.csv
            ETH_R2_H03_R3A_Result.md
            ETH_R2_H03_R3A_Status.txt
            ETH_R2_H03_R3A_Frozen2022Region.csv
