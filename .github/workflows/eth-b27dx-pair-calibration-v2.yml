name: ETH B27DX Pair Calibration V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/eth_b27dx_pair_calibration_v2.py'
      - 'ETH_B27DX_PAIR_CALIBRATION_V2_Preregistration.md'
      - '.github/workflows/eth-b27dx-pair-calibration-v2.yml'
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests
      - name: Run calibration
        run: python research/eth_b27dx_pair_calibration_v2.py > ETH_B27DX_PAIR_CALIBRATION_V2_Run.log 2>&1
      - name: Persist results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_PAIR_CALIBRATION_V2_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist ETH B27DX pair calibration v2"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
