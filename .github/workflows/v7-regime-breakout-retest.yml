name: V7 Regime Breakout Retest Screen

on:
  push:
    paths:
      - 'research/v7_b_regime_breakout_retest.py'
      - 'research/v7_regime_failed_breakout.py'
      - '.github/workflows/v7-regime-breakout-retest.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check numpy>=1.26.0
      - name: Run frozen V7-B 120d screen
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/v7_b_regime_breakout_retest.py
