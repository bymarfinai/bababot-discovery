name: BTC ORB B0 Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_orb_b0_baseline.py'
      - 'BTC_ORB_B0_Preregistration.md'
      - '.github/workflows/btc-orb-b0.yml'

permissions:
  contents: write

concurrency:
  group: btc-orb-b0
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Run frozen ORB B0
        id: run
        continue-on-error: true
        run: |
          set +e
          python research/btc_orb_b0_baseline.py > BTC_ORB_B0_Run.log 2>&1
          code=$?
          echo "$code" > BTC_ORB_B0_EXIT_CODE.txt
          cat BTC_ORB_B0_Run.log
          exit $code
      - name: Persist results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_ORB_B0_Run.log BTC_ORB_B0_EXIT_CODE.txt
          for f in BTC_ORB_B0_Result.md BTC_ORB_B0_Result.json BTC_ORB_B0_Trades.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC ORB B0 result"
            git push
          fi
      - name: Fail if run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
