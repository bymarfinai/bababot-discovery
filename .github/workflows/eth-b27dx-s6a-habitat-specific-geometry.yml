name: ETH B27DX S6A Habitat Specific Geometry

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s6a-habitat-specific-geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s6a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S6A habitat-specific geometry
        run: python research/eth_b27dx_s6a_habitat_specific_geometry.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S6A_HABITAT_SPECIFIC_GEOMETRY_*.md ETH_B27DX_S6A_HABITAT_SPECIFIC_GEOMETRY_*.csv ETH_B27DX_S6A_HABITAT_SPECIFIC_GEOMETRY_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH B27DX S6A habitat-specific geometry results"
            git pull --rebase origin main
            git push origin main
          fi
