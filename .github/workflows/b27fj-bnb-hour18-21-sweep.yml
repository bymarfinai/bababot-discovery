name: B27FJ BNB hour18-21 structural sweep

on:
  push:
    branches:
      - bnb-hour18-21-sweep-b27fj
    paths:
      - 'BNB_HOURLY_SWEEP_B27FJ_Preregistration.md'
      - 'research/bnb_hourly_sweep_b27fj.py'
      - '.github/workflows/b27fj-bnb-hour18-21-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run B27FJ structural sweep
        run: python research/bnb_hourly_sweep_b27fj.py | tee BNB_HOURLY_SWEEP_B27FJ_Run.log
      - name: Persist B27FJ outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BNB_HOURLY_SWEEP_B27FJ_Detail.csv \
                  BNB_HOURLY_SWEEP_B27FJ_Summary.csv \
                  BNB_HOURLY_SWEEP_B27FJ_Result.md \
                  BNB_HOURLY_SWEEP_B27FJ_Status.txt \
                  BNB_HOURLY_SWEEP_B27FJ_Run.log
          git diff --cached --quiet || git commit -m "persist B27FJ BNB hour18-21 structural sweep result"
          git push origin HEAD:bnb-hour18-21-sweep-b27fj
