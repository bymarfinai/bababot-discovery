name: SOL Long 15UTC A36 Block Regime A37B
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [research/sol-long-structure-a1-run]
    paths:
      - 'research/sol_long_15utc_a36_block_regime_a37b.py'
      - 'SOL_LONG_15UTC_A36_BLOCK_REGIME_A37B_Correction.md'
      - '.github/workflows/sol-long-15utc-a36-block-regime-a37b.yml'
jobs:
  a37b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run corrected A37B support count
        run: python research/sol_long_15utc_a36_block_regime_a37b.py
      - name: Persist A37B outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOL_LONG_15UTC_A36_BLOCK_REGIME_A37B_*.md SOL_LONG_15UTC_A36_BLOCK_REGIME_A37B_*.csv SOL_LONG_15UTC_A36_BLOCK_REGIME_A37B_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist corrected A37B support count'
          git push origin HEAD:research/sol-long-structure-a1-run
