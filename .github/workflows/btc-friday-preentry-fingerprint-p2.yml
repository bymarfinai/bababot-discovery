name: BTC Friday Preentry Fingerprint P2

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_friday_preentry_fingerprint_p2.py'
      - 'BTC_Friday_Preentry_Fingerprint_P2_Preregistration.md'
      - '.github/workflows/btc-friday-preentry-fingerprint-p2.yml'

permissions:
  contents: write

concurrency:
  group: btc-friday-preentry-fingerprint-p2
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run frozen P2
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_friday_preentry_fingerprint_p2.py > BTC_Friday_Preentry_Fingerprint_P2_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Friday_Preentry_Fingerprint_P2_EXIT_CODE.txt
          cat BTC_Friday_Preentry_Fingerprint_P2_Run.log
          exit $code
      - name: Persist artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Friday_Preentry_Fingerprint_P2_EXIT_CODE.txt BTC_Friday_Preentry_Fingerprint_P2_Run.log
          for f in BTC_Friday_Preentry_Fingerprint_P2_Result.md BTC_Friday_Preentry_Fingerprint_P2_Result.json BTC_Friday_Preentry_Fingerprint_P2_Rows.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC Friday preentry fingerprint P2 result"
            git push
          fi
      - name: Fail if test failed
        if: steps.run.outcome == 'failure'
        run: exit 1
