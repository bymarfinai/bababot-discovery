name: BTC Friday Research Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_friday_preentry_fingerprint_p2.py'
      - 'BTC_Friday_Preentry_Fingerprint_P2_Preregistration.md'
      - 'research/btc_friday_all15m_candle_c1.py'
      - 'BTC_Friday_All15m_Candle_C1_Preregistration.md'
      - '.github/workflows/btc-friday-preentry-fingerprint-p2.yml'

permissions:
  contents: write

concurrency:
  group: btc-friday-research-runner
  cancel-in-progress: false

jobs:
  c1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Run frozen C1
        id: c1run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_friday_all15m_candle_c1.py > BTC_Friday_All15m_Candle_C1_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Friday_All15m_Candle_C1_EXIT_CODE.txt
          cat BTC_Friday_All15m_Candle_C1_Run.log
          exit $code
      - name: Persist C1 artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Friday_All15m_Candle_C1_EXIT_CODE.txt BTC_Friday_All15m_Candle_C1_Run.log
          for f in BTC_Friday_All15m_Candle_C1_Result.md BTC_Friday_All15m_Candle_C1_Result.json BTC_Friday_All15m_Candle_C1_Rows.csv BTC_Friday_All15m_Candle_C1_Discovery_Archetypes.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC Friday all15m candle C1 result"
            git push
          fi
      - name: Fail if C1 failed
        if: steps.c1run.outcome == 'failure'
        run: exit 1
