name: SOL V5 Batch2D State-Time Direction

on:
  workflow_dispatch:
  push:
    branches:
      - sol-v5-batch2d-state-time-direction
    paths:
      - 'research/sol_v5_batch2d_state_time_direction.py'
      - 'research/SOL_V5_BATCH2D_STATE_TIME_DIRECTION_PREREG.md'
      - '.github/workflows/sol_v5_batch2d_state_time_direction.yml'

jobs:
  state-time-direction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests scipy scikit-learn
      - name: Run frozen Batch 2D state-time selector
        run: python research/sol_v5_batch2d_state_time_direction.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-v5-batch2d-state-time-direction
          if-no-files-found: error
          path: |
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_Predictions.csv
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_SelectedEntries.csv
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_YearSummary.csv
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_FeatureImportance.csv
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_GateAudit.csv
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_Result.md
            SOL_V5_BATCH2D_STATE_TIME_DIRECTION_Status.txt
            research/SOL_V5_BATCH2D_STATE_TIME_DIRECTION_PREREG.md
