name: B27BN registry maintenance

on:
  push:
    branches: [main]
    paths:
      - 'research/maintenance/add_b27bn_registry.py'
      - '.github/workflows/b27bn_registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/maintenance/add_b27bn_registry.py
      - name: Commit registry update if needed
        run: |
          if git diff --quiet -- BABA_BOT_RESEARCH_RESULTS_REGISTRY.md; then
            echo 'No registry change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BABA_BOT_RESEARCH_RESULTS_REGISTRY.md
          git commit -m 'record B27BN swing-boundary invalidation in registry'
          git push
