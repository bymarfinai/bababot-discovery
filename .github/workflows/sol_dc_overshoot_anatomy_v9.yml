name: SOL DC Overshoot Anatomy V9
on:
  push:
    branches: [research/sol-dc-overshoot-anatomy-v9]
    paths:
      - 'research/sol_dc_overshoot_anatomy_v9.py'
      - 'research/SOL_DC_OVERSHOOT_ANATOMY_V9_PREREG.md'
      - '.github/workflows/sol_dc_overshoot_anatomy_v9.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests scipy scikit-learn
      - run: python -m py_compile research/sol_dc_overshoot_anatomy_v9.py
      - run: python research/sol_dc_overshoot_anatomy_v9.py
      - uses: actions/upload-artifact@v4
        with:
          name: sol-dc-overshoot-anatomy-v9
          if-no-files-found: error
          path: |
            SOL_DC_OVERSHOOT_ANATOMY_V9_Events.csv
            SOL_DC_OVERSHOOT_ANATOMY_V9_Counts.csv
            SOL_DC_OVERSHOOT_ANATOMY_V9_FeatureStats.csv
            SOL_DC_OVERSHOOT_ANATOMY_V9_StableSeparators.csv
            SOL_DC_OVERSHOOT_ANATOMY_V9_Result.md
            SOL_DC_OVERSHOOT_ANATOMY_V9_Status.txt
            research/SOL_DC_OVERSHOOT_ANATOMY_V9_PREREG.md
