name: BTC H1 Session Offset Pattern Map Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_h1_session_offset_pattern_map.py'
      - 'BTC_H1_Session_Offset_Pattern_Map_Preregistration.md'
      - '.github/workflows/btc-friday-allhour-candle-c0.yml'

permissions:
  contents: write

concurrency:
  group: btc-h1-session-offset-pattern-map
  cancel-in-progress: true

jobs:
  h1map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Run frozen H1 map
        id: h1run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_h1_session_offset_pattern_map.py > BTC_H1_Session_Offset_Pattern_Map_Run.log 2>&1
          code=$?
          echo "$code" > BTC_H1_Session_Offset_Pattern_Map_EXIT_CODE.txt
          cat BTC_H1_Session_Offset_Pattern_Map_Run.log
          exit $code
      - name: Persist H1 artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_H1_Session_Offset_Pattern_Map_EXIT_CODE.txt BTC_H1_Session_Offset_Pattern_Map_Run.log
          for f in BTC_H1_Session_Offset_Pattern_Map_Result.md BTC_H1_Session_Offset_Pattern_Map_Result.json BTC_H1_Session_Offset_Pattern_Map_August.csv BTC_H1_Session_Offset_Pattern_Map_Cells.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m h1-session-map-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_H1_Session_Offset_Pattern_Map_EXIT_CODE.txt BTC_H1_Session_Offset_Pattern_Map_Run.log
            for f in BTC_H1_Session_Offset_Pattern_Map_Result.md BTC_H1_Session_Offset_Pattern_Map_Result.json BTC_H1_Session_Offset_Pattern_Map_August.csv BTC_H1_Session_Offset_Pattern_Map_Cells.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist H1 session-offset pattern map"
            git push
          fi
      - name: Fail if H1 map failed
        if: steps.h1run.outcome == 'failure'
        run: exit 1
