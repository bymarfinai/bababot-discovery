name: BTC Friday Premium Dislocation C7A Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_friday_c7a_premium_dislocation.py'
      - 'BTC_Friday_C7A_Premium_Dislocation_Preregistration.md'
      - '.github/workflows/btc-friday-allhour-candle-c0.yml'

permissions:
  contents: write

concurrency:
  group: btc-friday-c7a-premium
  cancel-in-progress: true

jobs:
  c7a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run frozen C7A
        id: c7arun
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_friday_c7a_premium_dislocation.py > BTC_Friday_C7A_Premium_Dislocation_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Friday_C7A_Premium_Dislocation_EXIT_CODE.txt
          cat BTC_Friday_C7A_Premium_Dislocation_Run.log
          exit $code
      - name: Persist C7A artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Friday_C7A_Premium_Dislocation_EXIT_CODE.txt BTC_Friday_C7A_Premium_Dislocation_Run.log
          for f in BTC_Friday_C7A_Premium_Dislocation_Result.md BTC_Friday_C7A_Premium_Dislocation_Result.json BTC_Friday_C7A_Premium_Dislocation_Rows.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m c7a-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_Friday_C7A_Premium_Dislocation_EXIT_CODE.txt BTC_Friday_C7A_Premium_Dislocation_Run.log
            for f in BTC_Friday_C7A_Premium_Dislocation_Result.md BTC_Friday_C7A_Premium_Dislocation_Result.json BTC_Friday_C7A_Premium_Dislocation_Rows.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist BTC Friday premium dislocation C7A result"
            git push
          fi
      - name: Fail if C7A failed
        if: steps.c7arun.outcome == 'failure'
        run: exit 1
