name: BTC Friday SR81 Isolated Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_friday_sr81_prior_proof_level.py'
      - 'research/btc_friday_sr81_prior_proof_level_fast.py'
      - 'BTC_Friday_SR81_Prior_Proof_Level_Preregistration.md'
      - '.github/workflows/btc-friday-allhour-candle-c0.yml'

permissions:
  contents: write

concurrency:
  group: btc-friday-sr81-isolated
  cancel-in-progress: true

jobs:
  sr81:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run exact frozen SR81 with equivalent fast ATR lookup
        id: sr81run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_friday_sr81_prior_proof_level_fast.py > BTC_Friday_SR81_Prior_Proof_Level_Run.log 2>&1
          code=$?
          echo "$code" > BTC_Friday_SR81_Prior_Proof_Level_EXIT_CODE.txt
          cat BTC_Friday_SR81_Prior_Proof_Level_Run.log
          exit $code
      - name: Persist exact SR81 artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_Friday_SR81_Prior_Proof_Level_EXIT_CODE.txt BTC_Friday_SR81_Prior_Proof_Level_Run.log
          for f in BTC_Friday_SR81_Prior_Proof_Level_Result.md BTC_Friday_SR81_Prior_Proof_Level_Result.json BTC_Friday_SR81_Prior_Proof_Level_Rows.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m sr81-isolated-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_Friday_SR81_Prior_Proof_Level_EXIT_CODE.txt BTC_Friday_SR81_Prior_Proof_Level_Run.log
            for f in BTC_Friday_SR81_Prior_Proof_Level_Result.md BTC_Friday_SR81_Prior_Proof_Level_Result.json BTC_Friday_SR81_Prior_Proof_Level_Rows.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist exact BTC Friday SR81 prior-proof result"
            git push
          fi
      - name: Fail if SR81 failed
        if: steps.sr81run.outcome == 'failure'
        run: exit 1
