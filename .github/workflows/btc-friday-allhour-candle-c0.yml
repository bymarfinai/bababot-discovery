name: BTC H1 LOW_REJECT StdDev SD1 Matrix Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_h1_low_reject_stddev_sd1_threshold_matrix.py'
      - '.github/workflows/btc-friday-allhour-candle-c0.yml'

permissions:
  contents: write

concurrency:
  group: btc-h1-low-reject-stddev-sd1-matrix
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests scikit-learn
      - name: Run SD1 threshold matrix
        id: run
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=research python research/btc_h1_low_reject_stddev_sd1_threshold_matrix.py > BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_Run.log 2>&1
          code=$?
          echo "$code" > BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_EXIT_CODE.txt
          cat BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_Run.log
          exit $code
      - name: Persist matrix artifacts safely
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_EXIT_CODE.txt BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_Run.log
          for f in BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix.md BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git stash push --include-untracked -m sd1-matrix-artifacts
            git pull --rebase origin main
            git stash pop
            git add BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_EXIT_CODE.txt BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix_Run.log
            for f in BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix.md BTC_H1_LowReject_StdDev_SD1_Threshold_Matrix.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "research: persist SD1 threshold matrix"
            git push
          fi
      - name: Fail if matrix failed
        if: steps.run.outcome == 'failure'
        run: exit 1
