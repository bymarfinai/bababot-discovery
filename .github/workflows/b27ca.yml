name: B27CA pre-break retest ladder anatomy

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_prebreak_retest_ladder_b27ca.py'
      - 'BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Preregistration.md'
      - '.github/workflows/b27ca.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_prebreak_retest_ladder_b27ca.py
      - name: Run B27CA
        run: python research/btc_24h_prebreak_retest_ladder_b27ca.py
      - uses: actions/upload-artifact@v4
        with:
          name: b27ca-results
          path: |
            BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Result.md
            BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Events.csv
            BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Candidates.csv
            BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Anatomy.csv
            BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Selection.csv
            BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Status.txt
      - name: Persist B27CA outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Result.md \
                  BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Events.csv \
                  BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Candidates.csv \
                  BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Anatomy.csv \
                  BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Selection.csv \
                  BTC_24H_PREBREAK_RETEST_LADDER_B27CA_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27CA pre-break retest ladder results'
            git push
          fi
