name: SOL Long Two-Zone Benchmark A19

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_TWO_ZONE_BENCHMARK_A19_Preregistration.md'
      - 'research/sol_long_two_zone_benchmark_a19.py'
      - '.github/workflows/sol-long-two-zone-benchmark-a19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas requests

      - name: Run A19 two-zone benchmark
        run: python research/sol_long_two_zone_benchmark_a19.py

      - name: Persist A19 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOL_LONG_TWO_ZONE_BENCHMARK_A19_Result.md \
                  SOL_LONG_TWO_ZONE_BENCHMARK_A19_SUMMARY.csv \
                  SOL_LONG_TWO_ZONE_BENCHMARK_A19_COMPONENTS.csv \
                  SOL_LONG_TWO_ZONE_BENCHMARK_A19_Status.txt
          if git diff --cached --quiet; then
            echo "No A19 output changes"
            exit 0
          fi
          git commit -m "Persist SOL A19 two-zone benchmark results"
          for i in 1 2 3; do
            git pull --rebase origin research/sol-long-structure-a1-run && git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep 3
          done
          exit 1
