name: ETH B27DX S4 Portfolio Lock

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s4-portfolio-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S4 portfolio lock
        run: python research/eth_b27dx_s4_portfolio_lock.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S4_PORTFOLIO_LOCK_*.md ETH_B27DX_S4_PORTFOLIO_LOCK_*.csv ETH_B27DX_S4_PORTFOLIO_LOCK_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: persist ETH B27DX S4 portfolio lock results"
            git pull --rebase origin main
            git push origin main
          fi
