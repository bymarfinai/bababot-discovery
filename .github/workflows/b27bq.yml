name: B27BQ
on:
  push:
    paths:
      - '.github/workflows/b27bq.yml'
      - 'research/btc_london_ny_short_pre_second_touch_entry_b27bq.py'
      - 'BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Preregistration.md'
      - 'B27BQ_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Status.txt
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git add BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Status.txt
          git commit -m 'ci: mark B27BQ runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_short_pre_second_touch_entry_b27bq.py
      - run: cd research && python btc_london_ny_short_pre_second_touch_entry_b27bq.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 4189822+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Result.md BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Windows.csv BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Entries.csv BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Summary.csv BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_StatusCounts.csv
          git commit -m 'research: persist B27BQ SHORT pre-second-touch result' || true
          git push
