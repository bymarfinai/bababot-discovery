name: B27BQ

on:
  pull_request:
    branches: [main]
    paths:
      - 'B27BQ_PR_TRIGGER.txt'
      - 'research/btc_london_ny_short_pre_second_touch_entry_b27bq.py'
      - 'BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Preregistration.md'
      - '.github/workflows/b27bq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_london_ny_short_pre_second_touch_entry_b27bq.py
      - run: cd research && python btc_london_ny_short_pre_second_touch_entry_b27bq.py
      - uses: actions/upload-artifact@v4
        with:
          name: b27bq-results
          path: |
            BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Result.md
            BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Windows.csv
            BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Entries.csv
            BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_Summary.csv
            BTC_LONDON_NY_SHORT_PRE_SECOND_TOUCH_ENTRY_B27BQ_StatusCounts.csv
