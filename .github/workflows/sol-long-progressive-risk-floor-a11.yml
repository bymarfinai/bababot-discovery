name: SOL LONG Progressive Risk Floor A11

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_PROGRESSIVE_RISK_FLOOR_A11_Preregistration.md'
      - 'research/sol_long_progressive_risk_floor_a11.py'
      - '.github/workflows/sol-long-progressive-risk-floor-a11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A11 progressive risk floor
        run: python research/sol_long_progressive_risk_floor_a11.py
      - name: Persist A11 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_PROGRESSIVE_RISK_FLOOR_A11_Result.md \
                  SOL_LONG_PROGRESSIVE_RISK_FLOOR_A11_DEVELOPMENT.csv \
                  SOL_LONG_PROGRESSIVE_RISK_FLOOR_A11_OOS.csv \
                  SOL_LONG_PROGRESSIVE_RISK_FLOOR_A11_TRADES.csv \
                  SOL_LONG_PROGRESSIVE_RISK_FLOOR_A11_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL progressive risk floor A11 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
