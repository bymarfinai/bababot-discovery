name: SOL Long 15UTC Native Entry Target A46

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'research/sol_long_15utc_native_entry_target_a46.py'
      - 'SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_Preregistration.md'
      - '.github/workflows/sol-long-15utc-native-entry-target-a46.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a46:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Patch A46 report-column access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/sol_long_15utc_native_entry_target_a46.py')
          s = p.read_text(encoding='utf-8')
          old = '100*r.quantile'
          new = "100*r['quantile']"
          if old not in s:
              raise SystemExit('expected A46 report expression not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Run A46 native calibration
        run: python research/sol_long_15utc_native_entry_target_a46.py

      - name: Persist A46 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/sol_long_15utc_native_entry_target_a46.py \
                  SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_TARGETS.csv \
                  SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_DEVELOPMENT.csv \
                  SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_OOS.csv \
                  SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_TRADES.csv \
                  SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_Result.md \
                  SOL_LONG_15UTC_NATIVE_ENTRY_TARGET_A46_Status.txt
          git diff --cached --quiet || git commit -m 'research: persist A46 15UTC native entry-target calibration'
          git push origin HEAD:research/sol-long-structure-a1-run
