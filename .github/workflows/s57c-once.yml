name: S5.7C Saturday Hinge Rejection Robustness

on:
  push:
    paths:
      - '.github/workflows/s57c-once.yml'
  workflow_dispatch:

jobs:
  s57c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy requests
      - name: Run S5.7C
        env:
          S57C_OUT: s57c_out
        run: python research/s57c_hinge_rejection_robustness_management.py
      - name: Upload S5.7C outputs
        uses: actions/upload-artifact@v4
        with:
          name: s57c-output
          path: s57c_out/
