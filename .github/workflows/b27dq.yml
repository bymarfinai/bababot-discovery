name: B27DQ live-executable TP runner rescore

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_b27do_live_executable_exit_b27dq.py'
      - 'BTC_F85_LONG_B27DO_LIVE_EXECUTABLE_EXIT_B27DQ_Preregistration.md'
      - '.github/workflows/b27dq.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run B27DQ
        id: run
        shell: bash
        run: |
          set +e
          LOG=BTC_F85_LONG_B27DO_LIVE_EXECUTABLE_EXIT_B27DQ_Run.log
          echo 'B27DQ run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python -m py_compile research/btc_f85_long_b27do_live_executable_exit_b27dq.py >> "$LOG" 2>&1
          c=$?
          echo "compile_exit_code=$c" >> "$LOG"
          r=$c
          if [ "$c" -eq 0 ]; then
            for attempt in 1 2 3; do
              echo "run_attempt=$attempt" >> "$LOG"
              python research/btc_f85_long_b27do_live_executable_exit_b27dq.py >> "$LOG" 2>&1
              r=$?
              if [ "$r" -eq 0 ]; then break; fi
              sleep 10
            done
          fi
          echo "run_exit_code=$r" >> "$LOG"
          echo "rc=$r" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b27dq-live-executable-rescore
          path: |
            BTC_F85_LONG_B27DO_LIVE_EXECUTABLE_EXIT_B27DQ_*
      - name: Persist outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A BTC_F85_LONG_B27DO_LIVE_EXECUTABLE_EXIT_B27DQ_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DQ live-executable rescore outputs'
            git push || true
          fi
      - name: Fail if rescore script failed
        if: steps.run.outputs.rc != '0'
        run: exit 1
