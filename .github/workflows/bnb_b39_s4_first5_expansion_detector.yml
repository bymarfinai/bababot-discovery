name: BNB B39-S4 frozen first5 detector

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b39-s4-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b39-s4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2 matplotlib==3.10.6
      - name: Download immutable accepted A1 fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen_a1
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10336102957/zip" -o /tmp/a1.zip
          unzip -q /tmp/a1.zip -d frozen_a1
          test -f frozen_a1/BNB_B29_A1_STRUCTURE_FINGERPRINT.csv.gz
      - name: Run B39-S4
        run: |
          set -euo pipefail
          python -m py_compile research/bnb_b39_s4_first5_expansion_detector.py
          python research/bnb_b39_s4_first5_expansion_detector.py | tee BNB_B39_S4_FIRST5_EXPANSION_DETECTOR_Run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b39-s4-first5-expansion-detector
          path: |
            BNB_B39_S4_FIRST5_EXPANSION_DETECTOR*
          if-no-files-found: warn
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b39_s4
          for f in BNB_B39_S4_FIRST5_EXPANSION_DETECTOR*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b39_s4/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b39_s4
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B39-S4 frozen first5 detector'
            git pull --rebase origin bnb-b29-walkforward-reset
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
