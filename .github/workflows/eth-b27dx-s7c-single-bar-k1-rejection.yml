name: ETH B27DX S7C Single-Bar K1 Rejection

on:
  push:
    paths:
      - '.github/workflows/eth-b27dx-s7c-single-bar-k1-rejection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s7c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run S7C single-bar K1 rejection
        run: python research/eth_b27dx_s7c_single_bar_k1_rejection.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETH_B27DX_S7C_SINGLE_BAR_K1_REJECTION_*.md ETH_B27DX_S7C_SINGLE_BAR_K1_REJECTION_*.csv ETH_B27DX_S7C_SINGLE_BAR_K1_REJECTION_*.txt
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "research: persist ETH B27DX S7C single-bar K1 results"
          ok=0
          for i in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
