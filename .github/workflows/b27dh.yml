name: B27DH F85 long 0530 2330 filters
on:
  push:
    branches: [main]
    paths:
      - 'research/btc_f85_long_0530_2330_filter_b27dh.py'
      - '.github/workflows/b27dh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run B27DH
        run: |
          set +e
          LOG=BTC_F85_LONG_0530_2330_FILTER_B27DH_Run.log
          echo 'B27DH run start' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          python research/btc_f85_long_0530_2330_filter_b27dh.py >> "$LOG" 2>&1
          RC=$?
          echo "run_exit_code=$RC" >> "$LOG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A BTC_F85_LONG_0530_2330_FILTER_B27DH_* || true
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27DH 0530 2330 filter outputs'
            git push
          fi
          exit $RC
