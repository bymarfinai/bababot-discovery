name: ETH London NY M10 Pre-Breakout Failure Anatomy

on:
  push:
    paths:
      - 'ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_Preregistration.md'
      - 'research/eth_london_ny_m10_pre_breakout_failure_anatomy.py'
      - '.github/workflows/eth-london-ny-m10-pre-breakout-failure-anatomy.yml'
  workflow_dispatch:

jobs:
  m10:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ETH London-NY M10
        run: python research/eth_london_ny_m10_pre_breakout_failure_anatomy.py
      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_Result.md ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_Trades.csv ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_BoundarySummary.csv ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_StallSummary.csv ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_Audit.csv ETH_LONDON_NY_M10_PRE_BREAKOUT_FAILURE_ANATOMY_Status.txt
          git commit -m "research: persist ETH London-NY M10 failure anatomy" || true
          git push
