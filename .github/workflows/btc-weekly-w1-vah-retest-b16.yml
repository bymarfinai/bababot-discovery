name: BTC Weekly W1 VAH Retest B16
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btc_weekly_w1_vah_retest_b16.py'
      - 'BTC_WEEKLY_W1_VAH_RETEST_B16_Preregistration.md'
      - '.github/workflows/btc-weekly-w1-vah-retest-b16.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_WEEKLY_W1_VAH_RETEST_B16_Status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_W1_VAH_RETEST_B16_Status.txt
          git commit -m "ci: B16 runner heartbeat" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - run: pip install numpy pandas requests scikit-learn
      - name: Compile B16
        run: python -m py_compile research/btc_weekly_w1_vah_retest_b16.py
      - name: Run B16
        shell: bash
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=research python -u research/btc_weekly_w1_vah_retest_b16.py 2>&1 | tee BTC_WEEKLY_W1_VAH_RETEST_B16_Run.log
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTC_WEEKLY_W1_VAH_RETEST_B16_* || true
          if ! git diff --cached --quiet; then
            git commit -m "research: persist W1 VAH acceptance-retest B16 result"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((n*3))
            done
            exit 1
          fi
