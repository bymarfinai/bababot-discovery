name: B27BS age2 close-break 5m acceptance

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_24h_age2_close_break_5m_acceptance_b27bs.py'
      - 'BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Preregistration.md'
      - '.github/workflows/b27bs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python -m py_compile research/btc_24h_age2_close_break_5m_acceptance_b27bs.py
      - name: Run B27BS
        run: python research/btc_24h_age2_close_break_5m_acceptance_b27bs.py
      - uses: actions/upload-artifact@v4
        with:
          name: b27bs-results
          path: |
            BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Result.md
            BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Episodes.csv
            BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Summary.csv
            BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Status.txt
      - name: Persist B27BS outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Result.md \
                  BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Episodes.csv \
                  BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Summary.csv \
                  BTC_24H_AGE2_CLOSE_BREAK_5M_ACCEPTANCE_B27BS_Status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'persist B27BS age2 close-break acceptance results'
            git push
          fi
