name: SOL LONG E20 Conditional Protection A14

on:
  push:
    branches:
      - research/sol-long-structure-a1-run
    paths:
      - 'SOL_LONG_E20_CONDITIONAL_PROTECTION_A14_Preregistration.md'
      - 'research/sol_long_e20_conditional_protection_a14.py'
      - '.github/workflows/sol-long-e20-conditional-protection-a14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/sol-long-structure-a1-run
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -r requirements.txt pandas
      - name: Run A14 conditional protection
        run: python research/sol_long_e20_conditional_protection_a14.py
      - name: Persist A14 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOL_LONG_E20_CONDITIONAL_PROTECTION_A14_Result.md \
                  SOL_LONG_E20_CONDITIONAL_PROTECTION_A14_DEVELOPMENT.csv \
                  SOL_LONG_E20_CONDITIONAL_PROTECTION_A14_OOS.csv \
                  SOL_LONG_E20_CONDITIONAL_PROTECTION_A14_TRADES.csv \
                  SOL_LONG_E20_CONDITIONAL_PROTECTION_A14_Status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'research: persist SOL E20 conditional protection A14 results'
          for i in 1 2 3 4; do
            git pull --rebase origin research/sol-long-structure-a1-run && \
            git push origin HEAD:research/sol-long-structure-a1-run && exit 0
            sleep $((i * 2))
          done
          exit 1
