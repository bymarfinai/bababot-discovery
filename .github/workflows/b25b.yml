name: B25B TP SL Sweep
on:
  push:
    paths:
      - '.github/workflows/b25b.yml'
      - 'research/btc_4h_regime_15m_ema_tpsl_sweep_b25b.py'
      - 'BTC_4H_REGIME_15M_EMA_TPSL_SWEEP_B25B_Preregistration.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner heartbeat
        run: |
          echo "RUNNING run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BTC_4H_REGIME_15M_EMA_TPSL_SWEEP_B25B_Status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BTC_4H_REGIME_15M_EMA_TPSL_SWEEP_B25B_Status.txt
          git commit -m 'ci: mark B25B runner started' || true
          git push || true
      - run: pip install numpy pandas requests
      - run: python -m py_compile research/btc_4h_regime_15m_ema_tpsl_sweep_b25b.py
      - run: cd research && python btc_4h_regime_15m_ema_tpsl_sweep_b25b.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase
          git add BTC_4H_REGIME_15M_EMA_TPSL_SWEEP_B25B_Result.md BTC_4H_REGIME_15M_EMA_TPSL_SWEEP_B25B_Summary.csv BTC_4H_REGIME_15M_EMA_TPSL_SWEEP_B25B_Trades.csv
          git commit -m 'research: persist B25B TP SL sweep result' || true
          git push
