name: BNB B37-S1 H4 demand H1 structural twin

on:
  push:
    branches:
      - bnb-b29-walkforward-reset
    paths:
      - '.bnb-b37-s1-trigger'

permissions:
  contents: write
  actions: read

jobs:
  b37-s1-structural-twin:
    if: contains(github.event.head_commit.message, 'B37-S1:')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==3.0.5 numpy==2.4.6 requests==2.34.2 matplotlib==3.10.6
      - name: Download immutable accepted A1 fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen_a1
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10336102957/zip" \
            -o /tmp/a1.zip
          unzip -q /tmp/a1.zip -d frozen_a1
          test -f frozen_a1/BNB_B29_A1_STRUCTURE_FINGERPRINT.csv.gz
      - name: Run frozen Step-1 twin scanner
        run: |
          set -euo pipefail
          LOG=BNB_B37_S1_H4_DEMAND_H1_TWIN_Run.log
          echo 'BNB B37-S1 structural twin scanner' > "$LOG"
          echo "commit=$GITHUB_SHA" >> "$LOG"
          echo 'identity=BNB_B37_S1_H4_DEMAND_H1_TWIN_V1' >> "$LOG"
          python -m py_compile research/bnb_b37_s1_h4_demand_h1_twin.py 2>&1 | tee -a "$LOG"
          python research/bnb_b37_s1_h4_demand_h1_twin.py 2>&1 | tee -a "$LOG"
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-b37-s1-h4-demand-h1-twin
          path: |
            BNB_B37_S1_H4_DEMAND_H1_TWIN*
          if-no-files-found: warn
      - name: Persist Step-1 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/bnb_b37_s1
          for f in BNB_B37_S1_H4_DEMAND_H1_TWIN*; do
            if [ -f "$f" ]; then cp "$f" results/bnb_b37_s1/; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/bnb_b37_s1
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Persist B37-S1 structural twin evidence'
            git push origin HEAD:bnb-b29-walkforward-reset
          fi
