name: F6.3 Friday Candle Morphology
on:
  push:
    paths:
      - '.github/workflows/f63-once.yml'
  workflow_dispatch:
jobs:
  f63:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas requests
      - name: Run F6.3
        env:
          PYTHONPATH: research
        run: python research/f63_friday_failure60_candle_morphology.py
      - name: Upload F6.3 outputs
        uses: actions/upload-artifact@v4
        with:
          name: f63-output
          path: f63_out/
